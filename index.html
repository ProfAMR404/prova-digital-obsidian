um contato.\nEventual exclusão de mensagem enviada (na opção \"Apagar somente para Mim\") ou de mensagem recebida (em qualquer caso) não deixa absolutamente nenhum vestígio, seja no aplicativo, seja no computador emparelhado, e, por conseguinte, não pode jamais ser recuperada para efeitos de prova em processo penal, tendo em vista que a própria empresa disponibilizadora do serviço, em razão da tecnologia de encriptação ponta-a-ponta, não armazena em nenhum servidor o conteúdo das conversas dos usuários\" (RHC 99.735/SC, Rel. Ministra LAURITA VAZ, SEXTA TURMA, julgado em 27/11/2018, DJe 12/12/2018).\n4. Agravo regimental parcialmente provido, para declarar nulas as mensagens obtidas por meio do print screen da tela da ferramenta WhatsApp Web, determinando-se o desentranhamento delas dos autos, mantendo-se as demais provas produzidas após as diligências prévias da polícia realizadas em razão da notícia anônima dos crimes.","cit":"(AgRg no RHC n. 133.430/PE, relator Ministro Nefi Cordeiro, Sexta Turma, julgado em 23/2/2021, DJe de 26/2/2021.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202002175828&dt_publicacao=26/02/2021","origem":"Linha do tempo do STJ sobre print e captura de tela","grupo":""},{"id":"j801533498","eixo":"e10","trib":"STJ","classe":"RHC 99.735/SC","registro":"2018/0153349-8","rel":"Laurita Vaz","conv":"","relac":"","orgao":"6ª T.","data":"27/11/2018","dje":"12/12/2018","ementa":"RECURSO ORDINÁRIO EM HABEAS CORPUS. PENAL E PROCESSO PENAL. TRÁFICO DE DROGAS E ASSOCIAÇÃO AO TRÁFICO. AUTORIZAÇÃO JUDICIAL DE ESPELHAMENTO, VIA WHATSAPP WEB, DAS CONVERSAS REALIZADAS PELO INVESTIGADO COM TERCEIROS. ANALOGIA COM O INSTITUTO DA INTERCEPTAÇÃO TELEFÔNICA. IMPOSSIBILIDADE. PRESENÇA DE DISPARIDADES RELEVANTES. ILEGALIDADE DA MEDIDA. RECONHECIMENTO DA NULIDADE DA DECISÃO JUDICIAL E DOS ATOS E PROVAS DEPENDENTES. PRESENÇA DE OUTRAS ILEGALIDADES. LIMITAÇÃO AO DIREITO DE PRIVACIDADE DETERMINADA SEM INDÍCIOS RAZOÁVEIS DE AUTORIA E MATERIALIDADE. DETERMINAÇÃO ANTERIOR DE ARQUIVAMENTO DO INQUÉRITO POLICIAL. FIXAÇÃO DIRETA DE PRAZO DE 60 (SESSENTA) DIAS, COM PRORROGAÇÃO POR IGUAL PERÍODO. CONSTRANGIMENTO ILEGAL EVIDENCIADO. RECURSO PROVIDO.\n1. Hipótese em que, após coleta de dados do aplicativo WhatsApp, realizada pela Autoridade Policial mediante apreensão judicialmente autorizada de celular e subsequente espelhamento das mensagens recebidas e enviadas, os Recorrentes tiveram decretadas contra si prisão preventiva, em razão da suposta prática dos crimes previstos nos arts. 33 e 35 da Lei n.º 11.343/2006.\n2. O espelhamento das mensagens do WhatsApp ocorre em sítio eletrônico disponibilizado pela própria empresa, denominado WhatsApp Web. Na referida plataforma, é gerado um tipo específico de código de barras, conhecido como Código QR (Quick Response), o qual só pode ser lido pelo celular do usuário que pretende usufruir do serviço.\nDaí a necessidade de apreensão, ainda que por breve período de tempo, do aparelho telefônico que se pretende monitorar.\n3. Para além de permitir o acesso ilimitado a todas as conversas passadas, presentes e futuras, a ferramenta WhatsApp Web foi desenvolvida com o objetivo de possibilitar ao usuário a realização de todos os atos de comunicação a que teria acesso no próprio celular. O emparelhamento entre celular e computador autoriza o usuário, se por algum motivo assim desejar, a conversar dentro do aplicativo do celular e, simultaneamente, no navegador da internet, ocasião em que as conversas são automaticamente atualizadas na plataforma que não esteja sendo utilizada. 4. Tanto no aplicativo, quanto no navegador, é possível, com total liberdade, o envio de novas mensagens e a exclusão de mensagens antigas (registradas antes do emparelhamento) ou recentes (registradas após), tenham elas sido enviadas pelo usuário, tenham elas sido recebidas de algum contato.\nEventual exclusão de mensagem enviada (na opção \"Apagar somente para Mim\") ou de mensagem recebida (em qualquer caso) não deixa absolutamente nenhum vestígio, seja no aplicativo, seja no computador emparelhado, e, por conseguinte, não pode jamais ser recuperada para efeitos de prova em processo penal, tendo em vista que a própria empresa disponibilizadora do serviço, em razão da tecnologia de encriptação ponta-a-ponta, não armazena em nenhum servidor o conteúdo das conversas dos usuários.\n5. Cumpre assinalar, portanto, que o caso dos autos difere da situação, com legalidade amplamente reconhecida pelo Superior Tribunal de Justiça, em que, a exemplo de conversas mantidas por e-mail, ocorre autorização judicial para a obtenção, sem espelhamento, de conversas já registradas no aplicativo WhatsApp, com o propósito de periciar seu conteúdo.\n6. É impossível, tal como sugerido no acórdão impugnado, proceder a uma analogia entre o instituto da interceptação telefônica (art.\n1.º, da Lei n.º 9.296/1996) e a medida que foi tomada no presente caso.\n7. Primeiro: ao contrário da interceptação telefônica, no âmbito da qual o investigador de polícia atua como mero observador de conversas empreendidas por terceiros, no espelhamento via WhatsApp Web o investigador de polícia tem a concreta possibilidade de atuar como participante tanto das conversas que vêm a ser realizadas quanto das conversas que já estão registradas no aparelho celular, haja vista ter o poder, conferido pela própria plataforma online, de interagir nos diálogos mediante envio de novas mensagens a qualquer contato presente no celular e exclusão, com total liberdade, e sem deixar vestígios, de qualquer mensagem passada, presente ou, se for o caso, futura.\n8. O fato de eventual exclusão de mensagens enviadas (na modalidade \"Apagar para mim\") ou recebidas (em qualquer caso) não deixar absolutamente nenhum vestígio nem para o usuário nem para o destinatário, e o fato de tais mensagens excluídas, em razão da criptografia end-to-end, não ficarem armazenadas em nenhum servidor, constituem fundamentos suficientes para a conclusão de que a admissão de tal meio de obtenção de prova implicaria indevida presunção absoluta da legitimidade dos atos dos investigadores, dado que exigir contraposição idônea por parte do investigado seria equivalente a demandar-lhe produção de prova diabólica.\n9. Segundo: ao contrário da interceptação telefônica, que tem como objeto a escuta de conversas realizadas apenas depois da autorização judicial (ex nunc), o espelhamento via Código QR viabiliza ao investigador de polícia acesso amplo e irrestrito a toda e qualquer comunicação realizada antes da mencionada autorização, operando efeitos retroativos (ex tunc).\n10. Terceiro: ao contrário da interceptação telefônica, que é operacionalizada sem a necessidade simultânea de busca pessoal ou domiciliar para apreensão de aparelho telefônico, o espelhamento via Código QR depende da abordagem do indíviduo ou do vasculhamento de sua residência, com apreensão de seu aparelho telefônico por breve período de tempo e posterior devolução desacompanhada de qualquer menção, por parte da Autoridade Policial, à realização da medida constritiva, ou mesmo, porventura - embora não haja nos autos notícia de que isso tenha ocorrido no caso concreto -, acompanhada de afirmação falsa de que nada foi feito.\n11. Hipótese concreta dos autos que revela, ainda, outras três ilegalidades: (a) sem que se apontasse nenhum fato novo na decisão, a medida foi autorizada quatro meses após ter sido determinado o arquivamento dos autos; (b) ausência de indícios razoáveis da autoria ou participação em infração penal a respaldar a limitação do direito de privacidade; e (c) ilegalidade na fixação direta do prazo de 60 (sessenta) dias, com prorrogação por igual período.\n12. Recurso provido, a fim de declarar a nulidade da decisão judicial que autorizou o espelhamento do WhatsApp via Código QR, bem como das provas e dos atos que dela diretamente dependam ou sejam consequência, ressalvadas eventuais fontes independentes, revogando, por conseguinte, a prisão preventiva dos Recorrentes, se por outro motivo não estiverem presos.","cit":"(RHC n. 99.735/SC, relatora Ministra Laurita Vaz, Sexta Turma, julgado em 27/11/2018, DJe de 12/12/2018.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=201801533498&dt_publicacao=12/12/2018","origem":"Linha do tempo do STJ sobre print e captura de tela","grupo":""},{"id":"j602624459","eixo":"e11","trib":"STJ","classe":"AgRg no AREsp 3.307.719/GO","registro":"2026/0262445-9","rel":"Maria Marluce Caldas","conv":"","relac":"","orgao":"5ª T.","data":"20/10/2026","dje":"27/10/2026","ementa":"AGRAVO REGIMENTAL NO AGRAVO EM RECURSO ESPECIAL. PROVA DIGITAL. CADEIA DE CUSTÓDIA. EMBARGOS DE DECLARAÇÃO. SÚMULA 7/STJ. ABSOLVIÇÃO POR INSUFICIÊNCIA DE PROVAS. AGRAVO REGIMENTAL NÃO PROVIDO.\nI. CASO EM EXAME\n1. Agravo regimental interposto pelo Ministério Público estadual contra decisão monocrática que conheceu do agravo para não conhecer do recurso especial.\nII. QUESTÃO EM DISCUSSÃO\n2. Há três questões em discussão: (i) saber se houve negativa de prestação jurisdicional, à luz do art. 619 do CPP, ante alegado não enfrentamento, nos embargos de declaração, das teses e dispositivos federais articulados; (ii) saber se a inobservância de etapas formais da cadeia de custódia da prova digital conduz à inadmissibilidade automática (CPP, art. 157) ou se deve ser apreciada na valoração probatória, com exigência de demonstração de prejuízo concreto (CPP, art. 563); e (iii) saber se a revisão, em recurso especial, das conclusões da instância ordinária sobre integridade/confiabilidade da prova digital e sobre a absolvição por insuficiência de provas esbarra no óbice da Súmula 7/STJ.\nIII. RAZÕES DE DECIDIR\n3. A instância ordinária enfrentou de modo suficiente e exauriente as questões suscitadas, reconhecendo que os embargos de declaração foram manejados para rediscutir o mérito, hipótese vedada pelo art. 619 do CPP. Inexistência de omissão, contradição, obscuridade ou ambiguidade.\n4. O Tribunal de origem concluiu, a partir do exame do acervo probatório, pela imprestabilidade dos áudios extraídos de WhatsApp por quebra da cadeia de custódia (CPP, arts. 158-A a 158-F e diretrizes técnicas correlatas), ante a ausência de registros das etapas, datas, horas e conexões entre diálogos, comprometendo integridade e autenticidade da prova digital.\n5. Não há violação aos arts. 157, 158-A e 563 do CPP, pois a inadmissibilidade da prova digital decorreu de exame técnico-probatório realizado pela instância ordinária; a tese de mero vício formal sem prejuízo não se sustenta sem revolvimento da prova coligida.\n6. A absolvição foi mantida em razão de dúvida razoável acerca do direcionamento das ofensas e da materialidade/autoria, impondo a aplicação do princípio do in dubio pro reo, com fundamento no art. 386, VII, do CPP; a revisão dessa conclusão também demanda reexame probatório, inviável no especial.\nIV. DISPOSITIVO\n7. Agravo regimental desprovido.","cit":"(AgRg no AREsp n. 3.307.719/GO, relatora Ministra Maria Marluce Caldas, Quinta Turma, julgado em 20/10/2026, DJEN de 27/10/2026.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202602624459&dt_publicacao=27/10/2026","origem":"Pesquisa \"prova digital\" [posição 39]","grupo":"Quebra Reconhecida e Prova Inadmissível"},{"id":"j401885688","eixo":"e11","trib":"STJ","classe":"AgRg no RHC 198.632/SC","registro":"2024/0188568-8","rel":"Joel Ilan Paciornik","conv":"","relac":"","orgao":"5ª T.","data":"04/03/2026","dje":"09/03/2026","ementa":"AGRAVO REGIMENTAL NO RECURSO EM HABEAS CORPUS. CADEIA DE CUSTÓDIA. VÍDEO DESACOMPANHADO DOS METADADOS. IMPOSSIBILIDADE DE USO COMO PROVA EM AÇÃO PENAL. AGRAVO REGIMENTAL DESPROVIDO.\nI. CASO EM EXAME\n1. Agravo regimental interposto contra decisão que deu provimento ao recurso em habeas corpus, para determinar a retirada dos autos da ação penal de vídeo supostamente incriminador do ora agravado, em virtude da impossibilidade de verificar a sua autenticidade.\nII. QUESTÃO EM DISCUSSÃO\n2. A questão em discussão consiste em saber se é possível validar um vídeo sem a existência dos metadados para conferir a sua veracidade.\nIII. RAZÕES DE DECIDIR\n3. A cadeia de custódia não constitui mero conjunto de procedimentos estatais posteriores à apreensão da prova, quando na verdade o instituto possui dimensão epistêmica mais profunda e abrangente.\n4. A prova com cadeia de custódia violada é prova inadmissível, que não pode ser introduzida no processo nem valorada pelo julgador, independentemente de sua eventual correspondência com a realidade fática, pois a sua violação não gera mera irregularidade sanável ou questão afeta à valoração probatória, porquanto constitui óbice à própria admissibilidade do elemento no processo.\n5. A prova digital, por suas particularidades, exige cuidados específicos na preservação de sua cadeia de custódia. Diferentemente de vestígios físicos tradicionais, elementos digitais não possuem existência material palpável, podem ser perfeitamente duplicados sem deixar rastros, são facilmente alteráveis sem sinais visíveis de manipulação, dependem essencialmente de metadados para verificação de autenticidade e exigem técnicas específicas de preservação de integridade (hash, cópia forense bit-a-bit, etc.).\n6. No caso dos autos, a cadeia de custódia foi irreversivelmente rompida, configurando hipótese de inadmissibilidade da prova. Os vídeos que fundamentam a denúncia apresentam ausência absoluta de metadados. Não há qualquer informação sobre data e hora de criação do arquivo, dispositivo de origem, localização geográfica (geotag), histórico de modificações, software utilizado ou assinatura digital.\n7. Essa ausência não é natural. Arquivos de vídeo gerados por dispositivos modernos (smartphones, câmeras) automaticamente incorporam metadados. A supressão total dessas informações indica remoção intencional. Mais grave: o próprio conteúdo do vídeo revela manipulação adicional, pois trata-se de filmagem de outro dispositivo (com tela quebrada), e não de arquivo digital nativo. Essa característica impossibilita identificação do dispositivo de origem primário, cria camada adicional de distanciamento da fonte original, evidencia intenção de ocultar rastros de autoria e impede verificação de autenticidade do conteúdo exibido na tela filmada.\n8. O contexto fático é ainda mais revelador. Os elementos dos autos demonstram que os vídeos surgiram em investigação de crime de extorsão (IP n. 92.21.00007) em que o paciente V figurava como vítima. Conforme informação oficial da polícia científica (Evento 147, INF1, p. 14-15), os arquivos foram enviados ao paciente por criminosos que invadiram seu dispositivo eletrônico e exigiram dinheiro sob ameaça.\n9. Esse contexto é relevante não para caracterizar \"ilicitude por origem criminosa\", mas para evidenciar que os arquivos já estavam manipulados antes de qualquer contato com as autoridades. A remoção de metadados foi intencional, perpetrada por terceiros com objetivo específico. A impossibilidade de verificação de autenticidade não decorre de falha do Estado, mas de manipulação prévia que contaminou irreversivelmente o elemento. Não existe \"arquivo original\" a ser periciado - o único arquivo existente já é resultado de manipulação.\nIV. DISPOSITIVO E TESE\n10. Resultado do Julgamento: Agravo regimental desprovido.\nTese de julgamento:\nVídeo destituído de metadados que impossibilitam a verificação de sua autenticidade não pode ser usado como prova em ação penal.\nDispositivos relevantes citados: CF, art. 5º, LVII e LXVIII; CPP, arts. 156, 157 e 158 a 158-F.\nJurisprudência relevante citada: STJ, AgRg no RHC n. 143.169/RJ, relator Min. Ribeiro Dantas, Quinta Turma, j. 07/02/2023, DJe 02/03/2023.","cit":"(AgRg no RHC n. 198.632/SC, relator Ministro Joel Ilan Paciornik, Quinta Turma, julgado em 4/3/2026, DJEN de 9/3/2026.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202401885688&dt_publicacao=09/03/2026","origem":"Pesquisa \"prova digital\" [posição 46]","grupo":"Quebra Reconhecida e Prova Inadmissível"},{"id":"j501876811","eixo":"e11","trib":"STJ","classe":"AgRg no AREsp 2.944.868/GO","registro":"2025/0187681-1","rel":"Antonio Saldanha Palheiro","conv":"","relac":"","orgao":"6ª T.","data":"05/08/2025","dje":"20/08/2025","ementa":"PROCESSUAL PENAL. AGRAVO REGIMENTAL NO AGRAVO EM RECURSO ESPECIAL. CRIMES CONTRA A HONRA. PROVAS DIGITAIS. QUEBRA DA CADEIA DE CUSTÓDIA. INADMISSIBILIDADE DA PROVA. ART. 619 DO CPP. SÚMULA N. 7/STJ. AGRAVO REGIMENTAL DESPROVIDO.\n1. A cadeia de custódia é essencial para garantir a integridade e autenticidade das provas digitais, desde sua coleta até a análise judicial, evitando interferências que possam comprometer sua confiabilidade.\n2. No caso concreto, a ausência de documentação adequada sobre a origem, forma de acesso e tratamento das evidências digitais comprometeu a validade probatória, conforme destacado pelo Tribunal de origem.\n3. De acordo com a jurisprudência do Superior Tribunal de Justiça, a quebra da cadeia de custódia pode levar à inadmissibilidade das provas digitais, sendo ônus do Estado comprovar a integridade e confiabilidade das fontes de prova apresentadas.\n4. A matéria referente à suficiência ou insuficiência do acervo probatório foi devidamente analisada pela Corte local, com base nas peculiaridades do caso concreto, não sendo possível o reexame de provas nesta instância, conforme a Súmula n. 7/STJ.\n5. Quanto à alegação de violação ao art. 619 do Código de Processo Penal, o Tribunal de origem manifestou-se claramente sobre os aspectos fáticos e jurídicos relevantes, ao destacar que os recorridos foram ouvidos na condição de declarantes e não investigados, e que não há registros sobre a origem, forma de acesso e tratamento das evidências digitais. A decisão foi baseada na falta de elementos que pudessem conferir subsistência à persecução criminal, como a ausência de informações sobre a origem do vídeo e a maneira pela qual os \"prints\" do grupo de WhatsApp foram obtidos.\n6. Agravo regimental desprovido.","cit":"(AgRg no AREsp n. 2.944.868/GO, relator Ministro Antonio Saldanha Palheiro, Sexta Turma, julgado em 5/8/2025, DJEN de 20/8/2025.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202501876811&dt_publicacao=20/08/2025","origem":"Pesquisa \"prova digital\" e \"quebra da cadeia de custódia\" [posição 3]","grupo":"Quebra Reconhecida e Prova Inadmissível"},{"id":"j203889368","eixo":"e11","trib":"STJ","classe":"RHC 174.325/PR","registro":"2022/0388936-8","rel":"Rogerio Schietti Cruz","conv":"","relac":"","orgao":"6ª T.","data":"05/11/2024","dje":"07/11/2024","ementa":"RECURSO EM HABEAS CORPUS. OPERAÇÃO PUBLICANO IV. QUEBRA DA CADEIA DE CUSTÓDIA DA PROVA. ILICITUDE DAS PROVAS. CONFIGURAÇÃO. RECURSO PROVIDO.\n1. Segundo o disposto no art. 158-A do CPP, \"Considera-se cadeia de custódia o conjunto de todos os procedimentos utilizados para manter e documentar a história cronológica do vestígio coletado em locais ou em vítimas de crimes, para rastrear sua posse e manuseio a partir de seu reconhecimento até o descarte\".\n2. A jurisprudência desta Corte Superior assevera que \"a ideia de cadeia de custódia é logicamente indissociável do próprio conceito de corpo de delito, constante no CPP desde a redação original de seu art. 158. Por isso, mesmo para fatos anteriores a 2019, é necessário avaliar a preservação da cadeia de custódia\" (AgRg no RHC n. 143.169/RJ, relator Ministro Messod Azulay Neto, relator para acórdão Ministro Ribeiro Dantas, Quinta Turma, julgado em 7/2/2023, DJe de 2/3/2023).\n3. Com vistas a salvaguardar o potencial epistêmico do processo penal, a Lei n. 13.964/2019 (Pacote Anticrime) disciplinou - de maneira, aliás, extremamente minuciosa - uma série de providências que concretizam o desenvolvimento técnico-jurídico da cadeia de custódia.\n4. De forma bastante simples, pode-se dizer que o art. 158-B do CPP detalha as diversas etapas de rastreamento do vestígio: reconhecimento, isolamento, fixação, coleta, acondicionamento, transporte, recebimento, processamento, armazenamento e descarte. O art. 158-C, por sua vez, estabelece o perito oficial como quem, de preferência, deverá realizar a coleta dos vestígios, os quais devem ser encaminhados para a central de custódia. Já o art. 158-D disciplina como os vestígios devem ser acondicionados, com a previsão de que todos os recipientes devem ser selados com lacres, com numeração individualizada, \"de forma a garantir a inviolabilidade e a idoneidade do vestígio\".\n5. Se é certo que, por um lado, o legislador trouxe, nos arts. 158-A a 158-F do CPP, determinações extremamente detalhadas de como se deve preservar a cadeia de custódia da prova, também é certo que, por outro, ficou silente em relação aos critérios objetivos para definir quando ocorre a quebra da cadeia de custódia e quais as consequências jurídicas, para o processo penal, dessa quebra ou do descumprimento de um desses dispositivos legais.\n6. A vigilância sobre a prova digital traz peculiaridades não previstas na ultrapassada legislação de regência, o que exige o cuidado do Judiciário na análise do caso concreto.\n7. A leitura do acórdão recorrido deixa claro que: a) inexiste qualquer referência, na documentação do cumprimento do mandado de busca e apreensão direcionado à sala do corréu colaborador na sede da Receita estadual, a eventual lacre dos materiais ali apreendidos; b) quanto aos bens encontrados no cumprimento da ordem de busca e apreensão no domicílio do colaborador, há duas discrepâncias principais e que são relevantes para o exame da ilegalidade suscitada neste feito, que dizem respeito à capacidade de armazenamento do pen drive apreendido (na certidão de cumprimento, 8 GB, e no auto de apreensão, 16 GB) e ao número do lacre sob o qual foi acautelado o material (na certidão de cumprimento, 0223597, e no depósito perante a Caixa Econômica Federal, 2424802).\n8. Assim, fica claro que não foram respeitadas as diretrizes relacionadas ao devido acondicionamento e identificação dos materiais apreendidos, notadamente as mídias digitais posteriormente submetidas a perícia.\n9. As afirmações constantes do acórdão recorrido - quanto à possibilidade de simples equívoco na descrição dos objetos encontrados na residência do colaborador, bem como quanto à eventual abertura do volume em que estava o pen drive apreendido na residência do réu, na Caixa Econômica Federal, para conferência do conteúdo e posterior substituição do lacre rompido - não passam de presunções e, por isso mesmo, não podem ser usadas para justificar a manutenção das provas ora analisadas.\n10. Recurso provido para reconhecer a ilegalidade da prova produzida pelo acesso aos pen drives Kingston 4GB e ScanDisk 8GB, objeto do Laudo Pericial 2.920/2015, diante da quebra da cadeia de custódia, e determinar ao Juízo de primeiro grau que avalie quais evidências devem ser eliminadas dos autos por derivação, bem como as que devem remanescer em função de fonte independente ou de descoberta inevitável.","cit":"(RHC n. 174.325/PR, relator Ministro Rogerio Schietti Cruz, Sexta Turma, julgado em 5/11/2024, DJe de 7/11/2024.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202203889368&dt_publicacao=07/11/2024","origem":"Pesquisa \"prova digital\" e \"quebra da cadeia de custódia\" [posição 5]","grupo":"Quebra Reconhecida e Prova Inadmissível"},{"id":"j601525924","eixo":"e11","trib":"STJ","classe":"AgRg no HC 1.090.424/SP","registro":"2026/0152592-4","rel":"Ribeiro Dantas","conv":"","relac":"","orgao":"5ª T.","data":"15/06/2026","dje":"19/06/2026","ementa":"PROCESSUAL PENAL. AGRAVO REGIMENTAL EM HABEAS CORPUS. CADEIA DE CUSTÓDIA DE PROVA DIGITAL. REGISTROS EXTRAÍDOS DO SISTEMA SIAFEN. CONTROVÉRSIA QUE DIZ RESPEITO À CONFIABILIDADE DO ELEMENTO PROBATÓRIO. INADMISSIBILIDADE DE PRESUNÇÃO DE CONFIABILIDADE. INEXISTÊNCIA DE NULIDADE AUTOMÁTICA. AUSÊNCIA DE INDICAÇÃO CONCRETA DE VÍCIO. INDEFERIMENTO FUNDAMENTADO DE DILIGÊNCIA. CERCEAMENTO DE DEFESA NÃO CONFIGURADO. RECURSO IMPROVIDO.\nI. CASO EM EXAME\n1. Agravo regimental interposto contra decisão monocrática que não conheceu do habeas corpus.\n2. Insurgência fundada em alegada violação à cadeia de custódia de documentos extraídos do sistema SIAFEN, com pedido de obtenção direta dos dados junto à Secretaria da Fazenda, e invocação de cerceamento de defesa e nulidade por ausência de fundamentação quanto ao indeferimento da diligência.\nII. QUESTÃO EM DISCUSSÃO\n3. Há três questões em discussão: (i) saber se a alegada quebra da cadeia de custódia, desacompanhada de indicação concreta de vício nos procedimentos de obtenção, extração, preservação ou apresentação do material, compromete a confiabilidade da prova e autoriza atuação pela via do habeas corpus; (ii) saber se o indeferimento fundamentado de diligência para obtenção direta de documentos é apto a caracterizar cerceamento de defesa; (iii) saber se houve ausência de fundamentação no acórdão de origem quanto à rejeição da diligência postulada.\nIII. RAZÕES DE DECIDIR\n4. A controvérsia relativa à cadeia de custódia não se insere, propriamente, no campo das nulidades processuais, mas diz respeito à confiabilidade do elemento probatório, não se submetendo automaticamente à exigência de demonstração de prejuízo (art. 563 do Código de Processo Penal).\n5. Não se presume a confiabilidade da prova pela simples ausência de demonstração de fraude, tampouco se exige da defesa a comprovação de adulteração efetiva, incumbindo ao Estado demonstrar a correspondência entre os dados utilizados na persecução penal e aqueles oriundos da fonte de obtenção, ao passo que à defesa cabe a indicação de falhas concretas aptas a suscitar dúvida razoável quanto à auditabilidade do material.\n6. No caso, a insurgência defensiva limita-se a alegações genéricas acerca da possibilidade de comprometimento da cadeia de custódia, sem individualizar inconsistências, lacunas ou divergências objetivas no material constante dos autos, o que impede o reconhecimento de ilegalidade manifesta na via estreita do habeas corpus.\n7. O indeferimento de diligências probatórias não configura cerceamento de defesa quando devidamente motivado e quando a medida se revela impertinente, irrelevante ou desnecessária, cabendo ao magistrado, destinatário da prova, aferir sua utilidade (CPP, art. 400, § 1º). O Agravante não demonstrou a imprescindibilidade da providência requerida nem sua aptidão para alterar o panorama probatório.\n8. Inexistiu ausência de fundamentação, pois o acórdão enfrentou de maneira suficiente a controvérsia, explicitando as razões para reputar desnecessária a diligência pretendida; decisão contrária ao interesse da parte não se confunde com falta de motivação.\nIV. DISPOSITIVO E TESE\n9. Resultado do Julgamento: Agravo regimental improvido.\nTese de julgamento:\n1. A alegação de quebra da cadeia de custódia de prova digital exige a indicação de elementos concretos aptos a suscitar dúvida quanto à confiabilidade do material probatório, não sendo suficiente a formulação de alegações genéricas, nem se exigindo da defesa a demonstração de adulteração efetiva, tratando-se de matéria atinente à admissibilidade e à confiabilidade da prova, e não de nulidade processual automática. 2. O indeferimento fundamentado de diligência considerada impertinente, irrelevante ou desnecessária não caracteriza cerceamento de defesa, incumbindo ao magistrado aferir a utilidade da prova. 3. Não há nulidade por ausência de fundamentação quando a decisão enfrenta de forma suficiente a controvérsia e explicita as razões do indeferimento.\nDispositivos relevantes citados: CPP, arts. 158-A a 158-F; CPP, art. 400, § 1º; CPP, art. 563\nJurisprudência relevante citada: STJ, EDcl no AgRg no AREsp n. 2.918.696/SC, Rel. Min. Reynaldo Soares da Fonseca, Quinta Turma, DJEN de 17/12/2025; STJ, AgRg nos EDcl no HC n. 913.207/SP, Rel. Min. Reynaldo Soares da Fonseca, Quinta Turma, DJe de 12/9/2024; STJ, AgRg no HC n. 909.238/PR, Rel. Min. Antonio Saldanha Palheiro, Sexta Turma, DJe de 20/6/2024.","cit":"(AgRg no HC n. 1.090.424/SP, relator Ministro Ribeiro Dantas, Quinta Turma, julgado em 15/6/2026, DJEN de 19/6/2026.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202601525924&dt_publicacao=19/06/2026","origem":"Pesquisa \"prova digital\" [posição 49]","grupo":"Ônus do Estado e Confiabilidade da Prova"},{"id":"j504398082","eixo":"e11","trib":"STJ","classe":"AgRg no HC 1.050.889/SP","registro":"2025/0439808-2","rel":"Ribeiro Dantas","conv":"","relac":"","orgao":"5ª T.","data":"29/04/2026","dje":"07/05/2026","ementa":"DIREITO PROCESSUAL PENAL. AGRAVO REGIMENTAL EM HABEAS CORPUS. PROVA DIGITAL. CADEIA DE CUSTÓDIA. ADMISSIBILIDADE E CONFIABILIDADE DA PROVA EM SEDE DE HABEAS CORPUS. VIA ELEITA INADEQUADA. AGRAVO REGIMENTAL IMPROVIDO.\n\nI. CASO EM EXAME\n1. Agravo regimental interposto pela defesa contra decisão monocrática que não conheceu de habeas corpus, no qual se alegou inadmissibilidade das provas digitais utilizadas para fundamentar condenação criminal, ao argumento de quebra da cadeia de custódia, em violação aos arts. 158-A a 158-F e 159 do Código de Processo Penal, por ausência de registros idôneos sobre coleta, preservação e manuseio dos vestígios e por ter sido a extração de dados realizada por agente sem qualificação pericial.\n2. A decisão agravada deixou de conhecer do writ por reputar ausente flagrante ilegalidade, considerar inadequada a via eleita e reconhecer a necessidade de revolvimento fático-probatório. No agravo regimental, a defesa insiste na existência de ilegalidade manifesta, afirma ser desnecessário aprofundamento probatório e sustenta que não se pode exigir prova de adulteração para o reconhecimento da quebra da cadeia de custódia, requerendo reconsideração monocrática ou deliberação colegiada.\n\nII. QUESTÃO EM DISCUSSÃO\n3. A questão em discussão consiste em saber se, à luz das regras da cadeia de custódia da prova digital, há ilegalidade manifesta na utilização de vestígios digitais para fundamentar a condenação, em razão de alegada quebra da cadeia de custódia (coleta, extração, preservação e apresentação do material, bem como qualificação do agente que procedeu à extração), a justificar o conhecimento e a concessão do habeas corpus.\n4. Outra questão em discussão consiste em saber se a verificação de eventual quebra da cadeia de custódia da prova digital, nas circunstâncias expostas, demanda revolvimento do conjunto fático-probatório incompatível com a via estreita do habeas corpus e se é adequada a utilização do writ como via paralela ao recurso especial, diante do princípio da unirrecorribilidade.\n\nIII. RAZÕES DE DECIDIR\n5. O exame do caso não envolve nulidade processual em sentido estrito, mas a admissibilidade da prova digital sob o prisma de sua confiabilidade, devendo o Estado demonstrar a mesmidade entre o dado apresentado em juízo e o corpo de delito obtido na investigação, não sendo lícito presumir essa correspondência nem exigir da defesa prova de adulteração.\n6. À defesa basta a indicação concreta de vícios no procedimento de coleta, extração, preservação ou apresentação da prova digital, aptos a comprometer sua auditabilidade, não sendo suficiente alegação genérica de irregularidade nem se exigindo prova de adulteração, o que seria incompatível com a natureza da cadeia de custódia e com o ônus estatal de demonstrar a mesmidade da prova.\n7. As instâncias ordinárias consignaram que os dispositivos foram apreendidos mediante autorização judicial, lacrados, submetidos à análise técnica e que o conteúdo extraído foi integralmente disponibilizado às defesas, sem impugnação específica quanto à autenticidade do material na fase oportuna, de modo que não se verifica, de plano, ilegalidade manifesta apta a justificar o conhecimento do habeas corpus.\n8. A alegação de quebra da cadeia de custódia, especialmente quanto à qualificação do agente que realizou a extração, à regularidade dos lacres e à integridade do material, depende de exame mais aprofundado das circunstâncias concretas do procedimento, o que demanda incursão no conjunto fático-probatório, providência incompatível com a via estreita do habeas corpus.\n9. O Tribunal de origem afastou a tese defensiva com base em elementos concretos da apreensão e análise dos dispositivos, de forma que a revisão desse entendimento pelo habeas corpus importaria reexame de prova, hipótese vedada na espécie.\n10. Ainda que não haja vedação absoluta ao manejo concomitante de habeas corpus e recurso especial, a utilização do writ como via paralela de rediscussão da matéria, sem demonstração de flagrante ilegalidade, mostra-se inadequada em atenção ao princípio da unirrecorribilidade, o que reforça a manutenção da decisão que não conheceu da impetração.\n\nIV. DISPOSITIVO E TESE\n6. Resultado do Julgamento: Agravo regimental desprovido, mantida a decisão que não conheceu do habeas corpus.\n\nTese de julgamento: 1. Incumbe ao Estado demonstrar a mesmidade e a confiabilidade da prova digital, cabendo à defesa apenas a indicação concreta de vícios na coleta, extração, preservação ou apresentação do material, aptos a comprometer sua auditabilidade, não se exigindo prova de adulteração. 2. A aferição de eventual quebra da cadeia de custódia da prova digital que dependa de exame aprofundado de circunstâncias fáticas e do conjunto probatório é incompatível com a via estreita do habeas corpus. 3. É inadequado o uso do habeas corpus como via paralela ao recurso especial para rediscutir matéria probatória, sem demonstração de flagrante ilegalidade, em respeito ao princípio da unirrecorribilidade.\n\nDispositivos relevantes citados: CPP, arts. 158-A a 158-F; CPP, art. 159.\n\nJurisprudência relevante citada: Precedentes não indicados no voto.","cit":"(AgRg no HC n. 1.050.889/SP, relator Ministro Ribeiro Dantas, Quinta Turma, julgado em 29/4/2026, DJEN de 7/5/2026.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202504398082&dt_publicacao=07/05/2026","origem":"Pesquisa \"prova digital\" e \"quebra da cadeia de custódia\" [posição 19]","grupo":"Ônus do Estado e Confiabilidade da Prova"},{"id":"j503892446","eixo":"e11","trib":"STJ","classe":"AgRg no AREsp 3.089.574/DF","registro":"2025/0389244-6","rel":"Maria Marluce Caldas","conv":"","relac":"","orgao":"5ª T.","data":"06/10/2026","dje":"14/10/2026","ementa":"AGRAVO REGIMENTAL NO AGRAVO EM RECURSO ESPECIAL. ARTIGOS 241-B E 241-C DO ECA. CADEIA DE CUSTÓDIA. PROVA DIGITAL OBTIDA EM CUMPRIMENTO DE MANDADO DE BUSCA E APREENSÃO. MANUSEIO DE DISPOSITIVOS ELETRÔNICOS PARA VERIFICAR MATERIALIDADE. AUSÊNCIA DE PREJUÍZO. SÚMULA 7/STJ. AGRAVO REGIMENTAL DESPROVIDO.\nI. CASO EM EXAME\n1. Agravo regimental interposto contra decisão que conheceu do agravo para não conhecer de recurso especial, em ação penal na qual o Recorrente foi condenado pelos arts. 241-B e 241-C, na forma do art. 69, do Código Penal, com alegação de nulidade das provas digitais por suposta quebra da cadeia de custódia.\nII. QUESTÃO EM DISCUSSÃO\n2. A questão em discussão consiste em saber se: (i) o manuseio de equipamentos eletrônicos, no cumprimento de mandado de busca e apreensão, para identificar a relação do dispositivo com o objeto da investigação, configura violação aos arts. 157, 158-A e 158-B, I e IV, do Código de Processo Penal e quebra da cadeia de custódia apta a gerar nulidade sem demonstração de prejuízo; e (ii) a revisão da conclusão das instâncias ordinárias sobre a inexistência de quebra da cadeia de custódia demanda reexame do conjunto fático-probatório, o que é vedado pela Súmula 7/STJ.\nIII. RAZÕES DE DECIDIR\n3. O Tribunal de origem concluiu, com base no contexto fático-probatório, pela inexistência de quebra da cadeia de custódia, assentando que o manuseio dos dispositivos eletrônicos, no momento da apreensão, visou apenas identificar se guardavam relação com o objeto da investigação, em consonância com o art. 158-B, I, do CPP.\n4. A Defesa não demonstrou adulteração da prova, interferência indevida ou alteração da ordem cronológica dos fatos, nem indicou etapa violada da cadeia de custódia, sendo indispensável a comprovação de efetivo prejuízo para a decretação de nulidade (art. 563 do CPP).\n5. Inexiste violação aos arts. 157, 158-A e 158-B, I e IV, do CPP, ante a fundamentação adequada que afastou a quebra da cadeia de custódia e preservou a confiabilidade das provas produzidas por agentes públicos sob mandado judicial.\n6. A alteração das conclusões do acórdão recorrido quanto à integridade da prova demandaria reexame de fatos e provas, providência incompatível com o recurso especial, nos termos da Súmula 7/STJ.\nIV. DISPOSITIVO\n7. Agravo regimental desprovido.","cit":"(AgRg no AREsp n. 3.089.574/DF, relatora Ministra Maria Marluce Caldas, Quinta Turma, julgado em 6/10/2026, DJEN de 14/10/2026.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202503892446&dt_publicacao=14/10/2026","origem":"Pesquisa \"prova digital\" [posição 32]","grupo":"Exigência de Demonstração de Adulteração ou de Prejuízo"},{"id":"j503690210","eixo":"e11","trib":"STJ","classe":"HC 1.038.047/SP","registro":"2025/0369021-0","rel":"Sebastião Reis Júnior","conv":"","relac":"","orgao":"6ª T.","data":"01/10/2026","dje":"06/10/2026","ementa":"PENAL E PROCESSUAL PENAL. HABEAS CORPUS. EXPLORAÇÃO DE PRESTÍGIO. PROVA DIGITAL. MENSAGENS DE WHATSAPP. ALEGAÇÃO DE QUEBRA DE CADEIA DE CUSTÓDIA. AUSÊNCIA DE DEMONSTRAÇÃO CONCRETA DE ADULTERAÇÃO OU COMPROMETIMENTO DA INTEGRIDADE DA PROVA. CORROBORAÇÃO EM JUÍZO POR TESTEMUNHA PROTEGIDA. INEXISTÊNCIA DE ILEGALIDADE MANIFESTA. IMPOSSIBILIDADE DE REVOLVIMENTO FÁTICO-PROBATÓRIO NA VIA ESTREITA DO WRIT.\n1. A reiteração do writ não impede a apreciação do mérito, pois o HC n. 995.703/SP foi extinto sem exame da controvérsia, ante o reconhecimento da unirrecorribilidade, o que afasta óbice ao conhecimento da matéria nesta impetração.\n2. A alegação de quebra da cadeia de custódia demanda indicação de elementos concretos de adulteração, falsificação ou comprometimento da integridade dos vestígios.\n3. No caso, a defesa não indicou qualquer circunstância específica que sugira adulteração ou falsificação das mensagens, limitando-se a suscitar, de forma genérica, a quebra da cadeia de custódia, sem apontar inconsistências internas, incompatibilidades ou dados objetivos que infirmem a autenticidade do conteúdo.\n4. O ato coator registrou que o paciente, durante as buscas, evadiu-se e destruiu evidências, inclusive apagando aplicativo de mensagens, cujo conteúdo foi parcialmente recuperado por perícia técnica, circunstância que fragiliza a alegação de presunção de manipulação por terceiros e reforça a confiabilidade do acervo probatório.\n5. Na espécie, a condenação não se apoiou exclusivamente nas mensagens, havendo prova judicializada e corroboração pela testemunha protegida, sendo certo que a revisão da suficiência dos elementos demandaria revolvimento fático-probatório, incompatível com a via do writ.\n6. Ordem denegada.","cit":"(HC n. 1.038.047/SP, relator Ministro Sebastião Reis Júnior, Sexta Turma, julgado em 1/10/2026, DJEN de 6/10/2026.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202503690210&dt_publicacao=06/10/2026","origem":"Pesquisa \"prova digital\" [posição 45]","grupo":"Exigência de Demonstração de Adulteração ou de Prejuízo"},{"id":"j601637002","eixo":"e11","trib":"STJ","classe":"RHC 237.288/AM","registro":"2026/0163700-2","rel":"Sebastião Reis Júnior","conv":"","relac":"","orgao":"6ª T.","data":"15/09/2026","dje":"21/09/2026","ementa":"DIREITO PENAL E PROCESSUAL PENAL. RECURSO ORDINÁRIO EM HABEAS CORPUS. HOMICÍDIO QUALIFICADO TENTADO. ORGANIZAÇÃO CRIMINOSA. PROVA DIGITAL DE APARELHO CELULAR. CADEIA DE CUSTÓDIA. NULIDADE CONDICIONADA. NECESSIDADE DE DEMONSTRAÇÃO CONCRETA DE ADULTERAÇÃO. FURTO DE APARELHO SOB CUSTÓDIA ESTATAL. CONTRADITÓRIO ASSEGURADO COM JUNTADA DE ARQUIVOS. PAS DE NULLITÉ SANS GRIEF. TRANCAMENTO DA AÇÃO PENAL. EXCEPCIONALIDADE INDEMONSTRADA.\n1. A alegação de quebra da cadeia de custódia de evidências digitais exige elementos concretos que indiquem adulteração ou comprometimento da confiabilidade do material, não bastando afirmações genéricas.\n2. A inobservância de procedimentos de cadeia de custódia não gera nulidade automática. É indispensável demonstrar prejuízo efetivo e a impossibilidade de estabelecer correspondência segura entre a prova produzida e aquela originalmente obtida.\n3. O princípio do pas de nullité sans grief orienta que nenhum ato seja invalidado sem demonstração de prejuízo concreto para a acusação ou para a defesa.\n4. O trancamento da ação penal, na via do habeas corpus ou do respectivo recurso ordinário, é medida excepcional, cabível apenas quando se verifica, de plano, a inépcia da denúncia, a atipicidade da conduta, causa extintiva de punibilidade ou a ausência de indícios mínimos de materialidade ou de autoria.\n5. O exame aprofundado do valor probatório e da confiabilidade técnica de evidências digitais é reservado ao juízo natural, no curso da instrução, com participação das partes e possibilidade de impugnação técnica.\n6. No caso, a insurgência defensiva sustenta nulidade da prova digital por ausência de metodologia forense e por furto do aparelho de telefone, mas não aponta circunstâncias objetivas de adulteração do conteúdo juntado. O contraditório está preservado pelo acesso aos arquivos e pela possibilidade de impugnação técnica na instrução, não havendo demonstração de prejuízo concreto que imponha nulidade imediata. A orientação aplicada na origem - necessidade de demonstração específica de comprometimento e reserva da valoração ao juízo natural - mostra-se compatível com a via eleita e com a jurisprudência do Superior Tribunal de Justiça.\n7. A pretensão de trancamento não encontra suporte, pois há narrativa acusatória apoiada em múltiplos elementos informativos e indícios mínimos de autoria e materialidade, suficientes para o prosseguimento da ação penal. A discussão sobre suficiência e confiabilidade demanda incursão fático-probatória, incompatível com o estreito âmbito do remédio constitucional.\n8. Recurso improvido.","cit":"(RHC n. 237.288/AM, relator Ministro Sebastião Reis Júnior, Sexta Turma, julgado em 15/9/2026, DJEN de 21/9/2026.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202601637002&dt_publicacao=21/09/2026","origem":"Pesquisa \"prova digital\" [posição 36]","grupo":"Exigência de Demonstração de Adulteração ou de Prejuízo"},{"id":"j601781383","eixo":"e11","trib":"STJ","classe":"AgRg no HC 1.095.441/MS","registro":"2026/0178138-3","rel":"Reynaldo Soares da Fonseca","conv":"","relac":"","orgao":"5ª T.","data":"12/08/2026","dje":"17/08/2026","ementa":"PENAL E PROCESSO PENAL. AGRAVO REGIMENTAL NO HABEAS CORPUS. TRÁFICO DE DROGAS E PECULATO. CADEIA DE CUSTÓDIA DA PROVA DIGITAL. APARELHO CELULAR. ALEGADA MANIPULAÇÃO POSTERIOR À APREENSÃO. AUSÊNCIA DE DEMONSTRAÇÃO CONCRETA DE ADULTERAÇÃO OU CONTAMINAÇÃO DA PROVA. LICITUDE DO ACESSO AOS DADOS. CONSENTIMENTO DO PROPRIETÁRIO. NECESSIDADE DE REVOLVIMENTO FÁTICO-PROBATÓRIO. INVIABILIDADE NA VIA ELEITA. EXISTÊNCIA DE OUTROS ELEMENTOS PROBATÓRIOS AUTÔNOMOS. AUSÊNCIA DE CONSTRANGIMENTO ILEGAL. AGRAVO REGIMENTAL A QUE SE NEGA PROVIMENTO.\n1. A alegação de quebra da cadeia de custódia da prova digital exige demonstração concreta de adulteração, contaminação ou comprometimento da confiabilidade do elemento probatório, não sendo suficiente a mera indicação de irregularidade formal ou de inconsistência na cronologia dos registros.\n2. Hipótese em que as instâncias ordinárias concluíram pela licitude do acesso ao aparelho celular, realizado mediante consentimento do proprietário, e afastaram a ocorrência de manipulação da prova digital ou de prejuízo efetivo à defesa.\n3. A pretensão de reconhecer que registros constantes do aparelho celular evidenciariam intervenção estatal indevida após a apreensão demanda reexame aprofundado do conjunto fático-probatório, providência incompatível com a estreita via do habeas corpus.\n4. A condenação não se apoiou exclusivamente nas informações extraídas do aparelho celular, havendo outros elementos probatórios aptos a amparar o édito condenatório.\n5. Agravo regimental a que se nega provimento.","cit":"(AgRg no HC n. 1.095.441/MS, relator Ministro Reynaldo Soares da Fonseca, Quinta Turma, julgado em 12/8/2026, DJEN de 17/8/2026.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202601781383&dt_publicacao=17/08/2026","origem":"Pesquisa \"prova digital\" [posição 44]","grupo":"Exigência de Demonstração de Adulteração ou de Prejuízo"},{"id":"j16AgRSP","eixo":"e11","trib":"STF","classe":"RHC 270016 AgR/SP","registro":"","rel":"Gilmar Mendes","conv":"","relac":"","orgao":"2ª T.","data":"25/05/2026","dje":"28/05/2026","ementa":"Processual Penal e Constitucional. Agravo regimental no recurso ordinário em habeas corpus. Organização criminosa, receptação de animal e falsidade ideológica. Alegada quebra da cadeia de custódia de prova digital. Inexistência de flagrante ilegalidade ou teratologia. Precedentes. Ausência de demonstração de prejuízo. Agravo regimental não provido.\n\nI. Caso em exame\n\n1. Agravo regimental interposto contra decisão monocrática que negou provimento a recurso ordinário em habeas corpus, mantendo acórdão do Superior Tribunal de Justiça que afastara a alegação de nulidade de prova digital por suposta quebra da cadeia de custódia.\n\n2. Pretensão do agravante de anular as provas digitais extraídas de aparelho celular pertencente a corréu, ao argumento de que o dispositivo foi manuseado por investigador de polícia antes de ser submetido à perícia oficial.\n\nII. Questão em discussão\n\n3. Definir se a alegada irregularidade formal no manuseio de prova digital, por si só, configura quebra da cadeia de custódia apta a gerar a nulidade da prova, especialmente quando as instâncias ordinárias concluíram pela ausência de demonstração de adulteração ou prejuízo concreto à defesa.\n\nIII. Razão de decidir\n\n4. A tese de quebra da cadeia de custódia foi devidamente rechaçada pelas instâncias antecedentes, que, de forma fundamentada, concluíram pela regularidade da prova, destacando a ausência de qualquer elemento concreto que indique manipulação, adulteração ou prejuízo à defesa.\n\n5. Os argumentos veiculados no agravo revelam mero inconformismo com as decisões desfavoráveis e não infirmam os fundamentos da decisão agravada, que se mantém por sua consistência.\n\nIV. Dispositivo\n\n6. Agravo regimental não provido.","cit":"(RHC 270016 AgR/SP, Relator(a): Gilmar Mendes, Segunda Turma, julgado em 25/05/2026, publicado em 28/05/2026.)","link":"https://portal.stf.jus.br/jurisprudencia/obterInteiroTeor.asp?idDocumento=797949515","origem":"Pesquisa \"prova digital\" [posição 24]","grupo":"Exigência de Demonstração de Adulteração ou de Prejuízo"},{"id":"j504370498","eixo":"e11","trib":"STJ","classe":"AgRg no AREsp 3.109.361/PR","registro":"2025/0437049-8","rel":"Antonio Saldanha Palheiro","conv":"","relac":"","orgao":"6ª T.","data":"07/04/2026","dje":"14/04/2026","ementa":"DIREITO PROCESSUAL PENAL. AGRAVO REGIMENTAL NO AGRAVO EM RECURSO ESPECIAL. HOMICÍDIO QUALIFICADO. PRONÚNCIA. PROVA DIGITAL. CADEIA DE CUSTÓDIA. ALEGADA INOBSERVÂNCIA DOS ARTS. 158-A A 158-F DO CPP. AUSÊNCIA DE CÓDIGO HASH E LACRE. IRREGULARIDADES QUE NÃO GERAM NULIDADE AUTOMÁTICA. NECESSIDADE DE DEMONSTRAÇÃO DE PREJUÍZO. INTEGRIDADE ASSEGURADA POR OUTROS MEIOS TÉCNICOS. DECISÃO MANTIDA. AGRAVO REGIMENTAL NÃO PROVIDO.\nI. CASO EM EXAME\n1. Agravo regimental interposto por José Henrique Tonatto contra decisão monocrática que negou provimento ao agravo em recurso especial, mantendo a decisão de pronúncia.\n2. O agravante sustenta a nulidade das imagens extraídas de DVR devido à quebra da cadeia de custódia, consubstanciada na falta de código HASH, ausência de lacre, participação de técnico privado e destruição da fonte original.\nII. QUESTÃO EM DISCUSSÃO\n3. A questão em discussão consiste em verificar se as falhas formais no procedimento de preservação da prova digital ensejam a nulidade absoluta da prova e a reforma da decisão agravada.\nIII. RAZÕES DE DECIDIR\n4. A decisão agravada não merece reforma. A jurisprudência do STJ orienta que a quebra da cadeia de custódia não acarreta, por si só, a ilicitude da prova, devendo ser avaliada caso a caso para verificar se houve comprometimento da integridade do elemento probatório.\n5. No caso, as instâncias ordinárias atestaram a autenticidade das imagens por meio da existência de marca d'água e perícia técnica, não tendo a defesa demonstrado prejuízo concreto ou evidência de manipulação do conteúdo.\n6. A pretensão de rediscutir a higidez da prova e a inexistência de adulteração encontra óbice no reexame de fatos e provas, atraindo a incidência da Súmula n. 7/STJ.\n7. A decisão monocrática está em conformidade com a jurisprudência dominante desta Corte Superior.\nIV. DISPOSITIVO\n7. Agravo regimental desprovido.","cit":"(AgRg no AREsp n. 3.109.361/PR, relator Ministro Antonio Saldanha Palheiro, Sexta Turma, julgado em 7/4/2026, DJEN de 14/4/2026.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202504370498&dt_publicacao=14/04/2026","origem":"Pesquisa \"prova digital\" [posição 34]","grupo":"Exigência de Demonstração de Adulteração ou de Prejuízo"},{"id":"j600294061","eixo":"e11","trib":"STJ","classe":"AgRg no HC 1.069.875/ES","registro":"2026/0029406-1","rel":"Antonio Saldanha Palheiro","conv":"","relac":"","orgao":"6ª T.","data":"31/03/2026","dje":"09/04/2026","ementa":"PROCESSO PENAL. AGRAVO REGIMENTAL NO HABEAS CORPUS. ARTS. 121, § 2º, I, III E IV; 211 E 212, TODOS DO CP; ART. 244-B, CAPUT E §2°, DA LEI N. 8.069/1990. QUEBRA DA CADEIA DE CUSTÓDIA. NÃO OCORRÊNCIA. EVENTUAIS IRREGULARIDADES DEVEM SER SOPESADAS COM OS ELEMENTOS PRODUZIDOS NA INSTRUÇÃO CRIMINAL. AGRAVO REGIMENTAL DESPROVIDO.\n1. Nos termos da jurisprudência desta Corte, a quebra da cadeia de custódia não configura invariavelmente causa de nulidade processual, mas está relacionada à eficácia da prova, a ser sopesada em cada caso concreto. É dizer, \"'o instituto da quebra da cadeia de custódia refere-se à idoneidade do caminho que deve ser percorrido pela prova até sua análise pelo magistrado, e, uma vez ocorrida qualquer interferência durante o trâmite processual, esta pode resultar na sua imprestabilidade. [...] Não é o que se tem no caso dos autos, em que não houve comprovação por parte da defesa acerca de qualquer adulteração no iter probatório' (AgRg no HC n. 665.948/MS, relator Ministro Olindo Menezes (Desembargador Convocado do TRF 1ª Região), Sexta Turma, julgado em 24/8/2021, DJe de 30/8/2021)\" (AgRg no RHC n. 209.764/RJ, de minha relatoria, Sexta Turma, julgado em 30/4/2025, DJEN de 8/5/2025).\n2. Na situação vertente, o Tribunal de origem consignou que, \"ao contrário do que alega o impetrante, não se pode presumir vícios na prova digital, sendo o entendimento do Superior Tribunal de Justiça no sentido de que cabe à defesa trazer elementos que demonstrem a ausência de confiabilidade da prova digital capaz de provocar o seu desentranhamento dos autos. [...] Dessa forma, verifico que inexiste manifesta ilegalidade capaz de justificar o desentranhamento de todas as provas ilícitas e as delas derivadas por meio do corrente remédio constitucional. Isso porque a defesa ateve-se a alegar de forma genérica que houve uma extração inadequada da prova, sem comprovar o prejuízo para a defesa ou qualquer manipulação nos elementos dos dados do celular. Eventuais vícios na prova digital poderão ser discutidos e questionados em juízo durante a própria instrução, com ampla possibilidade de contraditório\" (e-STJ fls. 28/29).\n3. Na linha dos precedentes desta Corte, não há que se falar em \"quebra da cadeia de custódia quando não evidenciado risco concreto de adulteração da prova\" (AgRg no HC n. 966.080/SP, relator Ministro Ribeiro Dantas, Quinta Turma, julgado em 14/5/2025, DJEN de 19/5/2025).\n4. Ademais, \"a ausência de geração de código hash, por si só, não invalida a prova diante na ausência de demonstração objetiva de prejuízo\" (AgRg no HC n. 989.593/SP, relator Ministro Reynaldo Soares da Fonseca, Quinta Turma, julgado em 1/4/2025, DJEN de 10/4/2025).\n5. Dessarte, nada obsta que a avaliação relativa à eventual quebra na cadeia de custódia ocorra após a conclusão do iter procedimental, quando da prolação da sentença, realizado o devido cotejo de todas as provas produzidas nos autos.\n6. Agravo regimental desprovido.","cit":"(AgRg no HC n. 1.069.875/ES, relator Ministro Antonio Saldanha Palheiro, Sexta Turma, julgado em 31/3/2026, DJEN de 9/4/2026.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202600294061&dt_publicacao=09/04/2026","origem":"Pesquisa \"prova digital\" [posição 29]","grupo":"Exigência de Demonstração de Adulteração ou de Prejuízo"},{"id":"j503374281","eixo":"e11","trib":"STJ","classe":"AgRg nos EDcl no RHC 222.911/ES","registro":"2025/0337428-1","rel":"Maria Marluce Caldas","conv":"","relac":"","orgao":"5ª T.","data":"25/03/2026","dje":"30/03/2026","ementa":"DIREITO PROCESSUAL PENAL. AGRAVO REGIMENTAL NO RECURSO EM HABEAS CORPUS. HOMICÍDIO QUALIFICADO. QUEBRA DA CADEIA DE CUSTÓDIA. AUSÊNCIA DE DEMONSTRAÇÃO DE PREJUÍZO. AGRAVO REGIMENTAL DESPROVIDO.\nI. CASO EM EXAME\n1. Agravo regimental interposto contra decisão que desproveu recurso em habeas corpus e rejeitou embargos de declaração. A defesa sustenta nulidade da prova dos autos por alegada quebra da cadeia de custódia, apontando irregularidades como ausência de formulário de cadeia de custódia, inexistência de invólucros e lacres nos aparelhos apreendidos, não identificação técnica dos dispositivos, ausência de arquivos de extração com código hash, manuseio por agentes não peritos e uso de printscreens como única forma de extração de dados.\n2. A defesa também alegou ausência de análise de documentos juntados aos autos, incluindo parecer técnico e relatório de extração de dados, que poderiam resultar em decisão diversa.\n3. Na origem, a ação penal encontra-se em fase instrutória, com audiência de instrução e julgamento designada.\nII. QUESTÃO EM DISCUSSÃO\n4. Há duas questões em discussão: (i) saber se a alegada quebra da cadeia de custódia da prova digital, desacompanhada de demonstração concreta de prejuízo ou adulteração, é suficiente para gerar sua nulidade; e (ii) saber se a análise de documentos juntados pela defesa após o oferecimento do parecer ministerial e da lavratura do voto encontra óbice na vedação à inovação probatória no âmbito do habeas corpus.\nIII. RAZÕES DE DECIDIR\n5. A alegação de quebra da cadeia de custódia, desacompanhada de demonstração efetiva de prejuízo ou adulteração da prova, não é suficiente para gerar sua nulidade, conforme entendimento consolidado do STJ.\n6. A extração dos dados telemáticos foi regularmente autorizada pelo juízo competente e realizada por meio de software especializado, com geração de código hash, garantindo a integridade e autenticidade da prova.\n7. A análise de documentos juntados pela defesa após o oferecimento do parecer ministerial e da lavratura do voto encontra óbice na vedação à inovação probatória no âmbito do habeas corpus, que é instrumento de cognição sumária e restrita aos elementos constantes dos autos no momento da impetração.\n8. Eventuais irregularidades na cadeia de custódia devem ser sopesadas pelo julgador com todos os elementos produzidos na instrução, sendo a via do habeas corpus inadequada para dilações probatórias.\n9. A ausência de demonstração de efetivo prejuízo ou de comprometimento da confiabilidade da prova digital afasta a alegação de nulidade.\nIV. DISPOSITIVO E TESE\n10. Resultado do julgamento: Agravo regimental desprovido.\nTese de julgamento: 1. A alegação de quebra da cadeia de custódia, desacompanhada de demonstração efetiva de prejuízo ou adulteração da prova, não é suficiente para gerar sua nulidade. 2. A análise de documentos juntados após o oferecimento do parecer ministerial e da lavratura do voto encontra óbice na vedação à inovação probatória no âmbito do habeas corpus. 3. Eventuais irregularidades na cadeia de custódia devem ser sopesadas pelo julgador com todos os elementos produzidos na instrução, sendo a via do habeas corpus inadequada para dilações probatórias.\nDispositivos relevantes citados: CPP, art. 159.\nJurisprudência relevante citada: STJ, AgRg no RHC 175.637/RJ, Sexta Turma, Rel. Min. Jesuíno Rissato, DJe 18/04/2024; STJ, RHC n. 187.810/RJ, Rel. Min. Daniela Teixeira, Quinta Turma, julgado em 11/2/2025, DJEN de 17/2/2025; STJ, AgRg nos EDcl no HC n. 826.476/MG, Rel. Min. Ribeiro Dantas, Quinta Turma, julgado em 9/10/2023, DJe de 16/10/2023; STJ, AgRg no HC n. 799.608/SP, Rel. Min. Joel Ilan Paciornik, Quinta Turma, julgado em 20/3/2023, DJe de 24/3/2023.","cit":"(AgRg nos EDcl no RHC n. 222.911/ES, relatora Ministra Maria Marluce Caldas, Quinta Turma, julgado em 25/3/2026, DJEN de 30/3/2026.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202503374281&dt_publicacao=30/03/2026","origem":"Pesquisa \"prova digital\" [posição 42]","grupo":"Exigência de Demonstração de Adulteração ou de Prejuízo"},{"id":"j600248020","eixo":"e11","trib":"STJ","classe":"AgRg no AREsp 3.159.694/SC","registro":"2026/0024802-0","rel":"Reynaldo Soares da Fonseca","conv":"","relac":"","orgao":"5ª T.","data":"10/03/2026","dje":"17/03/2026","ementa":"PROCESSO PENAL. AGRAVO REGIMENTAL NO AGRAVO EM RECURSO ESPECIAL. ARMAZENAMENTO DE FOTOGRAFIA, VÍDEO OU OUTRA FORMA DE REGISTRO QUE CONTENHA CENA DE SEXO EXPLÍCITO OU PORNOGRÁFICA ENVOLVENDO CRIANÇA OU ADOLESCENTE. PROVA DIGITAL. CADEIA DE CUSTÓDIA. ALEGAÇÃO DE NULIDADE. NECESSIDADE DE DEMONSTRAÇÃO CONCRETA DE ADULTERAÇÃO OU CONTAMINAÇÃO. ÓBICES DAS SÚMULAS N. 7 E 83/STJ. DISSÍDIO JURISPRUDENCIAL NÃO COMPROVADO. AGRAVO REGIMENTAL NÃO PROVIDO.\n1. O Tribunal de origem, ao afastar a alegação de nulidade por quebra da cadeia de custódia, concluiu pela validade do relatório investigativo e das imagens extraídas do celular, em razão da autorização judicial específica para acesso aos dados, da atuação de agente policial com fé pública, da adoção de cautelas para preservar o conteúdo e, sobretudo, da ausência de indícios de adulteração ou manipulação capazes de comprometer a autenticidade do material, sem indicação de prejuízo à defesa. No contexto, a análise da aventada nulidade por suposta quebra da cadeia de custódia exige a alteração das premissas fáticas fixadas pelas instâncias ordinárias, o que atrai o óbice da Súmula n. 7/STJ.\n2. A orientação jurisprudencial desta Corte é firme de que a nulidade da prova por quebra da cadeia de custódia demanda demonstração concreta de adulteração ou contaminação dos dados, não bastando a ausência de vinculação a código hash ou de técnicas forenses específicas quando inexistem indícios de manipulação (AgRg no AREsp n. 2.737.178/RO, relator Ministro Messod Azulay Neto, Quinta Turma, DJEN de 10/2/2026; AgRg no RHC n. 212.969/RJ, relator Ministro Ribeiro Dantas, Quinta Turma, DJEN de 17/9/2025).\n3. Incide a Súmula n. 83/STJ quando o acórdão recorrido se alinha à jurisprudência consolidada desta Corte, não sendo necessária a existência de precedente repetitivo (AgInt no AREsp n. 1.585.383/SC, relator Ministro Herman Benjamin, DJe de 7/5/2020).\n4. Agravo regimental não provido.","cit":"(AgRg no AREsp n. 3.159.694/SC, relator Ministro Reynaldo Soares da Fonseca, Quinta Turma, julgado em 10/3/2026, DJEN de 17/3/2026.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202600248020&dt_publicacao=17/03/2026","origem":"Pesquisa \"prova digital\" [posição 50]","grupo":"Exigência de Demonstração de Adulteração ou de Prejuízo"},{"id":"j403257749","eixo":"e11","trib":"STJ","classe":"AgRg no AREsp 2.737.178/RO","registro":"2024/0325774-9","rel":"Messod Azulay Neto","conv":"","relac":"","orgao":"5ª T.","data":"03/02/2026","dje":"10/02/2026","ementa":"DIREITO PROCESSUAL PENAL. AGRAVO REGIMENTAL. QUEBRA DE CADEIA DE CUSTÓDIA. PROVAS DIGITAIS. INEXISTÊNCIA DE VÍCIOS. RECURSO DESPROVIDO.\n\nI. CASO EM EXAME\n1. O agravante foi condenado pelo Tribunal de origem como incurso nas sanções do art. 317, § 1º, e art. 319, na forma do art. 69, todos do CP, às penas de 6 (seis) anos e 8 (oito) meses de reclusão e 4 (quatro) anos e 6 (seis) meses de detenção, em regime inicial fechado.\n2. No recurso especial, a defesa alegou quebra de cadeia de custódia da prova digital, sustentando que os procedimentos técnicos previstos nos arts. 158-A a 158-D do Código de Processo Penal não foram observados, o que comprometeria a integridade das provas obtidas do aparelho celular apreendido.\n3. No agravo regimental, o agravante reiterou a tese de quebra de cadeia de custódia e sustentou que a análise das teses apresentadas pela defesa não demandaria reexame de provas, sendo inaplicáveis as Súmulas n. 7 e 83 do STJ.\n\nII. QUESTÃO EM DISCUSSÃO\n4. A questão em discussão consiste em saber se houve quebra da cadeia de custódia das provas digitais obtidas a partir do aparelho celular apreendido, comprometendo sua autenticidade e integridade, e se a decisão impugnada deve ser reformada.\n\nIII. RAZÕES DE DECIDIR\n5. A cadeia de custódia, conforme o art. 158-A do Código de Processo Penal, foi devidamente documentada, garantindo a autenticidade e integridade da prova, desde o reconhecimento até o descarte.\n6. No caso, o Tribunal de origem concluiu, com base no acervo probatório, que não houve vícios na cadeia de custódia, considerando que a trajetória do celular foi devidamente documentada, com autorização judicial para extração de dados, envio em envelope lacrado e elaboração de laudos periciais que atestaram a integridade e autenticidade dos arquivos digitais, não havendo indícios de adulteração ou contaminação dos dados examinados.\n7. A jurisprudência do Superior Tribunal de Justiça estabelece que a nulidade da prova por quebra de cadeia de custódia exige demonstração concreta de adulteração ou contaminação, o que não foi comprovado no caso.\n8. A pretensão recursal de reconhecimento de quebra de cadeia de custódia demandaria reexame do contexto fático-probatório, providência vedada na via do recurso especial, conforme Súmula n. 7 do STJ.\n\nIV. DISPOSITIVO E TESE\n9. Resultado do Julgamento: Agravo regimental desprovido.\n\nTese de julgamento:\n\nDispositivos relevantes citados: CPP, arts. 158-A, 158-B, 158-C, 158-D; CP, arts. 317, § 1º, 319, 69.\n\nJurisprudência relevante citada: Súmula n. 7/STJ; Súmula n. 83/STJ; Súmula n. 280/STF; Súmula n. 284/STF.","cit":"(AgRg no AREsp n. 2.737.178/RO, relator Ministro Messod Azulay Neto, Quinta Turma, julgado em 3/2/2026, DJEN de 10/2/2026.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202403257749&dt_publicacao=10/02/2026","origem":"Pesquisa \"prova digital\" e \"quebra da cadeia de custódia\" [posição 6]","grupo":"Exigência de Demonstração de Adulteração ou de Prejuízo"},{"id":"j504377636","eixo":"e11","trib":"STJ","classe":"AgRg no HC 1.050.577/SE","registro":"2025/0437763-6","rel":"Antonio Saldanha Palheiro","conv":"","relac":"","orgao":"6ª T.","data":"17/12/2025","dje":"23/12/2025","ementa":"DIREITO PENAL E PROCESSUAL PENAL. AGRAVO REGIMENTAL EM HABEAS CORPUS. QUEBRA DA CADEIA DE CUSTÓDIA DE PROVAS DIGITAIS. TEORIA DOS FRUTOS DA ÁRVORE ENVENENADA. AGRAVO REGIMENTAL DESPROVIDO.\n\nI. Caso em exame\n1. Agravo regimental interposto contra decisão que denegou ordem em habeas corpus, no qual pleiteava a defesa a nulidade de condenação por contravenção penal de vias de fato, em contexto de violência doméstica, com fundamento na alegada ilicitude de provas digitais (fotografias e vídeos) e na quebra da cadeia de custódia.\n\nII. Questão em discussão\n2. Há três questões em discussão: (i) saber se a condenação pode ser considerada nula, por estar fundada em provas digitais, cuja origem e integridade não foram preservadas; (ii) saber se a quebra da cadeia de custódia do material digital compromete a validade das provas; e (iii) saber se a Teoria dos Frutos da Árvore Envenenada é aplicável ao caso, tornando ilícitas as provas derivadas das provas digitais questionadas.\n\nIII. Razões de decidir\n3. A quebra da cadeia de custódia não gera nulidade obrigatória da prova, devendo eventuais irregularidades ser analisadas em conjunto com o acervo probatório para verificar sua confiabilidade.\n4. As fotografias e vídeos apresentados pela vítima foram considerados consistentes com as provas orais e outros elementos do processo, não havendo indícios de adulteração ou manipulação.\n5. A defesa não demonstrou prejuízo efetivo nem requereu oportunamente a realização de perícia específica, o que impossibilita a declaração de nulidade processual.\n6. A Teoria dos Frutos da Árvore Envenenada não se aplica ao caso, pois as provas digitais foram consideradas lícitas e válidas, não havendo elementos que comprometam sua integridade ou confiabilidade.\n\nIV. Dispositivo e tese\n6. Resultado do Julgamento: Agravo regimental desprovido.\n\nTese de julgamento: 1. A quebra da cadeia de custódia não gera nulidade obrigatória da prova, devendo eventuais irregularidades ser analisadas em conjunto com o acervo probatório para verificar sua confiabilidade. 2. A ausência de indícios de adulteração ou manipulação das provas digitais, corroboradas por outros elementos probatórios, afasta a alegação de ilicitude. 3. A Teoria dos Frutos da Árvore Envenenada não se aplica quando as provas originais são consideradas lícitas e válidas.\n\nDispositivos relevantes citados: CPP, arts. 158-A a 158-F, 157, § 1º, 386, VII, e 565; e CF/1988, art. 5º, LIV.\n\nJurisprudência relevante citada: STJ, AgRg no HC n. 919.686/GO, Rel. Min. Antonio Saldanha Palheiro, Sexta Turma, julgado em 18/6/2025; STJ, AgRg no AREsp n. 2.836.831/SP, Rel. Min. Reynaldo Soares da Fonseca, Quinta Turma, julgado em 18/3/2025; e STJ, AgRg nos EDcl no AgRg no AREsp n. 2.532.340/SP, Rel. Min. Joel Ilan Paciornik, Quinta Turma, julgado em 1º/4/2025.","cit":"(AgRg no HC n. 1.050.577/SE, relator Ministro Antonio Saldanha Palheiro, Sexta Turma, julgado em 17/12/2025, DJEN de 23/12/2025.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202504377636&dt_publicacao=23/12/2025","origem":"Pesquisa \"prova digital\" e \"quebra da cadeia de custódia\" [posição 7]","grupo":"Exigência de Demonstração de Adulteração ou de Prejuízo"},{"id":"j500489128","eixo":"e11","trib":"STJ","classe":"AgRg no AREsp 2.858.120/SP","registro":"2025/0048912-8","rel":"Messod Azulay Neto","conv":"","relac":"","orgao":"5ª T.","data":"11/11/2025","dje":"14/11/2025","ementa":"Direito Processual Penal. Agravo Regimental. Nulidade de prova digital. Violação da cadeia de custódia. Ausência de demonstração de prejuízo. Agravo regimental não provido.\nI. Caso em exame\n1. Agravo regimental interposto contra decisão que conheceu do agravo para não conhecer do recurso especial. A defesa sustenta nulidade de prova digital, consistente em foto de comprovante de recarga obtida de celular não apreendido, por violação da cadeia de custódia, com fundamento nos arts. 158, 155 e 157 do Código de Processo Penal.\n2. A decisão recorrida consignou a ausência de demonstração de efetivo prejuízo em relação à alegada quebra da cadeia de custódia da prova, considerando que a imagem de tela não integrou o acervo utilizado para fundamentar o juízo de pronúncia.\nII. Questão em discussão\n3. A questão em discussão consiste em saber se a ausência de realização de prova pericial em imagens de tela que instruíram o procedimento investigatório, alegadamente violando a cadeia de custódia da prova, gera nulidade processual, considerando a ausência de demonstração de efetivo prejuízo.\nIII. Razões de decidir\n4. A declaração de nulidade processual requer a demonstração de efetivo prejuízo, o que não foi comprovado pela parte recorrente.\n5. A utilização de capturas de tela no curso da instrução criminal não gera nulidade por quebra da cadeia de custódia, especialmente quando há outras provas nos autos que embasam eventual condenação.\n6. A prova digital mencionada pela defesa não integrou o acervo utilizado para fundamentar o juízo de pronúncia, sendo a decisão de pronúncia baseada em outros elementos probatórios colhidos sob o crivo do contraditório e da ampla defesa.\n7. A submissão da recorrente ao julgamento pelo Tribunal do Júri é justificada pela existência de indícios de autoria e materialidade delitiva, sendo inviável o acolhimento do pleito de absolvição ou impronúncia neste momento processual.\nIV. Dispositivo e tese\n8. Resultado do Julgamento: Agravo regimental não provido.\nTese de julgamento:\n1. A declaração de nulidade processual por quebra da cadeia de custódia da prova exige a demonstração de efetivo prejuízo, conforme o princípio do pas de nullité sans grief.\n2. 2. A utilização de capturas de tela no curso da instrução criminal não gera nulidade por quebra da cadeia de custódia, especialmente quando há outras provas nos autos que embasam eventual condenação.\n3. A decisão de pronúncia deve ser fundamentada com base em elementos probatórios colhidos sob o crivo do contraditório e da ampla defesa, sendo inviável o acolhimento de pleito de absolvição ou impronúncia na fase de sumário da culpa.\nDispositivos relevantes citados: CPP, arts. 158, 155 e 157.\nJurisprudência relevante citada: STJ, AgRg no HC 995.719/SP, rel. Min. Carlos Cini Marchionatti (Desembargador Convocado TJRS), Quinta Turma, julgado em 20.08.2025; STJ, AgRg nos EDcl no AREsp 2.732.017/SP, rel. Min. Antonio Saldanha Palheiro, Sexta Turma, julgado em 05.08.2025.","cit":"(AgRg no AREsp n. 2.858.120/SP, relator Ministro Messod Azulay Neto, Quinta Turma, julgado em 11/11/2025, DJEN de 14/11/2025.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202500489128&dt_publicacao=14/11/2025","origem":"Pesquisa \"prova digital\" [posição 26]","grupo":"Exigência de Demonstração de Adulteração ou de Prejuízo"},{"id":"j501978219","eixo":"e11","trib":"STJ","classe":"AgRg nos EDcl no AREsp 2.951.541/MG","registro":"2025/0197821-9","rel":"Maria Marluce Caldas","conv":"","relac":"","orgao":"5ª T.","data":"04/11/2025","dje":"10/11/2025","ementa":"Direito processual penal. Agravo regimental. Cadeia de custódia de prova digital. Ausência de demonstração de adulteração ou prejuízo.\nPrincípio pas de nullité sans grief. Agravo regimental não provido.\nI. Caso em exame\n1. Agravo regimental interposto contra decisão monocrática que conheceu do agravo em recurso especial e negou provimento ao recurso especial, fundamentando que não houve demonstração concreta de adulteração ou contaminação dos vestígios digitais, inexistência de prejuízo e suficiência de elementos probatórios autônomos colhidos sob contraditório.\n2. O recorrente alegou que a decisão monocrática afastou indevidamente a aplicação de precedente do REsp nº 1.825.622/SP e desconsiderou vício de omissão quanto ao enfrentamento dos \"outros elementos de convicção\" utilizados para manter a condenação, invocando o art. 158-B, IV, do CPP.\n3. O Ministério Público opinou pelo não provimento do agravo regimental, reiterando a inexistência de demonstração concreta de adulteração ou manipulação indevida das provas digitais, ausência de prejuízo e suficiência de elementos probatórios autônomos.\nII. Questão em discussão\n4. A questão em discussão consiste em saber se a ausência de demonstração concreta de adulteração ou manipulação indevida das provas digitais, aliada à suficiência de elementos probatórios autônomos, afasta a nulidade da prova digital com base na quebra da cadeia de custódia.\nIII. Razões de decidir\n5. A nulidade decorrente da quebra da cadeia de custódia exige demonstração concreta de adulteração ou contaminação dos vestígios, conforme o princípio pas de nullité sans grief, previsto no art. 563 do CPP.\n6. A condenação foi fundamentada em elementos probatórios autônomos colhidos sob contraditório judicial, além dos conteúdos digitais, afastando a alegação de fragilidade da prova digital.\n7. A decisão monocrática está em conformidade com a jurisprudência consolidada, não havendo demonstração de prejuízo ou irregularidade concreta que justifique a nulidade da prova digital.\nIV. Dispositivo e tese\n8. Resultado do Julgamento: Agravo regimental não provido.\nTese de julgamento:\n1. A nulidade decorrente da quebra da cadeia de custódia de prova digital exige demonstração concreta de adulteração ou contaminação dos vestígios, em conformidade com o princípio pas de nullité sans grief.\n2. A existência de elementos probatórios autônomos colhidos sob contraditório judicial afasta a alegação de fragilidade da prova digital e a nulidade por quebra da cadeia de custódia.\nDispositivos relevantes citados: CPP, arts. 158-B, IV, e 563.\nJurisprudência relevante citada: STJ, REsp nº 1.825.622/SP.","cit":"(AgRg nos EDcl no AREsp n. 2.951.541/MG, relatora Ministra Maria Marluce Caldas, Quinta Turma, julgado em 4/11/2025, DJEN de 10/11/2025.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202501978219&dt_publicacao=10/11/2025","origem":"Pesquisa \"prova digital\" [posição 22]","grupo":"Exigência de Demonstração de Adulteração ou de Prejuízo"},{"id":"j502074113","eixo":"e11","trib":"STJ","classe":"AgRg no AREsp 2.957.402/SP","registro":"2025/0207411-3","rel":"Maria Marluce Caldas","conv":"","relac":"","orgao":"5ª T.","data":"04/11/2025","dje":"11/11/2025","ementa":"Direito processual penal. Agravo regimental. Cadeia de custódia. Dosimetria da pena. Alegação de nulidade e desproporcionalidade. Agravo não provido.\nI. Caso em exame\n1. Agravo regimental interposto contra decisão que negou provimento a recurso especial, fundamentada na ausência de demonstração de prejuízo concreto em relação à alegada quebra da cadeia de custódia da prova digital e na inexistência de ilegalidade ou irrazoabilidade na dosimetria da pena.\n2. O agravante sustenta violação aos artigos 158-A, 158-B, incisos IV e VIII, e 158-E, §3º, inciso V, do Código de Processo Penal, alegando quebra da cadeia de custódia das provas digitais utilizadas no processo, bem como negativa de vigência ao art. 69 do Código Penal Militar, em razão de desproporcionalidade na dosimetria da pena.\nII. Questão em discussão\n3. Há duas questões em discussão: (i) saber se a alegada quebra da cadeia de custódia das provas digitais acarreta nulidade, considerando a ausência de documentação formal e perícia técnica; e (ii) saber se a dosimetria da pena foi desproporcional, em razão da valoração de seis circunstâncias judiciais desfavoráveis.\nIII. Razões de decidir\n4. A quebra da cadeia de custódia não acarreta nulidade da prova, salvo demonstração concreta de prejuízo ao acusado, conforme o princípio pas de nullité sans grief (art. 563 do CPP).\n5. As instâncias ordinárias concluíram pela regularidade da captação dos dados, não havendo elementos concretos que indiquem adulteração ou prejuízo efetivo à defesa. A revisão desse entendimento encontra óbice na Súmula 7 do STJ.\n6. A dosimetria da pena foi fundamentada em seis circunstâncias judiciais desfavoráveis, com base em elementos concretos que extrapolam o tipo penal, como a gravidade do crime, intensidade do dolo, extensão do dano, meios empregados, circunstâncias de tempo e lugar, e insensibilidade dos agentes.\n7. A fundamentação utilizada pelas instâncias ordinárias não configura bis in idem ou ilegalidade manifesta, sendo apta a justificar a elevação da pena-base.\nIV. Dispositivo e tese\n8. Resultado do Julgamento: Agravo regimental não provido.\nTese de julgamento:\n1. A quebra da cadeia de custódia não acarreta nulidade da prova, salvo demonstração concreta de prejuízo ao acusado, conforme o princípio pas de nullité sans grief.\n2. A revisão da dosimetria da pena em sede de recurso especial é medida excepcional, cabível apenas em casos de manifesta ilegalidade ou arbitrariedade.\n3. A valoração de circunstâncias judiciais desfavoráveis deve ser fundamentada em elementos concretos que extrapolem o tipo penal, sendo vedada a utilização de fundamentos genéricos ou configuradores de bis in idem.\nDispositivos relevantes citados: CPP, arts. 157, 158-A, 158-B, 158-E, §3º, e 563; CPM, art. 69.\nJurisprudência relevante citada: STJ, AgRg no RHC 147.885/SP, Rel. Min. Olindo Menezes, Sexta Turma, julgado em 07.12.2021.","cit":"(AgRg no AREsp n. 2.957.402/SP, relatora Ministra Maria Marluce Caldas, Quinta Turma, julgado em 4/11/2025, DJEN de 11/11/2025.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202502074113&dt_publicacao=11/11/2025","origem":"Pesquisa \"prova digital\" [posição 40]","grupo":"Exigência de Demonstração de Adulteração ou de Prejuízo"},{"id":"j503357572","eixo":"e11","trib":"STJ","classe":"AgRg nos EDcl no HC 1.032.583/RS","registro":"2025/0335757-2","rel":"Messod Azulay Neto","conv":"","relac":"","orgao":"5ª T.","data":"29/10/2025","dje":"04/11/2025","ementa":"Direito processual penal. Agravo regimental nos Embargos de Declaração no Habeas Corpus. Tese de quebra da Cadeia de custódia DE CELULAR ALHEIO. Alegação de nulidade NÃO DEMONSTRADA. CASO CONCRETO.\nRecurso não conhecido.\nI. Caso em exame\n1. Agravo regimental interposto contra decisão que não conheceu de habeas corpus, no qual se alegava constrangimento ilegal em virtude de suposta quebra da cadeia de custódia de prova digital obtida a partir de celular apreendido com corréu.\n2. A defesa sustentou que houve acesso indevido aos dados do celular antes de autorização judicial, violação à cadeia de custódia digital (arts. 158-A a 158-F do CPP) e utilização de prova potencialmente ilícita para instruir a ação penal. Requereu a realização de perícia oficial independente pelo IGP.\n3. O Tribunal de origem afastou as alegações de nulidade, fundamentando que não houve comprovação de adulteração ou interferência indevida na prova, e que a defesa não apresentou elementos capazes de desacreditar a preservação das provas produzidas.\nII. Questão em discussão\n4. A questão em discussão consiste em saber se a alegada quebra da cadeia de custódia da prova digital, obtida a partir de celular apreendido, configura nulidade capaz de invalidar a prova e justificar a concessão de habeas corpus.\nIII. Razões de decidir\n5. A cadeia de custódia consiste no caminho idôneo percorrido pela prova até sua análise, sendo que irregularidades devem ser sopesadas pelo magistrado com os elementos produzidos na instrução para aferir sua confiabilidade.\n6. A jurisprudência do STJ é firme no sentido de que a quebra da cadeia de custódia não implica necessariamente na imprestabilidade da prova, devendo ser demonstrada adulteração ou interferência indevida capaz de invalidá-la.\n7. No caso concreto, as instâncias ordinárias concluíram pela integridade da prova, afastando a alegação de contaminação ou adulteração, e destacaram que a defesa não apresentou elementos concretos para desacreditar a preservação das provas.\n8. A análise de teses que demandem revolvimento fático-probatório, como insuficiência probatória ou negativa de autoria, é inviável na via do habeas corpus e de seu recurso.\n9. O agravo regimental limitou-se a reiterar as teses do habeas corpus, sem atacar especificamente os fundamentos da decisão agravada, aplicando-se a Súmula n. 182, STJ.\nIV. Dispositivo e tese\n10. Resultado do Julgamento: Agravo regimental não conhecido.\nTese de julgamento:\n1. A quebra da cadeia de custódia da prova não implica necessariamente em sua nulidade, devendo ser demonstrada adult
