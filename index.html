ade criada pela própria custódia estatal, não se pode exigir da defesa demonstração específica de adulteração do conteúdo; o ônus de comprovar integridade e confiabilidade das fontes de prova apresentadas recai sobre o Estado.\n8. A certificação por hash na extração originária atesta apenas a correspondência naquele momento histórico específico e, portanto, não elide incertezas supervenientes nem substitui a necessidade de repetição em atenção ao contraditório efetivo de quem não fez parte da relação jurídica que deu causa à descoberta fortuita; a irrepetibilidade esvazia o valor probatório do conteúdo para a ação penal decorrente da descoberta de indícios na perícia originária de outro delito.\n9. Na via do habeas corpus, não se examina a suficiência do acervo probatório autônomo remanescente, limitando-se ao reconhecimento da imprestabilidade da prova digital impugnada e dos efeitos correlatos sobre o contraditório e a ampla defesa.\n\nIV. DISPOSITIVO E TESE\n6. Resultado do Julgamento: Agravo regimental parcialmente provido para reconhecer a imprestabilidade da prova digital extraída do aparelho celular e conceder a ordem, vedando sua utilização na ação penal decorrente da descoberta fortuita.\n\nTese de julgamento: 1. O Estado deve conservar, com integridade, identidade e autenticidade, vestígios sob sua custódia; a inobservância dessa preservação compromete a confiabilidade e impede o uso da prova na persecução penal. 2. A impossibilidade de repetição da perícia, ocasionada por bloqueio por senha superveniente e ausência de lacre, torna imprestável a prova digital para acusação contra terceiro e impede o contraditório técnico efetivo. 3. O ônus de comprovar a integridade e a confiabilidade das fontes de prova apresentadas recai sobre o Estado, especialmente quando descumpridos procedimentos de cadeia de custódia. 4. A certificação por hash na extração originária não supre falhas posteriores de custódia nem afasta dúvidas sobre autenticidade e comparabilidade do conteúdo em contexto diverso.\n\nDispositivos relevantes citados: CPP, art. 158; CP, art. 317, caput e § 1º; CP, arts. 29 e 71\n\nJurisprudência relevante citada: STJ, AgRg no RHC 143.169/RJ, Rel. Min. Messod Azulay Neto, Rel. p/ acórdão Min. Ribeiro Dantas, Quinta Turma, julgado em 07.02.2023, DJe 02.03.2023.","cit":"(AgRg no HC n. 1.029.565/ES, relator Ministro Joel Ilan Paciornik, relator para acórdão Ministro Messod Azulay Neto, Quinta Turma, julgado em 13/10/2026, DJEN de 4/11/2026.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202503180246&dt_publicacao=04/11/2026","origem":"Pesquisa \"prova digital\" [posição 16]; Pesquisa \"prova digital\" e \"quebra da cadeia de custódia\" [posição 16]","grupo":""},{"id":"j302482249","eixo":"e5","trib":"STJ","classe":"AgRg no RHC 184.003/SP","registro":"2023/0248224-9","rel":"Daniela Teixeira","conv":"","relac":"Ribeiro Dantas","orgao":"5ª T.","data":"10/12/2024","dje":"26/12/2024","ementa":"DIREITO PROCESSUAL PENAL. AGRAVO REGIMENTAL. PROVA DIGITAL. CADEIA DE CUSTÓDIA. INADMISSIBILIDADE. ORDEM CONCEDIDA.\nI. CASO EM EXAME\n1. Agravo regimental interposto contra decisão monocrática que negou provimento a recurso ordinário em habeas corpus, visando à declaração de inadmissibilidade de provas digitais obtidas mediante busca e apreensão, devido a falhas na obtenção dos arquivos.\n2. A defesa alega deficiência na documentação dos procedimentos de manuseio da prova digital e comprometimento à integridade da prova, porque parte dos arquivos está inacessível.\n3. Decisão de primeira instância indeferiu o pedido de produção de provas adicionais para esclarecer a confiabilidade e integridade dos dados eletrônicos.\nII. QUESTÃO EM DISCUSSÃO\n4. A questão em discussão consiste em saber se a prova digital obtida mediante busca e apreensão, com parte dos arquivos corrompidos e inacessíveis, pode ser admitida em juízo.\nIII. RAZÕES DE DECIDIR\n6. O simples fato de haver registro das hashes dos arquivos extraídos de aparelhos eletrônicos apreendidos não prova, por si só, a integridade da prova digital. Para tanto, seria necessário comparar as hashes dos arquivos originais com aquelas dos arquivos disponibilizados pelo Ministério Público, o que não foi feito na origem.\n7. Como reconhecem o juízo singular, o Tribunal local e o Ministério Público, parte dos arquivos eletrônicos foi corrompida sob a a custódia estatal por \"algum tipo de erro\" (palavras do Parquet), que não se sabe quando ou como aconteceu. Também não se sabe qual seria o conteúdo dos arquivos corrompidos, o que compromete a integralidade da prova, impossibilitando a defesa de acessar informações potencialmente relevantes.\n8. A jurisprudência do STJ, em casos semelhantes, determina a inadmissibilidade de provas incompletas, em respeito aos princípios do contraditório e da ampla defesa, e à própria confiabilidade dos registros de corpo de delito.\nIV. DISPOSITIVO E TESE\n9. Agravo regimental provido para declarar inadmissíveis as provas digitais obtidas na medida cautelar, bem como todas as provas delas derivadas.\nTese de julgamento: \"1. A prova digital deve ser completa e íntegra para ser admitida em juízo. 2. A corrupção de parte dos arquivos compromete a integralidade da prova, inviabilizando sua utilização\".\nDispositivos relevantes citados: CPP, arts. 157, § 1º, e 158.\nJurisprudência relevante citada: STJ, HC 160.662/RJ, Rel. Min. Assusete Magalhães, Sexta Turma, julgado em 18.02.2014; STJ, AgRg no RHC 143.169/RJ, Rel. para acórdão Min. Ribeiro Dantas, Quinta Turma, julgado em 07.02.2023.","cit":"(AgRg no RHC n. 184.003/SP, relatora Ministra Daniela Teixeira, relator para acórdão Ministro Ribeiro Dantas, Quinta Turma, julgado em 10/12/2024, DJEN de 26/12/2024.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202302482249&dt_publicacao=26/12/2024","origem":"Pesquisa \"prova digital\" [posição 4]","grupo":""},{"id":"j502313413","eixo":"e6","trib":"STJ","classe":"AgRg no HC 1.014.212/ES","registro":"2025/0231341-3","rel":"Carlos Pires Brandão","conv":"","relac":"","orgao":"6ª T.","data":"10/02/2026","dje":"20/02/2026","ementa":"DIREITO PROCESSUAL PENAL. AGRAVO REGIMENTAL NO HABEAS CORPUS. HOMICÍDIO QUALIFICADO E ASSOCIAÇÃO CRIMINOSA. PRISÃO PREVENTIVA. PROVA DIGITAL. CADEIA DE CUSTÓDIA. NECESSIDADE DE PERÍCIA TÉCNICA COMPLEMENTAR. NECESSIDADE DE CONFIRMAÇÃO DA FIDEDIGNIDADE DOS ELEMENTOS PROBATÓRIOS DIGITAIS. SUBSTITUIÇÃO DA PRISÃO PREVENTIVA POR MEDIDAS CAUTELARES. PROPORCIONALIDADE. AGRAVO REGIMENTAL PARCIALMENTE PROVIDO.\nI. CASO EM EXAME\n1. Agravo regimental interposto contra decisão que denegou ordem de habeas corpus.\n2. O agravante foi preso pela prática dos crimes previstos nos arts. 121, § 2º, I e IV, e 288 (homicídio e associação criminosa), ambos do Código Penal. A defesa alegou excesso de prazo na prisão preventiva e quebra da cadeia de custódia das provas, consistindo em prints de conversas de WhatsApp, obtidos mediante acesso direto de agentes policiais aos aparelhos, interceptações telefônicas, estação rádio base e imagens de videomonitoramento, juntadas aos autos sem perícia técnica, em violação aos arts. 158-A e 158-B do Código de Processo Penal.\n3. O Tribunal de origem denegou a ordem de habeas corpus, entendendo que não houve demonstração de prejuízo concreto para a decretação de nulidade das provas e que o prazo processual não excedeu os limites da razoabilidade.\nII. QUESTÃO EM DISCUSSÃO\n4. Há duas questões em discussão: (i) saber se houve quebra da cadeia de custódia das provas, apta a comprometer sua validade; e (ii) saber se houve excesso de prazo na prisão preventiva, caracterizando constrangimento ilegal.\nIII. RAZÕES DE DECIDIR\n5. A prova digital possui características ontológicas de volatilidade e modificabilidade que exigem rigor técnico na sua coleta e preservação. O ônus de comprovar a integridade e confiabilidade das fontes de prova (identidade) incumbe ao Estado-acusação. A dúvida razoável sobre a inalterabilidade dos dados não pode militar em desfavor do réu.\n6. Ainda que se distingam documentos digitais (visualizáveis de plano) de vestígios complexos, a segurança jurídica do processo penal não admite condenações baseadas em elementos cuja origem seja questionável e não passível de verificação. A ausência de demonstração cabal nos autos sobre os procedimentos de preservação recomenda, por cautela, a submissão dos dispositivos à análise pericial.\n7. Para que a prova digital seja válida, é imperativo assegurar sua identidade e inalterabilidade, isto é, a correspondência fidedigna entre o dado coletado e o apresentado em juízo. Diante da incerteza sobre a adoção de salvaguardas técnicas no momento da apreensão, impõe-se a realização de perícia complementar para aferir a integridade do material e permitir o contraditório efetivo.\n8. A necessidade de confirmação pericial da fidedignidade dos elementos digitais, embora não afaste os indícios de autoria, recomenda a substituição da prisão preventiva por medidas cautelares diversas.\nIV. Dispositivo e tese\n9. Agravo regimental parcialmente provido. Ordem concedida em parte para: (a) determinar o encaminhamento dos dispositivos à perícia oficial para verificação de integridade; (b) substituir a prisão preventiva por medidas cautelares diversas.\nTese de julgamento:\n1. Havendo dúvida razoável sobre a integridade e autenticidade da prova digital, é necessária a realização de exame pericial para assegurar a confiabilidade do material e o exercício do contraditório.\n2. Quando os principais elementos probatórios de autoria consistem em dados digitais cuja fidedignidade necessita de confirmação mediante exame pericial, a proporcionalidade recomenda a substituição da prisão preventiva por medidas cautelares diversas até a conclusão da diligência técnica .\nDispositivos relevantes citados: CPP, arts. 158-A e segs., 282, § 6º, 319.\nJurisprudência relevante citada: STJ, REsp 2.123.764/ES, Rel. Min. Sebastião Reis Júnior, Sexta Turma, j. 27/08/2024. STJ, AgRg no RHC 125.734/SP, Rel. Min. Antonio Saldanha Palheiro, Sexta Turma. STJ, AREsp 2.972.295/MT, Rel. Min. Reynaldo Soares da Fonseca, Quinta Turma, j. 16/09/2025. STJ, EDcl no AgRg no AREsp 2.980.626/SP, Rel. Min. Messod Azulay Neto, Quinta Turma, j. 18/11/2025.","cit":"(AgRg no HC n. 1.014.212/ES, relator Ministro Carlos Pires Brandão, Sexta Turma, julgado em 10/2/2026, DJEN de 20/2/2026.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202502313413&dt_publicacao=20/02/2026","origem":"Pesquisa \"prova digital\" [posição 6]","grupo":""},{"id":"j601834946","eixo":"e7","trib":"STJ","classe":"AgRg no AREsp 3.258.001/GO","registro":"2026/0183494-6","rel":"Joel Ilan Paciornik","conv":"","relac":"","orgao":"5ª T.","data":"01/10/2026","dje":"06/10/2026","ementa":"DIREITO PROCESSUAL PENAL. AGRAVO REGIMENTAL. PROVA DIGITAL. CADEIA DE CUSTÓDIA. PERÍCIA TÉCNICA COM ALGORITMO HASH. SÚMULA N. 7/STJ. REEXAME DE PROVAS VEDADO. AGRAVO DESPROVIDO.\n\nI. CASO EM EXAME\n1. Agravo regimental interposto contra decisão monocrática que, com fundamento no art. 932, III, do CPC e na Súmula 7/STJ, conheceu do agravo para não conhecer do recurso especial.\n2. A defesa sustenta a inaplicabilidade da Súmula 7/STJ, afirmando tratar-se de revaloração jurídica de fatos incontroversos relativos ao procedimento de obtenção, preservação e apresentação de elementos digitais, bem como a nulidade das provas por suposta quebra da cadeia de custódia e alegada inversão do ônus da prova.\n3. O Tribunal de origem rejeitou a preliminar de nulidade por suposta quebra da cadeia de custódia, registrando a realização de perícia técnica com metodologia baseada nas normas ABNT NBR ISO/IEC 27037 e 27042, com aplicação de algoritmo hash, e atestando a autenticidade e a integridade das mensagens e áudios extraídos diretamente dos aparelhos celulares, sem indícios de adulteração, alteração cronológica ou supressão. Concluiu que eventual irregularidade impactaria a valoração, não a validade da prova, exigindo demonstração concreta de adulteração ou prejuízo, ausente no caso.\n\nII. QUESTÃO EM DISCUSSÃO\n4. A primeira questão em discussão consiste em saber se a alegada quebra da cadeia de custódia e a suposta vulnerabilidade das evidências digitais acarretam nulidade do meio probatório, à luz da perícia realizada e da ausência de indícios de adulteração.\n5. A segunda questão em discussão consiste em saber se a análise pretendida demanda reexame das circunstâncias fático-probatórias e do conteúdo técnico do laudo, hipótese vedada pela Súmula 7/STJ.\n6. A terceira questão em discussão consiste em saber se houve inversão indevida do ônus da prova ao exigir da defesa a indicação concreta de vícios nas evidências digitais após a demonstração técnica de integridade.\n\nIII. RAZÕES DE DECIDIR\n7. A perícia técnica observou metodologia reconhecida para preservação e análise de dados digitais (ABNT NBR ISO/IEC 27037 e 27042), com aplicação de algoritmo hash, atestando a autenticidade e a integridade das conversas e áudios extraídos diretamente dos aparelhos, sem indícios de adulteração ou manipulação; as alegações defensivas são genéricas e desprovidas de elementos concretos.\n8. A jurisprudência desta Corte Superior reconhece que a quebra da cadeia de custódia não gera nulidade automática, exigindo-se a avaliação da confiabilidade da prova e a demonstração de prejuízo à defesa, além de indícios de modificação, adulteração ou substituição da fonte, o que não foi demonstrado.\n9. A pretensão de infirmar as conclusões do Tribunal de origem quanto à suficiência dos procedimentos e à integridade das evidências digitais demandaria reexame do conjunto fático-probatório e do conteúdo técnico do laudo, providência vedada em recurso especial pela Súmula 7/STJ.\n10. Não há inversão do ônus da prova quando comprovada tecnicamente a integridade do material digital, sendo certo que meras conjecturas sobre eventual manipulação não bastam sem a indicação de vícios específicos e comprováveis.\n11. A decisão impugnada está em consonância com a jurisprudência desta Corte Superior quanto à necessidade de demonstração concreta de vícios e de prejuízo e à vedação ao simples reexame de provas no âmbito do recurso especial.\n\nIV. DISPOSITIVO E TESE\n12. Resultado do Julgamento: Agravo regimental desprovido, mantida a decisão que não conheceu do recurso especial.\n\nTese de julgamento: 1. A mera alegação de quebra da cadeia de custódia não invalida a prova digital, sendo imprescindível a demonstração concreta de adulteração, modificação ou substituição da fonte e de prejuízo à defesa. 2. A revisão de conclusões sobre a integridade de evidências digitais periciadas demanda reexame do acervo probatório, providência vedada pela Súmula 7/STJ. 3. Não há inversão do ônus da prova quando a integridade do material digital é tecnicamente demonstrada, sendo insuficientes alegações genéricas para reconhecer nulidade processual acerca da quebra da integridade da cadeia de custódia.\n\nDispositivos relevantes citados: CPP, arts. 157 a 158-F; CPC, art. 932, III; Súmula 7/STJ\n\nJurisprudência relevante citada:","cit":"(AgRg no AREsp n. 3.258.001/GO, relator Ministro Joel Ilan Paciornik, Quinta Turma, julgado em 1/10/2026, DJEN de 6/10/2026.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202601834946&dt_publicacao=06/10/2026","origem":"Pesquisa \"prova digital\" [posição 8]; Pesquisa \"prova digital\" e \"quebra da cadeia de custódia\" [posição 12]","grupo":""},{"id":"j503860194","eixo":"e8","trib":"STJ","classe":"AgRg no AgRg no HC 1.041.340/RS","registro":"2025/0386019-4","rel":"Ribeiro Dantas","conv":"","relac":"","orgao":"5ª T.","data":"15/04/2026","dje":"23/04/2026","ementa":"Direito processual penal. Agravo regimental em habeas corpus. Prova digital extraída de aparelhos celulares. Cadeia de custódia. Acesso à cópia forense integral (UFD E ufdx, além de ufdr), e documentação técnica. Contraditório e ampla defesa. Agravo regimental IMprovido.\nI. Caso em exame\n1. Agravo regimental interposto pelo Ministério Público estadual contra decisão monocrática que, em habeas corpus, concedeu ordem, de ofício, para determinar a disponibilização à defesa da íntegra das extrações dos aparelhos celulares apreendidos em ação penal por tráfico e associação para o tráfico, em formato de cópia forense (UFD, UFDX, além de UFDR), com documentação técnica respectiva, assegurando exame técnico assistido e posterior reavaliação, pelo Tribunal de origem, das preliminares sobre integridade e admissibilidade das provas digitais.\n2. O agravante alega utilização indevida do habeas corpus como sucedâneo recursal, impossibilidade de reexame aprofundado de provas na via estreita do writ, observância do art. 158-A, § 6º, do Código de Processo Penal pela disponibilização de relatórios de extração em cartório com possibilidade de cotejo técnico e ausência de prejuízo concreto, bem como sustenta que a não entrega de cópia integral dos dados extraídos não caracterizaria quebra da cadeia de custódia desde que garantido o acesso ao material probatório.\nII. Questão em discussão\n3. A questão em discussão consiste em saber se, diante de alegações específicas de cerceamento de defesa e de possível manipulação ou edição de relatórios de extração de dados de aparelhos celulares, a disponibilização à defesa apenas de relatórios em PDF e arquivos de áudio selecionados, sem acesso à cópia forense integral das extrações (UFD, UFDX, além de UFDR), e à documentação técnica respectiva, atende ao disposto no art. 158-A, § 6º, do Código de Processo Penal e assegura o pleno contraditório, a ampla defesa e a paridade de armas.\nIII. Razões de decidir\n4. O art. 158-A, § 6º, do Código de Processo Penal impõe ao Estado o dever de, havendo requerimento, disponibilizar, no ambiente do órgão oficial, sob guarda institucional e na presença de perito oficial, o material probatório que serviu de base à perícia, o que, em se tratando de prova digital, abrange a cópia forense integral das extrações e a documentação técnica correlata.\n5. A jurisprudência desta Corte Superior exige, para a integridade e auditabilidade da prova digital, a preservação da cadeia de custódia e a possibilidade de exame técnico independente, o que inclui o acesso à imagem forense completa dos dispositivos eletrônicos e, quando existentes, aos hashes e relatórios de extração.\n6. No caso concreto, embora a instância de origem tenha registrado a disponibilização de relatórios em cartório e admitido a prática de inserir numeração de páginas nos relatórios como \"não recomendável\", a defesa demonstrou que o acesso efetivo limitou-se a arquivos em PDF e áudios em formato OPUS reunidos em pastas de \"seleção de áudios degravados\", sem comprovação de acesso à íntegra das extrações em formato forense (UFD, UFDX, além de UFDR) e sem disponibilização da documentação técnica pertinente, o que impede o exercício pleno do contraditório e da paridade de armas diante de suspeitas de edição ou manipulação.\n7. A orientação segundo a qual não é obrigatória a transcrição integral de áudios não exonera o Estado do dever de garantir à defesa o acesso integral ao material probatório que serviu de base à perícia, especialmente quando há alegações concretas sobre a integridade das provas digitais e quando o acesso se mostra restrito a seleções de conteúdo dissociadas da íntegra das extrações forenses.\n8. Mostra-se adequada e proporcional a determinação de disponibilizar a íntegra das extrações em formato de cópia forense, assegurar exame técnico assistido pela defesa e remeter ao Tribunal de origem a reavaliação das preliminares sobre integridade e admissibilidade da prova digital à luz dos resultados periciais, inexistindo usurpação de competência das instâncias ordinárias nem utilização abusiva do habeas corpus.\nIV. Dispositivo e tese\n9. Resultado do Julgamento: Agravo regimental improvido.\nTese de julgamento:\n1. Havendo requerimento, o art. 158-A, § 6º, do Código de Processo Penal impõe ao Estado o dever de disponibilizar à defesa, no órgão oficial e sob controle pericial, o material probatório que serviu de base à perícia, incluída a cópia forense integral das extrações digitais e a documentação técnica respectiva.\n2. A disponibilização apenas de relatórios em PDF e de áudios selecionados, sem acesso à íntegra das extrações forenses de dados de aparelhos celulares e sem documentação técnica adequada, não assegura a integralidade e a auditabilidade da prova digital nem o pleno exercício do contraditório e da paridade de armas.\n3. A ausência de obrigatoriedade de transcrição integral de áudios não dispensa o Estado de franquear à defesa o acesso integral ao material probatório digital subjacente, sobretudo diante de alegações específicas de manipulação ou edição da prova.\nDispositivos relevantes citados: CPP, art. 158-A, § 6º; CPP, arts. 157, § 1º, e 158.\nJurisprudência relevante citada: STJ, AgRg no RHC 143.169/RJ, Rel. Min. Messod Azulay Neto, Rel. p/ acórdão Min. Ribeiro Dantas, Quinta Turma, j. 07.02.2023, DJe 02.03.2023; STJ, AgRg no RHC 184.003/SP, Rel.ª Min. Daniela Teixeira, Rel. p/ acórdão Min. Ribeiro Dantas, Quinta Turma, j. 10.12.2024, DJe 26.12.2024; STJ, AgRg no REsp 2.000.925/RS, Rel. Min. Joel Ilan Paciornik, Quinta Turma, j.\n15.04.2024; STJ, AgRg no HC 1.000.768/SP; STJ, HC 160.662/RJ, Rel. Min. Ribeiro Dantas, Quinta Turma, j. 03.09.2025.","cit":"(AgRg no AgRg no HC n. 1.041.340/RS, relator Ministro Ribeiro Dantas, Quinta Turma, julgado em 15/4/2026, DJEN de 23/4/2026.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202503860194&dt_publicacao=23/04/2026","origem":"Pesquisa \"prova digital\" [posição 17]","grupo":""},{"id":"j601558892","eixo":"e9","trib":"STJ","classe":"AgRg no RHC 237.119/MT","registro":"2026/0155889-2","rel":"Reynaldo Soares da Fonseca","conv":"","relac":"","orgao":"5ª T.","data":"12/05/2026","dje":"20/05/2026","ementa":"PENAL E PROCESSO PENAL. AGRAVO REGIMENTAL NO RECURSO ORDINÁRIO EM HABEAS CORPUS. ROUBO MAJORADO E USURPAÇÃO DE FUNÇÃO PÚBLICA. NULIDADE DA DECISÃO DE PRIMEIRO GRAU. ALEGADA AUSÊNCIA DE FUNDAMENTAÇÃO. NÃO OCORRÊNCIA. PROVA DIGITAL. SUPOSTA QUEBRA DA CADEIA DE CUSTÓDIA. INEXISTÊNCIA DE NULIDADE AUTOMÁTICA. NECESSIDADE DE DEMONSTRAÇÃO DE PREJUÍZO. ANÁLISE QUE DEMANDA DILAÇÃO PROBATÓRIA. VIA INADEQUADA. DESENTRANHAMENTO IMEDIATO. IMPOSSIBILIDADE. PERÍCIA TÉCNICA. MATÉRIA AFETA AO JUÍZO DA CAUSA. INEXISTÊNCIA DE CONSTRANGIMENTO ILEGAL. AGRAVO REGIMENTAL A QUE SE NEGA PROVIMENTO.\n1. A quebra da cadeia de custódia não acarreta nulidade automática da prova, exigindo-se demonstração de adulteração ou comprometimento da fidedignidade e prejuízo concreto à defesa.\n2. A aferição da integridade e autenticidade de vestígios digitais demanda exame técnico sob contraditório e avaliação pelo Juízo natural, sendo incompatível com a cognição sumária do habeas corpus o reconhecimento, de plano, de inadmissibilidade com base em alegações defensivas desacompanhadas de prova pré-constituída de ilegalidade manifesta.\n3. A decisão que afasta nulidade e remete o exame técnico para a instrução não é nula se enfrenta as teses defensivas, registrando a falta de elemento objetivo de adulteração ou manipulação e a necessidade de demonstração de prejuízo concreto, além de ressalvar a imprescindibilidade de dilação probatória para exame técnico detalhado.\n4. O pedido de perícia técnica sobre a prova digital deve ser submetido ao Juízo de primeiro grau, no momento processual adequado, à luz das provas já produzidas e da pertinência da diligência para a instrução\n5. Agravo regimental a que se nega provimento.","cit":"(AgRg no RHC n. 237.119/MT, relator Ministro Reynaldo Soares da Fonseca, Quinta Turma, julgado em 12/5/2026, DJEN de 20/5/2026.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202601558892&dt_publicacao=20/05/2026","origem":"Pesquisa \"prova digital\" [posição 19]; Pesquisa \"prova digital\" e \"quebra da cadeia de custódia\" [posição 17]","grupo":""},{"id":"j505080668","eixo":"e9","trib":"STJ","classe":"AgRg no HC 1.063.216/GO","registro":"2025/0508066-8","rel":"Ribeiro Dantas","conv":"","relac":"","orgao":"5ª T.","data":"15/04/2026","dje":"23/04/2026","ementa":"DIREITO PROCESSUAL PENAL. AGRAVO REGIMENTAL EM HABEAS CORPUS. PROVA DIGITAL. CADEIA DE CUSTÓDIA. INADMISSIBILIDADE PROBATÓRIA. TRANCAMENTO DA AÇÃO PENAL. IMPOSSIBILIDADE. AGRAVO REGIMENTAL IMPROVIDO.\n\nI. CASO EM EXAME\n1. Agravo regimental interposto contra decisão que não conheceu de habeas corpus impetrado em favor de paciente acusado em ação penal instaurada a partir de provas digitais extraídas de aparelho celular de corréu.\n2. Segundo a defesa, conversas de WhatsApp foram obtidas mediante análise preliminar do aparelho telefônico pela autoridade policial, antes de encaminhamento do dispositivo à perícia oficial, sem extração pericial formal, sem indicação de código hash e sem documentação técnica apta a demonstrar a integridade e a mesmidade do material digital, o que configuraria quebra da cadeia de custódia, violação aos arts. 157 e 158-A e seguintes do Código de Processo Penal e ao art. 5º, LVI, da Constituição da República, impondo a inadmissibilidade da prova e o trancamento da persecução penal.\n3. O acórdão recorrido considerou adequada a descrição fática da denúncia, a individualização da conduta atribuída ao paciente e a existência, em tese, de elementos informativos de suporte à acusação, reputando prematuro, em sede de habeas corpus e antes da instrução, o exame exauriente da alegada quebra da cadeia de custódia da prova digital e a consequente pretensão de trancamento da ação penal.\n\nII. QUESTÃO EM DISCUSSÃO\n4. Há duas questões em discussão: (i) saber se a alegada quebra da cadeia de custódia de prova digital obtida de aparelho celular de corréu, sem observância de cautelas técnicas mínimas, torna inadmissível o material eletrônico e autoriza, de plano, o trancamento da ação penal; e (ii) saber se o habeas corpus constitui via processual adequada para, antes do encerramento da instrução e sem exame aprofundado da documentação técnica e dos demais elementos informativos, reconhecer a ausência de justa causa para a persecução penal.\n\nIII. RAZÕES DE DECIDIR\n5. A cadeia de custódia da prova digital não constitui mera formalidade, pois se relaciona diretamente com a confiabilidade do elemento probatório, incumbindo ao Estado demonstrar objetivamente que o material apresentado corresponde, de modo confiável, ao vestígio originalmente arrecadado, não sendo legítimo transferir à defesa o ônus de provar adulteração concreta nem presumir, sem mais, a integridade do conteúdo eletrônico.\n6. A discussão acerca de prova digital pode envolver, mais do que nulidade processual regida pelo art. 563 do Código de Processo Penal, questão de admissibilidade probatória, relativa à aptidão mínima do material para ingresso válido no processo, podendo a prova digital desprovida de lastro técnico suficiente revelar-se inadmissível mesmo sem demonstração de ilicitude.\n7. No caso concreto, a controvérsia demanda análise do modo de obtenção e do manuseio do aparelho celular apreendido, da documentação produzida sobre extração e utilização dos dados digitais e da eventual existência de outras fontes informativas autônomas que tenham subsidiado a imputação, exame que pressupõe incursão aprofundada no acervo fático-probatório incompatível com os estreitos limites cognitivos do habeas corpus.\n8. A circunstância de o relatório policial mencionar análise preliminar do aparelho celular, seguida de encaminhamento do dispositivo à unidade de inteligência para extração integral de dados, embora exija controle rigoroso pelo juízo natural, não autoriza, por si só e de imediato, concluir que a acusação se apoia exclusivamente em prova inadmissível, havendo necessidade de percurso probatório a ser desenvolvido na instrução criminal.\n9. A instrução criminal ainda não se encerrou e a defesa já submeteu a questão ao juízo processante, de modo que não se mostra possível, em sede mandamental, declarar desde logo a inadmissibilidade do material digital ou trancar a ação penal, ausente constrangimento ilegal manifesto decorrente da manutenção da persecução penal.\n10. Os precedentes desta Corte sobre cadeia de custódia da prova digital, inclusive aqueles que reconhecem a inadmissibilidade de elementos eletrônicos quando ausente documentação idônea sobre sua obtenção, não autorizam solução automática e indiferenciada, impondo-se abordagem casuística que considere o procedimento efetivamente adotado e as garantias observadas no caso específico, o que reforça a inadequação do habeas corpus para o exame exauriente pretendido.\n\nIV. DISPOSITIVO E TESE\n11. Resultado do Julgamento: Agravo regimental não provido, mantida a decisão que não conheceu do habeas corpus e afastou, neste momento processual, o trancamento da ação penal.\n\nTese de julgamento: 1. A aferição de eventual quebra da cadeia de custódia e da admissibilidade de prova digital extraída de aparelho celular demanda exame casuístico e técnico do procedimento de obtenção, preservação e utilização dos dados, em regra incompatível com a via estreita do habeas corpus antes do encerramento da instrução. 2. Não cabe trancamento da ação penal em habeas corpus quando a alegada ausência de justa causa depende de análise aprofundada do acervo fático-probatório, inclusive sobre a origem e a integridade de provas digitais controvertidas. 3. A discussão sobre confiabilidade e admissibilidade da prova digital não se confunde integralmente com o regime de nulidades dependentes de demonstração de prejuízo previsto no art. 563 do Código de Processo Penal.\n\nDispositivos relevantes citados: CR/1988, art. 5º, LVI; CPP, arts. 157, 158-A e seguintes, 563.\n\nJurisprudência relevante citada: Precedentes desta Corte sobre cadeia de custódia de prova digital (não individualizados no voto).","cit":"(AgRg no HC n. 1.063.216/GO, relator Ministro Ribeiro Dantas, Quinta Turma, julgado em 15/4/2026, DJEN de 23/4/2026.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202505080668&dt_publicacao=23/04/2026","origem":"Pesquisa \"prova digital\" [posição 10]; Pesquisa \"prova digital\" e \"quebra da cadeia de custódia\" [posição 15]","grupo":""},{"id":"j600265360","eixo":"e10","trib":"STJ","classe":"AgRg no AREsp 3.160.190/SP","registro":"2026/0026536-0","rel":"Joel Ilan Paciornik","conv":"","relac":"","orgao":"5ª T.","data":"06/10/2026","dje":"03/11/2026","ementa":"DIREITO PROCESSUAL PENAL. AGRAVO REGIMENTAL. PROVA DIGITAL. CADEIA DE CUSTÓDIA. SÚMULA 7/STJ. DISSÍDIO JURISPRUDENCIAL PELA ALÍNEA C. AGRAVO DESPROVIDO.\n\nI. CASO EM EXAME\n1. O recurso. Agravo regimental interposto contra decisão que conheceu do agravo para conhecer em parte e desprover o recurso especial da defesa, manejado contra acórdão do Tribunal de Justiça do Estado de São Paulo que manteve condenação pelo art. 218-C, § 1º, do Código Penal, com incidência da Lei 11.340/06.\n2. Fato relevante. Defesa sustenta nulidade das provas digitais (capturas de tela de mensagens) por violação aos arts. 158, 159 e 158-A do Código de Processo Penal (cadeia de custódia), alegando que a apreciação demanda revaloração jurídica, e não revolvimento fático-probatório.\n3. As decisões anteriores. Instâncias ordinárias reconheceram materialidade e autoria com base em relatório, documentos e prova oral, assentando licitude das capturas de tela e inexistência de quebra da cadeia de custódia. A decisão agravada manteve o entendimento, aplicando a Súmula 7/STJ para obstar o reexame de fatos e provas e não conheceu o recurso especial pela alínea \"c\" por ausência de cotejo analítico e indicação de paradigmas adequados.\n\nII. QUESTÃO EM DISCUSSÃO\n4. A questão em discussão consiste em saber se as provas digitais apresentadas nos autos são nulas por quebra da cadeia de custódia, bem como se a análise pretendida pela defesa configura revaloração jurídica ou exige revolvimento fático-probatório vedado em recurso especial.\n5. A questão em discussão consiste em saber se o recurso especial pode ser conhecido pela alínea \"c\" do permissivo constitucional sem a realização de cotejo analítico e com utilização de paradigmas inadequados.\n\nIII. RAZÕES DE DECIDIR\n6. Inexistiu demonstração concreta de adulteração ou contaminação dos vestígios digitais; as capturas de tela foram obtidas diretamente dos destinatários, sem indícios de manipulação, e não houve requerimento defensivo de perícia nos aparelhos, preservando-se a confiabilidade do conteúdo.\n7. A alteração da conclusão das instâncias ordinárias quanto à integridade das provas digitais demandaria revolvimento fático-probatório, providência vedada pela Súmula 7/STJ.\n8. Eventuais irregularidades formais na cadeia de custódia devem ser apreciadas à luz do conjunto probatório e não implicam nulidade quando mantida a confiabilidade do vestígio.\n9. O conhecimento do recurso especial pela alínea \"c\" exige cotejo analítico e paradigmas idôneos, nos termos do CPC e do RISTJ; acórdãos proferidos em habeas corpus, mandado de segurança e respectivos recursos não se prestam à demonstração de dissídio jurisprudencial.\n\nIV. DISPOSITIVO E TESE\n10. Resultado do Julgamento: Agravo regimental desprovido.\n\nTese de julgamento: 1. A nulidade de prova digital por quebra da cadeia de custódia exige demonstração concreta de adulteração ou contaminação dos vestígios. 2. A revisão da conclusão das instâncias ordinárias sobre a integridade de provas digitais demanda revolvimento fático-probatório, inviável em recurso especial à luz da Súmula 7/STJ. 3. O recurso especial fundado na alínea \"c\" deve observar o cotejo analítico e a indicação de paradigmas adequados, conforme CPC e RISTJ, sendo inadequados acórdãos proferidos em habeas corpus e mandado de segurança.\n\nDispositivos relevantes citados: CPP, arts. 158, 159, 158-A e 386, V e VII; CP, art. 218-C, § 1º; Lei nº 11.340/2006; CF/1988, art. 105, III, \"c\"; CPC, art. 1.029, § 1º; RISTJ, art. 255, § 1º; Súmula 7/STJ\n\nJurisprudência relevante citada: STJ, Inq 1.658/DF, Corte Especial; STJ, APn 1.076/DF, Rel. Ministra Nancy Andrighi, Corte Especial, j. 06.05.2026, DJEN 28.05.2026; STJ, AgRg no RHC 227.463/MT, Rel. Ministro Og Fernandes, Sexta Turma, j. 03.06.2026, DJEN 10.06.2026","cit":"(AgRg no AREsp n. 3.160.190/SP, relator Ministro Joel Ilan Paciornik, Quinta Turma, julgado em 6/10/2026, DJEN de 3/11/2026.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202600265360&dt_publicacao=03/11/2026","origem":"Pesquisa \"prova digital\" [posição 14]; Pesquisa \"prova digital\" e \"quebra da cadeia de custódia\" [posição 13]","grupo":""},{"id":"j503771170","eixo":"e10","trib":"STJ","classe":"AgRg no AREsp 3.062.087/RS","registro":"2025/0377117-0","rel":"Sebastião Reis Júnior","conv":"","relac":"","orgao":"6ª T.","data":"10/02/2026","dje":"20/02/2026","ementa":"DIREITO PENAL. AGRAVO REGIMENTAL EM AGRAVO EM RECURSO ESPECIAL. ESTUPRO DE VULNERÁVEL. VALIDADE DE PROVA DIGITAL. NULIDADE POR QUEBRA DE CADEIA DE CUSTÓDIA. AGRAVO REGIMENTAL IMPROVIDO.\nI. CASO EM EXAME\n1. Agravo regimental interposto contra decisão monocrática que não conheceu de recurso especial em razão do óbice da Súmula 7/STJ, em caso de condenação por estupro de vulnerável.\n2. O agravante sustenta a nulidade da prova digital consistente em prints de mensagens de aplicativo de celular, alegando ausência de autenticação, falta de apreensão dos celulares, ausência de perícia, inexistência de metadados e quebra da cadeia de custódia. Requer a absolvição por insuficiência de provas e questiona a credibilidade do depoimento da vítima.\n3. O Tribunal de origem concluiu pela suficiência de elementos probatórios acerca da materialidade e autoria do crime, considerando os depoimentos da vítima e de testemunhas, além dos prints de mensagens, como provas válidas e não impugnadas durante a instrução processual.\nII. QUESTÃO EM DISCUSSÃO\n4. A questão em discussão consiste em saber se os prints de mensagens de aplicativo de celular, sem autenticação, sem apreensão dos dispositivos, sem perícia e sem metadados, podem ser considerados provas válidas para fundamentar a condenação por estupro de vulnerável.\n5. Saber se a condenação pode ser mantida com base em outros elementos probatórios, como os depoimentos da vítima e de testemunhas, mesmo diante da alegação de insuficiência de provas e nulidade dos prints.\nIII. RAZÕES DE DECIDIR\n6. O Tribunal de origem concluiu pela suficiência de elementos probatórios para a condenação, incluindo os depoimentos da vítima e de testemunhas, além dos prints de mensagens, que não foram impugnados durante a instrução processual.\n7. A alegação de nulidade dos prints de mensagens por quebra da cadeia de custódia não foi demonstrada, sendo necessário comprovar manipulação ou adulteração das provas, o que não ocorreu no caso concreto.\n8. A condenação não se baseou exclusivamente nos prints de mensagens, mas também em outros elementos probatórios, como os depoimentos da vítima e de testemunhas, que foram submetidos ao contraditório e considerados suficientes para a formação do convencimento do juízo.\n9. A modificação do entendimento das instâncias ordinárias demandaria incursão no acervo fático-probatório, o que encontra óbice na Súmula 7/STJ.\nIV. DISPOSITIVO E TESE\n10. Agravo regimental improvido.\nTese de julgamento: 1. A validade de prints de mensagens de aplicativo de celular como prova penal depende da demonstração de sua autenticidade e integridade, sendo necessária a comprovação de manipulação ou adulteração para reconhecimento de sua ilicitude. 2.\nA condenação penal pode ser fundamentada em conjunto probatório suficiente, incluindo depoimentos de vítimas e testemunhas, desde que submetidos ao contraditório e à ampla defesa. 3. A modificação de entendimento das instâncias ordinárias que reconhecem a suficiência de provas para condenação encontra óbice na Súmula 7/STJ.\nDispositivos relevantes citados: CPP, arts. 155, 158-A a 158-F, 386, VII; Súmula 7/STJ.\nJurisprudência relevante citada: STJ, AgRg no HC 958.288/SP, Rel. Min. Antonio Saldanha Palheiro, Sexta Turma, DJEN 16/6/2025.","cit":"(AgRg no AREsp n. 3.062.087/RS, relator Ministro Sebastião Reis Júnior, Sexta Turma, julgado em 10/2/2026, DJEN de 20/2/2026.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202503771170&dt_publicacao=20/02/2026","origem":"Pesquisa \"prova digital\" [posição 13]","grupo":""},{"id":"j503506003","eixo":"e10","trib":"STJ","classe":"HC 1.035.054/SP","registro":"2025/0350600-3","rel":"Sebastião Reis Júnior","conv":"","relac":"","orgao":"6ª T.","data":"18/11/2025","dje":"27/11/2025","ementa":"DIREITO PROCESSUAL PENAL. HABEAS CORPUS. TRÁFICO DE DROGAS. APREENSÃO DE CELULAR. ACESSO A DADOS ARMAZENADOS. PROVA ILÍCITA. FONTE INDEPENDENTE. CONDENAÇÃO SUFICIENTEMENTE FUNDAMENTADA EM OUTRAS PROVAS.\n1. A condenação da paciente foi suficientemente fundamentada em outras provas válidas, obtidas no momento de sua prisão em flagrante, e mantém-se ainda que sejam desconsideradas as controvertidas mensagens de WhatsApp extraídas de seu aparelho celular.\n2. Apesar da ilicitude do conteúdo do relatório de investigação com imagens de captura de tela (prints ou screenshots) de conversas de WhatsApp, a posterior extração dos dados do aparelho celular da paciente realizada com autorização judicial permite classificar tais provas como de fonte independente, nos termos do art. 157, § 2º, do Código de Processo Penal.\n3. A apreensão do dispositivo foi realizada de forma legítima durante a prisão da paciente em flagrante delito, de modo que era natural que o Ministério Público ou a autoridade policial solicitassem ao juízo o afastamento do sigilo dos dados armazenados no aparelho.\n4. Ordem denegada.","cit":"(HC n. 1.035.054/SP, relator Ministro Sebastião Reis Júnior, Sexta Turma, julgado em 18/11/2025, DJEN de 27/11/2025.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202503506003&dt_publicacao=27/11/2025","origem":"Linha do tempo do STJ sobre print e captura de tela","grupo":""},{"id":"j502300852","eixo":"e10","trib":"STJ","classe":"AREsp 2.972.295/MT","registro":"2025/0230085-2","rel":"Reynaldo Soares da Fonseca","conv":"","relac":"","orgao":"5ª T.","data":"16/09/2025","dje":"23/09/2025","ementa":"DIREITO PROCESSUAL PENAL. AGRAVO EM RECURSO ESPECIAL. CADEIA DE CUSTÓDIA. EXTRAÇÃO DE DADOS DE CELULAR. PROVA VÁLIDA. AGRAVO CONHECIDO E DESPROVIDO.\nI. Caso em exame\n1. Agravo interposto contra decisão que inadmitiu recurso especial manejado em face de acórdão do Tribunal de Justiça do Estado de Mato Grosso, que rejeitou preliminar de nulidade das provas oriundas da extração de dados de aparelhos celulares por alegada quebra da cadeia de custódia e manteve a condenação do recorrente pelos crimes de organização criminosa e tráfico de drogas.\n2. O recorrente sustenta que a extração de dados dos aparelhos celulares foi realizada sem observância das normas legais, configurando prova ilícita, e que houve quebra da cadeia de custódia, comprometendo a autenticidade e a idoneidade das provas.\nII. Questão em discussão\n3. A questão em discussão consiste em saber se a extração de dados dos aparelhos celulares do recorrente, realizada inicialmente de forma manual por investigador de polícia e posteriormente por meio da ferramenta Cellebrite, com aplicação de técnica de algoritmo hash, configura quebra da cadeia de custódia capaz de invalidar as provas e comprometer a condenação.\nIII. Razões de decidir\n4. A cadeia de custódia da prova foi preservada, conforme demonstrado pela utilização da ferramenta Cellebrite e pela aplicação da técnica de algoritmo hash, que garantem a integridade e a confiabilidade dos dados extraídos. Precedente recente do STJ (AgRg no HC n. 983.223/SP, relator Ministro Carlos Cini Marchionatti (Desembargador Convocado TJRS), Quinta Turma, julgado em 21/5/2025, DJEN de 26/5/2025.\n5. A jurisprudência do Superior Tribunal de Justiça estabelece que irregularidades na cadeia de custódia devem ser sopesadas pelo magistrado com todos os elementos produzidos na instrução, a fim de aferir a confiabilidade da prova (HC 653.515/RJ, Sexta Turma, Rel. Min. Rogerio Schietti Cruz).\n6. Não há demonstração de adulteração ou prejuízo à confiabilidade dos dados extraídos, sendo aplicável o princípio do pas de nullité sans grief (art. 563 do CPP), conforme precedentes do STJ (HC 574.131/RS, Rel. Min. Nefi Cordeiro; AgRg no AREsp 2.677.012/RJ, Rel. Min. Otávio de Almeida Toledo).\n7. A decisão judicial que autorizou a extração de dados foi cumprida, e os procedimentos adotados pela perícia oficial (POLITEC) e pelos investigadores garantiram a idoneidade das provas, não havendo elementos concretos que indiquem quebra da cadeia de custódia ou ilicitude probatória.\nIV. Dispositivo e tese\n8. Resultado do Julgamento: Agravo conhecido e desprovido.\nTese de julgamento:\n1. A cadeia de custódia da prova deve ser analisada em conjunto com os elementos produzidos na instrução, sendo válida a prova cuja integridade e confiabilidade sejam demonstradas.\n2. A aplicação de técnicas como o algoritmo hash e o uso de ferramentas forenses como Cellebrite garantem a auditabilidade e a idoneidade das provas extraídas de dispositivos eletrônicos.\n3. A quebra da cadeia de custódia somente enseja nulidade da prova quando demonstrado prejuízo concreto à confiabilidade do material periciado.\nDispositivos relevantes citados: CPP, arts. 157, 158-A, 158-B, 158-C, 158-D, 563 e 564, IV.\nJurisprudência relevante citada: STJ, HC 653.515/RJ, Rel. Min. Rogerio Schietti Cruz, Sexta Turma, DJe 01.02.2022; STJ, HC 574.131/RS, Rel. Min. Nefi Cordeiro, Sexta Turma, DJe 04.09.2020;\nSTJ, AgRg no AREsp 2.677.012/RJ, Rel. Min. Otávio de Almeida Toledo, Sexta Turma, DJEN 05.08.2025.","cit":"(AREsp n. 2.972.295/MT, relator Ministro Reynaldo Soares da Fonseca, Quinta Turma, julgado em 16/9/2025, DJEN de 23/9/2025.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202502300852&dt_publicacao=23/09/2025","origem":"Linha do tempo do STJ sobre print e captura de tela","grupo":""},{"id":"j401077524","eixo":"e10","trib":"STJ","classe":"AgRg no AREsp 2.600.503/ES","registro":"2024/0107752-4","rel":"Antonio Saldanha Palheiro","conv":"","relac":"","orgao":"6ª T.","data":"17/06/2025","dje":"25/06/2025","ementa":"AGRAVO REGIMENTAL NO AGRAVO EM RECURSO ESPECIAL. PROCESSO PENAL. CORRUPÇÃO PASSIVA. PLEITO DECLARAÇÃO DE NULIDADE DA PROVA DECORRENTE DE GRAVAÇÃO CLANDESTINA DE CONVERSA POR UM DOS INTERLOCUTORES. IMPROCEDÊNCIA. ADMISSIBILIDADE PELO STJ DE TAL PROVA NO PROCESSO PENAL. TESE DE NULIDADE DA PROVA DECORRENTE DE 'PRINT' DE CONVERSA DE WHATSAPP. NÃO ACOLHIMENTO. AUSÊNCIA DE ALEGAÇÃO OU PROVA DA QUEBRA DE CADEIA DE CUSTÓDIA. AGRAVO REGIMENTAL DESPROVIDO.\n1. A tese recursal de que a gravação clandestina, por conta do artigo 8º-A da Lei nº 9.296/96, introduzido pela nº 13.964/2019, passou a depender de prévia autorização judicial, devendo haver overruling da compreensão inversa fixada pelo STF e pelo STJ, não tem amparo na jurisprudência desta Corte Superior, vez que, mesmo após a vigência da Lei 13.964/2019, esta Corte Superior tem validado a prova em processo penal decorrente da indigitada gravação clandestina realizada por um dos interlocutores 2. Também não merece acolhida a tese dos recorrentes de ilicitude da prova decorrente de print de conversa de whatsapp. É que a orientação atual desta Corte Superior é no sentido de que tal nulidade apenas existe se comprovada a quebra da cadeia de custódia da aludida prova, o que não foi cogitado ou comprovado pelos recorrentes.\n3. Agravo regimental desprovido.","cit":"(AgRg no AREsp n. 2.600.503/ES, relator Ministro Antonio Saldanha Palheiro, Sexta Turma, julgado em 17/6/2025, DJEN de 25/6/2025.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202401077524&dt_publicacao=25/06/2025","origem":"Linha do tempo do STJ sobre print e captura de tela","grupo":""},{"id":"j500239623","eixo":"e10","trib":"STJ","classe":"AgRg no AREsp 2.841.690/SP","registro":"2025/0023962-3","rel":"Carlos Cini Marchionatti","conv":"Desembargador Convocado do TJRS","relac":"","orgao":"5ª T.","data":"17/06/2025","dje":"25/06/2025","ementa":"DIREITO PROCESSUAL PENAL. AGRAVO REGIMENTAL NO AGRAVO EM RECURSO ESPECIAL. ESTUPRO DE VULNERÁVEL. PROVAS DIGITAIS E TESTEMUNHAIS. AUSÊNCIA DE QUEBRA DA CADEIA DE CUSTÓDIA. IMPOSSIBILIDADE DE ABSOLVIÇÃO. AGRAVO IMPROVIDO.\nI. CASO EM EXAME\n1. Agravo regimental interposto contra decisão monocrática que conheceu do agravo para negar provimento ao recurso especial, em razão dos óbices das Súmulas 7 e 83 do STJ, cuja pretensão era a absolvição do agravante diante da nulidade das provas.\n2. A condenação do agravante foi fundamentada em depoimentos da vítima e de familiares, além de capturas de tela de mensagens de WhatsApp, consideradas provas lícitas pelo Tribunal de Justiça de São Paulo, que não vislumbrou indícios de manipulação das mensagens.\n3. O agravante alega violação dos arts. 155 e 158-A do Código de Processo Penal, aduzindo que a condenação foi fundamentada exclusivamente na palavra da vítima e em elementos colhidos no inquérito policial, além de alegar quebra da cadeia de custódia das provas digitais.\nII. QUESTÃO EM DISCUSSÃO\n4. A questão em discussão consiste em saber se a condenação pode ser mantida com base em provas testemunhais e prints oriundos de conversas de WhatsApp, sem perícia.\nIII. RAZÕES DE DECIDIR\n5. A condenação foi mantida com base em provas testemunhais coesas e harmônicas, além de prints de conversas de WhatsApp, que, embora não periciados, não apresentaram indícios de adulteração.\n6. Desconstituir o julgado, buscando uma absolvição pela conduta criminosa analisada na origem, não encontra amparo na via eleita, dada a necessidade de revolvimento do conjunto fático-probatório, procedimento de análise exclusivo das instâncias ordinárias e vedado a este Superior Tribunal de Justiça, em sede de recurso especial, ante o óbice sumular n. 7/STJ.\nIV. DISPOSITIVO E TESE\n7. Agravo regimental improvido.\nTese de julgamento: \"1. É possível a condenação com base em prints de conversas de WhatsApp, que, embora não periciados, não apresentaram indícios de adulteração, corroborada por outros elementos probatórios, como provas testemunhais coesas e harmônicas\".\nDispositivos relevantes citados: CPP, arts. 155 e 158-A.\nJurisprudência relevante citada: STJ, AgRg no AREsp 2.574.502/SP, Rel. Min. Joel Ilan Paciornik, Quinta Turma, julgado em 08.10.2024;\nSTJ, AgRg no AREsp 2.201.089/MG, rel. Min. Teodoro Silva Santos, Sexta Turma, julgado em 20.2.2024.","cit":"(AgRg no AREsp n. 2.841.690/SP, relator Ministro Carlos Cini Marchionatti (Desembargador Convocado TJRS), Quinta Turma, julgado em 17/6/2025, DJEN de 25/6/2025.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202500239623&dt_publicacao=25/06/2025","origem":"Linha do tempo do STJ sobre print e captura de tela","grupo":""},{"id":"j500014270","eixo":"e10","trib":"STJ","classe":"AgRg no AREsp 2.833.422/RS","registro":"2025/0001427-0","rel":"Rogerio Schietti Cruz","conv":"","relac":"","orgao":"6ª T.","data":"06/05/2025","dje":"14/05/2025","ementa":"AGRAVO REGIMENTAL NO AGRAVO EM RECURSO ESPECIAL. CRIME DE ORGANIZAÇÃO CRIMINOSA. QUEBRA DA CADEIA DE CUSTÓDIA. NÃO OCORRÊNCIA. QUEBRA DE SIGILO TELEFÔNICO. TRANSCRIÇÃO INTEGRAL. DESNECESSIDADE. ASSEGURADO À DEFESA ACESSO À INTEGRALIDADE DOS DIÁLOGOS INTERCEPTADOS. ARGUIÇÃO DE NULIDADE CAUSADA PELA PARTE. IMPOSSIBILIDADE. ART. 565 DO CPP. PRECLUSÃO. VIOLAÇÃO DO ART. 619 DO CPP. NÃO CONFIGURAÇÃO. AGRAVO REGIMENTAL NÃO PROVIDO.\n1. Se é certo que, por um lado, o legislador trouxe, nos arts. 158-A a 158-F do CPP, determinações extremamente detalhadas de como se deve preservar a cadeia de custódia da prova, também é certo que, por outro, quedou-se silente em relação aos critérios objetivos para definir quando ocorre a quebra da cadeia de custódia e quais as consequências jurídicas, para o processo penal, dessa quebra ou do descumprimento de um desses dispositivos legais. No âmbito da doutrina, as soluções apresentadas são as mais diversas.\n2. De acordo com a jurisprudência desta Corte Superior, \"a cadeia de custódia consiste no caminho idôneo a ser percorrido pela prova até sua análise pelo expert, de modo que a ocorrência de qualquer interferência indevida durante sua tramitação probatória pode resultar em sua imprestabilidade para o processo de referência\" (AgRg no HC n. 829.138/RN, relator Ministro Messod Azulay Neto, Quinta Turma, julgado em 6/2/2024, DJe de 14/2/2024).\n3. A vigilância sobre a prova digital traz peculiaridades não previstas na ultrapassada legislação de regência, o que exige o cuidado do Judiciário na análise da situação concreta.\n4. Não há irregularidade na guarda da prova dos autos, pois, depois da autorização judicial, houve a apreensão dos celulares dos réus, cujos dados foram extraídos diretamente pelos policiais, sem o uso da técnica do espelhamento, o que dificulta a adulteração do material. Ainda que não realizada a perícia dos dados colhidos, observada a coleta imediata do conteúdo dos aparelhos durante a busca e apreensão, não é possível afirmar que houve quebra da cadeia de custódia. Isso porque não se pode pressupor, sem prova, eventual má-fé dos agentes públicos no manuseio dos elementos probatórios por eles recebidos.\n5. \"A jurisprudência do Superior Tribunal de Justiça está fixada no sentido de que, conquanto seja dispensável a transcrição integral dos diálogos interceptados, deve ser assegurado à Defesa o acesso à mídia que contém a gravação da integralidade daqueles\" (REsp n. 1.800.516/SP, relatora Ministra Laurita Vaz, Sexta Turma, julgado em 15/6/2021, DJe de 25/6/2021).\n6. Entende esta Corte que, \"Segundo a vedação contida no art. 565 do Código de Processo Penal, nenhuma das partes poderá arguir nulidade a que haja dado causa, ou para que tenha concorrido, ou referente a formalidade cuja observância só à parte contrária interesse\" (AgRg no RHC n. 191.053/SP, relator Ministro Ribeiro Dantas, Quinta Turma, julgado em 2/9/2024, DJe de 6/9/2024).\n7. No caso, foi assegurado à defesa o acesso às mídias que continham as gravações da integralidade dos diálogos, mas a parte se manteve inerte e não solicitou consulta à íntegra das interceptações em momento oportuno, mas somente após o fim da instrução. Assim, a inércia do réu deu causa à nulidade alegada por ele.\n8. Segundo entendimento da Corte Especial do STJ, \"para que se considere ilícita a prova obtida mediante print de WhatsApp, é indispensável a comprovação de que houve a quebra da cadeia de custódia, o que só é admissível no curso da instrução processual, momento em que é possível, inclusive, a realização de perícia nos aparelhos eventualmente apreendidos\" (Inq n. 1.658/DF, relator Ministro Og Fernandes, Corte Especial, julgado em 19/2/2025, DJEN de 11/3/2025.\n9. Na hipótese dos autos, houve preclusão quanto à solicitação de acesso à integralidade dos diálogos em discussão, que deveria haver sido feita durante a instrução processual, o que não ocorreu.\n10. O acórdão recorrido, integrado em embargos de declaração, enfrentou todas as questões essenciais à resolução da controvérsia, inclusive a argumentação acerca da quebra da cadeia de custódia. O reconhecimento de violação do art. 619 do CPP pressupõe a ocorrência de omissão, ambiguidade, contradição ou obscuridade. A assertiva, no entanto, não pode ser confundida com o mero inconformismo da parte com a conclusão alcançada pelo julgador que, apesar das teses propostas, lança mão de fundamentação idônea e suficiente para a formação do seu convencimento. Assim, fica afastada a ilegalidade indicada.\n11. Agravo regimental não provido.","cit":"(AgRg no AREsp n. 2.833.422/RS, relator Ministro Rogerio Schietti Cruz, Sexta Turma, julgado em 6/5/2025, DJEN de 14/5/2025.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202500014270&dt_publicacao=14/05/2025","origem":"Linha do tempo do STJ sobre print e captura de tela","grupo":""},{"id":"j304431460","eixo":"e10","trib":"STJ","classe":"AgRg nos EDcl no AREsp 2.521.345/RO","registro":"2023/0443146-0","rel":"Ribeiro Dantas","conv":"","relac":"","orgao":"5ª T.","data":"18/06/2024","dje":"21/06/2024","ementa":"PROCESSO PENAL. AGRAVO REGIMENTAL NOS EMBARGOS DE DECLARAÇÃO NO AGRAVO EM RECURSO ESPECIAL. RECURSO ESPECIAL TEMPESTIVO. INDISPONIBILIDADE DO SISTEMA ELETRÔNICO DO TRIBUNAL DE ORIGEM COMPROVADA. ESTUPRO DE VULNERÁVEL. EMBRIAGUEZ DA VÍTIMA. AUSÊNCIA DE PROVAS DA AUTORIA DELITIVA. TESTEMUNHAS QUE NADA PRESENCIARAM. VÍTIMA QUE NÃO SE RECORDA DO OCORRIDO. PRINTS DE CONVERSAS NO APLICATIVO WHATSAPP. AUSÊNCIA DE PERÍCIA. INADMISSIBILIDADE DA PROVA. AGRAVO REGIMENTAL PROVIDO PARA CONHECER DO AGRAVO E DAR PROVIMENTO AO RECURSO ESPECIAL, A FIM DE ABSOLVER O AGRAVANTE.\n1. Embora a Presidência desta Corte Superior não tenha conhecido do agravo, por intempestividade, há, nos autos, certidão a comprovar a suspensão do prazo processual em decorrência de indisponibilidade do sistema eletrônico do TJRO por mais de sessenta minutos, de modo que o recurso é tempestivo.\n2. Como prova da autoria delitiva, as instâncias ordinárias destacaram o depoimento da genitora da ofendida - segundo o qual o agravante teria admitido que manteve relações sexuais com a vítima, mas de maneira consentida - e os prints de whatsapp.\n3. Por outro lado, na fase judicial, o agravante negou a prática do delito; as testemunhas que estavam com a ofendida no dia dos fatos não viram qualquer aproximação entre ela e o agravante; a vítima não se recorda de ter tido relações sexuais naquele dia, mas se lembra de um momento em que estava deitada com M - e não com o agravante -, de modo que é ponderável a chance de o ato ter sido praticado por pessoa diversa.\n4. Diante da fragilidade da prova oral, fica evidente que os prints de whatsapp, desacompanhados da correspondente cadeia de custódia, foram tidos como prova principal a conduzir o decreto condenatório.\n5. A ausência de garantia mínima da integridade dos elementos contidos nas imagens acostadas aos autos torna inadmissível a sua utilização para fornecer conclusões seguras sobre as hipóteses fáticas em discussão no processo.\n6. O depoimento testemunhal indireto, por si só, não possui a capacidade necessária para sustentar uma acusação consistente, sendo imprescindível a presença de outros elementos probatórios substanciais.\n7. Agravo regimental provido para conhecer do agravo e dar provimento ao recurso especial, a fim de absolver o agravante com fundamento no art. 386, V, do CPP.","cit":"(AgRg nos EDcl no AREsp n. 2.521.345/RO, relator Ministro Ribeiro Dantas, Quinta Turma, julgado em 18/6/2024, DJe de 21/6/2024.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202304431460&dt_publicacao=21/06/2024","origem":"Linha do tempo do STJ sobre print e captura de tela","grupo":""},{"id":"j303093964","eixo":"e10","trib":"STJ","classe":"AgRg no AREsp 2.441.511/PR","registro":"2023/0309396-4","rel":"Daniela Teixeira","conv":"","relac":"","orgao":"5ª T.","data":"11/06/2024","dje":"17/06/2024","ementa":"PENAL E PROCESSUAL PENAL. AGRAVO REGIMENTAL NO AGRAVO EM RECURSO ESPECIAL. HOMICÍDIO QUALIFICADO. NULIDADES. ILICITUDE DA PROVA. VIOLAÇÃO DO ART. 155 DO CPP. PRONÚNCIA BASEADA EM TESTEMUNHOS INDIRETOS. DECISÃO AGRAVADA MANTIDA POR SEUS PRÓPRIOS FUNDAMENTOS. RECURSO NÃO PROVIDO.\n1. Não constato elementos suficientes para reconsiderar a decisão proferida, cuja conclusão mantenho pelos seus próprios fundamentos.\n2. Agravantes foram pronunciados com base em prints de conversa de whatsapp web, sem que a defesa tivesse acesso ao inteiro teor das mensagens ou relatório pericial da polícia judiciária sobre a veracidade das mensagens.\n3. A utilização de \"prints\" de mensagens, mesmo que realizados pela autoridade policial, viola a cadeia de custódia prevista nos artigos 158 e ss. do CPP e é prova ilícita de acordo com os precedentes desta Corte.\n4. Por fim, assiste razão à defesa quando aduz a existência de violação do artigo 155 do CPP no v. acórdão quanto ao exame da inadmissibilidade dos elementos informativos da etapa policial e dos depoimentos indiretos como base para manter a decisão de pronúncia.\n5. Agravo regimental desprovido.","cit":"(AgRg no AREsp n. 2.441.511/PR, relatora Ministra Daniela Teixeira, Quinta Turma, julgado em 11/6/2024, DJe de 17/6/2024.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202303093964&dt_publicacao=17/06/2024","origem":"Linha do tempo do STJ sobre print e captura de tela","grupo":""},{"id":"j301271686","eixo":"e10","trib":"STJ","classe":"AgRg nos EDcl no AREsp 2.342.908/MG","registro":"2023/0127168-6","rel":"Ribeiro Dantas","conv":"","relac":"","orgao":"5ª T.","data":"20/02/2024","dje":"26/02/2024","ementa":"PENAL E PROCESSUAL PENAL. AGRAVO REGIMENTAL NOS EMBARGOS DE DECLARAÇÃO NO AGRAVO EM RECURSO ESPECIAL. PORNOGRAFIA INFANTIL. ART. 241-B DO ECA. DADOS EXTRAÍDOS DE APARELHOS ELETRÔNICOS SEM O MENOR RIGOR TÉCNICO. QUEBRA DA CADEIA DE CUSTÓDIA. INADMISSIBILIDADE DA PROVA. PRECEDENTE DESTE COLEGIADO. AGRAVO REGIMENTAL DESPROVIDO.\n1. A principal finalidade da cadeia de custódia, enquanto decorrência lógica do conceito de corpo de delito (art. 158 do CPP), é garantir que os vestígios deixados no mundo material por uma infração penal correspondem exatamente àqueles arrecadados pela polícia, examinados e apresentados em juízo. Isto é: busca-se assegurar que os vestígios são os mesmos, sem nenhum tipo de adulteração ocorrida durante o período em que permaneceram sob a custódia do Estado.\n2. A falta de documentação mínima dos procedimentos adotados pela polícia no tratamento da prova extraída de aparelhos eletrônicos, bem como a falta de adoção das práticas necessárias para garantir a integridade do conteúdo, torna inadmissível a prova, por quebra da cadeia de custódia. Entendimento adotado por esta Quinta Turma no julgamento do AgRg no RHC 143.169/RJ, de minha relatoria, DJe de 2/3/2023.\n3. Como decidimos naquela ocasião, \"é ônus do Estado comprovar a integridade e confiabilidade das fontes de prova por ele apresentadas. É incabível, aqui, simplesmente presumir a veracidade das alegações estatais, quando descumpridos os procedimentos referentes à cadeia de custódia. No processo penal, a atividade do Estado é o objeto do controle de legalidade, e não o parâmetro do controle; isto é, cabe ao Judiciário controlar a atuação do Estado-acusação a partir do direito, e não a partir de uma autoproclamada confiança que o Estado-acusação deposita em si mesmo\".\n4. Agravo regimental desprovido.","cit":"(AgRg nos EDcl no AREsp n. 2.342.908/MG, relator Ministro Ribeiro Dantas, Quinta Turma, julgado em 20/2/2024, DJe de 26/2/2024.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202301271686&dt_publicacao=26/02/2024","origem":"Linha do tempo do STJ sobre print e captura de tela","grupo":""},{"id":"j100573956","eixo":"e10","trib":"STJ","classe":"AgRg no RHC 143.169/RJ","registro":"2021/0057395-6","rel":"Messod Azulay Neto","conv":"","relac":"Ribeiro Dantas","orgao":"5ª T.","data":"07/02/2023","dje":"02/03/2023","ementa":"PENAL E PROCESSUAL PENAL. AGRAVO REGIMENTAL NO RECURSO ORDINÁRIO EM HABEAS CORPUS. OPERAÇÃO OPEN DOORS. FURTO, ORGANIZAÇÃO CRIMINOSA E LAVAGEM DE DINHEIRO. ACESSO A DOCUMENTOS DE COLABORAÇÃO PREMIADA. FALHA NA INSTRUÇÃO DO HABEAS CORPUS. CADEIA DE CUSTÓDIA. INOBSERVÂNCIA DOS PROCEDIMENTOS TÉCNICOS NECESSÁRIOS A GARANTIR A INTEGRIDADE DAS FONTES DE PROVA ARRECADADAS PELA POLÍCIA. FALTA DE DOCUMENTAÇÃO DOS ATOS REALIZADOS NO TRATAMENTO DA PROVA. CONFIABILIDADE COMPROMETIDA. PROVAS INADMISSÍVEIS, EM CONSEQUÊNCIA. AGRAVO REGIMENTAL PARCIALMENTE PROVIDO PARA PROVER TAMBÉM EM PARTE O RECURSO ORDINÁRIO.\n1. O habeas corpus não foi adequadamente instruído para comprovar as alegações defensivas referentes ao acesso a documentos da colaboração premiada, o que impede o provimento do recurso no ponto.\n2. A principal finalidade da cadeia de custódia é garantir que os vestígios deixados no mundo material por uma infração penal correspondem exatamente àqueles arrecadados pela polícia, examinados e apresentados em juízo.\n3. Embora o específico regramento dos arts. 158-A a 158-F do CPP (introduzidos pela Lei 13.964/2019) não retroaja, a necessidade de preservar a cadeia de custódia não surgiu com eles. Afinal, a ideia de cadeia de custódia é logicamente indissociável do próprio conceito de corpo de delito, constante no CPP desde a redação original de seu art. 158. Por isso, mesmo para fatos anteriores a 2019, é necessário avaliar a preservação da cadeia de custódia.\n4. A autoridade policial responsável pela apreensão de um computador (ou outro dispositivo de armazenamento de informações digitais) deve copiar integralmente (bit a bit) o conteúdo do dispositivo, gerando uma imagem dos dados: um arquivo que espelha e representa fielmente o conteúdo original.\n5. Aplicando-se uma técnica de algoritmo hash, é possível obter uma assinatura única para cada arquivo, que teria um valor diferente caso um único bit de informação fosse alterado em alguma etapa da investigação, quando a fonte de prova já estivesse sob a custódia da polícia. Comparando as hashes calculadas nos momentos da coleta e da perícia (ou de sua repetição em juízo), é possível detectar se o conteúdo extraído do dispositivo foi modificado.\n6. É ônus do Estado comprovar a integridade e confiabilidade das fontes de prova por ele apresentadas. É incabível, aqui, simplesmente presumir a veracidade das alegações estatais, quando descumpridos os procedimentos referentes à cadeia de custódia. No processo penal, a atividade do Estado é o objeto do controle de legalidade, e não o parâmetro do controle; isto é, cabe ao Judiciário controlar a atuação do Estado-acusação a partir do direito, e não a partir de uma autoproclamada confiança que o Estado-acusação deposita em si mesmo.\n7. No caso dos autos, a polícia não documentou nenhum dos atos por ela praticados na arrecadação, armazenamento e análise dos computadores apreendidos durante o inquérito, nem se preocupou em apresentar garantias de que seu conteúdo permaneceu íntegro enquanto esteve sob a custódia policial. Como consequência, não há como assegurar que os dados informáticos periciados são íntegros e idênticos aos que existiam nos computadores do réu.\n8. Pela quebra da cadeia de custódia, são inadmissíveis as provas extraídas dos computadores do acusado, bem como as provas delas derivadas, em aplicação analógica do art. 157, § 1º, do CPP.\n9. Agravo regimental parcialmente provido, para prover também em parte o recurso ordinário em habeas corpus e declarar a inadmissibilidade das provas em questão.","cit":"(AgRg no RHC n. 143.169/RJ, relator Ministro Messod Azulay Neto, relator para acórdão Ministro Ribeiro Dantas, Quinta Turma, julgado em 7/2/2023, DJe de 2/3/2023.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202100573956&dt_publicacao=02/03/2023","origem":"Linha do tempo do STJ sobre print e captura de tela","grupo":""},{"id":"j201976462","eixo":"e10","trib":"STJ","classe":"AgRg no HC 752.444/SC","registro":"2022/0197646-2","rel":"Ribeiro Dantas","conv":"","relac":"","orgao":"5ª T.","data":"04/10/2022","dje":"10/10/2022","ementa":"AGRAVO REGIMENTAL NO HABEAS CORPUS. EXTORSÃO. NULIDADE DA PROVA.\nPRINTS DE MENSAGENS PELO WHATSAPP. QUEBRA DA CADEIA DE CUSTÓDIA. NÃO VERIFICAÇÃO. AUSÊNCIA DE ADULTERAÇÃO DA PROVA OU DE ALTERAÇÃO DA ORDEM CRONOLÓGICA DAS CONVERSAS. AGRAVO REGIMENTAL DESPROVIDO.\n1. O instituto da quebra da cadeia de custódia diz respeito à idoneidade do caminho que deve ser percorrido pela prova até sua análise pelo magistrado, sendo certo que qualquer interferência durante o trâmite processual pode resultar na sua imprestabilidade.\nTem como objetivo garantir a todos os acusados o devido processo legal e os recursos a ele inerentes, como a ampla defesa, o contraditório e principalmente o direito à prova lícita.\n2. No presente caso, não foi verificada a ocorrência de quebra da cadeia de custódia, pois em nenhum momento foi demonstrado qualquer indício de adulteração da prova, ou de alteração da ordem cronológica da conversa de WhatsApp obtida através dos prints da tela do aparelho celular da vítima.\n3. In casu, o magistrado singular afastou a ocorrência de quaisquer elementos que comprovassem a alteração dos prints, entendendo que mantiveram \"uma sequência lógica temporal\", com continuidade da conversa, uma vez que \"uma mensagem que aparece na parte de baixo de uma tela, aparece também na parte superior da tela seguinte, indicando que, portanto, não são trechos desconexos\".\n4. O acusado, embora tenha alegado possuir contraprova, quando instado a apresentá-la, furtou-se de entregar o seu aparelho celular ou de exibir os prints que alegava terem sido adulterados, o que só reforça a legitimidade da prova.\n5. \"Não se verifica a alegada 'quebra da cadeia de custódia', pois nenhum elemento veio aos autos a demonstrar que houve adulteração da prova, alteração na ordem cronológica dos diálogos ou mesmo interferência de quem quer que seja, a ponto de invalidar a prova\".\n(HC 574.131/RS, Rel. Ministro Nefi Cordeiro, Sexta Turma, julgado em 25/8/2020, DJe 4/9/2020).\n6. As capturas de tela não foram os únicos elementos probatórios a respaldar a condenação, que foi calcada também em outros elementos de prova, como o próprio interrogatório do acusado, comprovantes de depósito, além das palavras da vítima.\n7. Se as instâncias ordinárias compreenderam que não foi constatado qualquer comprometimento da cadeia de custódia ou ofensa às determinações contidas no art. 158-A do CPP, o seu reconhecimento, neste momento processual, demandaria amplo revolvimento do conjunto fático-probatório, o que, como é sabido, não é possível na via do habeas corpus.\n7. Agravo regimental desprovido.","cit":"(AgRg no HC n. 752.444/SC, relator Ministro Ribeiro Dantas, Quinta Turma, julgado em 4/10/2022, DJe de 10/10/2022.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202201976462&dt_publicacao=10/10/2022","origem":"Linha do tempo do STJ sobre print e captura de tela","grupo":""},{"id":"j100831087","eixo":"e10","trib":"STJ","classe":"HC 653.515/RJ","registro":"2021/0083108-7","rel":"Rogerio Schietti Cruz","conv":"","relac":"","orgao":"6ª T.","data":"23/11/2021","dje":"01/02/2022","ementa":"HABEAS CORPUS. TRÁFICO DE DROGAS E ASSOCIAÇÃO PARA O NARCOTRÁFICO. QUEBRA DA CADEIA DE CUSTÓDIA DA PROVA. AUSÊNCIA DE LACRE. FRAGILIDADE DO MATERIAL PROBATÓRIO RESIDUAL. ABSOLVIÇÃO QUE SE MOSTRA DEVIDA. ASSOCIAÇÃO PARA O NARCOTRÁFICO. HIGIDEZ DA CONDENAÇÃO. ORDEM CONCEDIDA.\n1. A superveniência de sentença condenatória não tem o condão de prejudicar a análise da tese defensiva de que teria havido quebra da cadeia de custódia da prova, em razão de a substância entorpecente haver sido entregue para perícia sem o necessário lacre. Isso porque, ao contrário do que ocorre com a prisão preventiva, por exemplo - que tem natureza rebus sic standibus, isto é, que se caracteriza pelo dinamismo existente na situação de fato que justifica a medida constritiva, a qual deve submeter-se sempre a constante avaliação do magistrado -, o caso dos autos traz hipótese em que houve uma desconformidade entre o procedimento usado na coleta e no acondicionamento de determinadas substâncias supostamente apreendidas com o paciente e o modelo previsto no Código de Processo Penal, fenômeno processual, esse, produzido ainda na fase inquisitorial, que se tornou estático e não modificável e, mais do que isso, que subsidiou a própria comprovação da materialidade e da autoria delitivas.\n2. Segundo o disposto no art. 158-A do CPP, \"Considera-se cadeia de custódia o conjunto de todos os procedimentos utilizados para manter e documentar a história cronológica do vestígio coletado em locais ou em vítimas de crimes, para rastrear sua posse e manuseio a partir de seu reconhecimento até o descarte\".\n3. A autenticação de uma prova é um dos métodos que assegura ser o item apresentado aquilo que se afirma ele ser, denominado pela doutrina de princípio da mesmidade.\n4. De forma bastante sintética, pode-se afirmar que o art. 158-B do CPP detalha as diversas etapas de rastreamento do vestígio: reconhecimento, isolamento, fixação, coleta, acondicionamento, transporte, recebimento, processamento, armazenamento e descarte. O art. 158-C, por sua vez, estabelece o perito oficial como sujeito preferencial a realizar a coleta dos vestígios, bem como o lugar para onde devem ser encaminhados (central de custódia). Já o art. 158-D disciplina como os vestígios devem ser acondicionados, com a previsão de que todos os recipientes devem ser selados com lacres, com numeração individualizada, \"de forma a garantir a inviolabilidade e a idoneidade do vestígio\".\n5. Se é certo que, por um lado, o legislador trouxe, nos arts. 158-A a 158-F do CPP, determinações extremamente detalhadas de como se deve preservar a cadeia de custódia da prova, também é certo que, por outro, quedou-se silente em relação aos critérios objetivos para definir quando ocorre a quebra da cadeia de custódia e quais as consequências jurídicas, para o processo penal, dessa quebra ou do descumprimento de um desses dispositivos legais. No âmbito da doutrina, as soluções apresentadas são as mais diversas.\n6. Na hipótese dos autos, pelos depoimentos prestados pelos agentes estatais em juízo, não é possível identificar, com precisão, se as substâncias apreendidas realmente estavam com o paciente já desde o início e, no momento da chegada dos policiais, elas foram por ele dispensadas no chão, ou se as sacolas com as substâncias simplesmente estavam próximas a ele e poderiam eventualmente pertencer a outro traficante que estava no local dos fatos.\n7. Mostra-se mais adequada a posição que sustenta que as irregularidades constantes da cadeia de custódia devem ser sopesadas pelo magistrado com todos os elementos produzidos na instrução, a fim de aferir se a prova é confiável. Assim, à míngua de outras provas capazes de dar sustentação à acusação, deve a pretensão ser julgada improcedente, por insuficiência probatória, e o réu ser absolvido.\n9. O fato de a substância haver chegado para perícia em um saco de supermercado, fechado por nó e desprovido de lacre, fragiliza, na verdade, a própria pretensão acusatória, porquanto não permite identificar, com precisão, se a substância apreendida no local dos fatos foi a mesma apresentada para fins de realização de exame pericial e, por conseguinte, a mesma usada pelo Juiz sentenciante para lastrear o seu decreto condenatório. Não se garantiu a inviolabilidade e a idoneidade dos vestígios coletados (art. 158-D, § 1º, do CPP). A integralidade do lacre não é uma medida meramente protocolar; é, antes, a segurança de que o material não foi manipulado, adulterado ou substituído, tanto que somente o perito poderá realizar seu rompimento para análise, ou outra pessoa autorizada, quando houver motivos (art. 158-D, § 3º, do CPP).\n9. Não se agiu de forma criteriosa com o recolhimento dos elementos probatórios e com sua preservação; a cadeia de custódia do vestígio não foi implementada, o elo de acondicionamento foi rompido e a garantia de integridade e de autenticidade da prova foi, de certa forma, prejudicada. Mais do que isso, sopesados todos os elementos produzidos ao longo da instrução criminal, verifica-se a debilidade ou a fragilidade do material probatório residual, porque, além de o réu haver afirmado em juízo que nem sequer tinha conhecimento da substância entorpecente encontrada, ambos os policiais militares, ouvidos sob o crivo do contraditório e da ampla defesa, não foram uníssonos e claros o bastante em afirmar se a droga apreendida realmente estava em poder do paciente ou se a ele pertencia.\n10. Conforme deflui da sentença condenatória, não houve outras provas suficientes o bastante a formar o convencimento judicial sobre a autoria do crime de tráfico de drogas que foi imputado ao acusado. Não é por demais lembrar que a atividade probatória deve ser de qualidade tal a espancar quaisquer dúvidas sobre a existência do crime e a autoria responsável, o que não ocorreu no caso dos autos. Deveria a acusação, diante do descumprimento do disposto no art. 158-D, § 3º, do CPP, haver suprido as irregularidades por meio de outros elementos probatórios, de maneira que, ao não o fazer, não há como subsistir a condenação do paciente no tocante ao delito descrito no art. 33, caput, da Lei n. 11.343/2006.\n11. Em um modelo processual em que sobrelevam princípios e garantias voltadas à proteção do indivíduo contra eventuais abusos estatais que interfiram em sua liberdade, dúvidas relevantes hão de merecer solução favorável ao réu (favor rei).\n12. Não foi a simples inobservância do procedimento previsto no art. 158-D, § 1º, do CPP que induz a concluir pela absolvição do réu em relação ao crime de tráfico de drogas; foi a ausência de outras provas suficientes o bastante a formar o convencimento judicial sobre a autoria do delito a ele imputado. A questão relativa à quebra da cadeia de custódia da prova merece tratamento acurado, conforme o caso analisado em concreto, de maneira que, a depender das peculiaridades da hipótese analisada, pode haver diferentes desfechos processuais para os casos de descumprimento do assentado no referido dispositivo legal.\n13. Permanece hígida a condenação do paciente no tocante ao crime de associação para o tráfico de drogas (art. 35 da Lei n. 11.343/2006), porque, além de ele próprio haver admitido, em juízo, que atuava como olheiro do tráfico de drogas e, assim, confirmando que o local dos fatos era dominado pela facção criminosa denominada Comando Vermelho, esta Corte Superior de Justiça entende que, para a configuração do referido delito, é irrelevante a apreensão de drogas na posse direta do agente.\n14. Porque proclamada a absolvição do paciente em relação ao crime de tráfico de drogas, deve ser a ele assegurado o direito de aguardar no regime aberto o julgamento da apelação criminal. Isso porque era tecnicamente primário ao tempo do delito, possuidor de bons antecedentes, teve a pena-base estabelecida no mínimo legal e, em relação a esse ilícito, foi condenado à reprimenda de 3 anos de reclusão (fl. 173). Caso não haja recurso do Ministério Público contra a sentença condenatória (ou, se houver e ele for improvido) e a sanção permaneça nesse patamar, fica definitivo o regime inicial mais brando de cumprimento de pena.\n15. Ordem concedida, a fim de absolver o paciente em relação à prática do crime previsto no art. 33, caput, da Lei n. 11.343/2006, objeto do Processo n. 0219295-36.2020.8.19.0001. Ainda, fica assegurado ao réu o direito de aguardar no regime aberto o julgamento do recurso de apelação.","cit":"(HC n. 653.515/RJ, relator Ministro Rogerio Schietti Cruz, Sexta Turma, julgado em 23/11/2021, DJe de 1/2/2022.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202100831087&dt_publicacao=01/02/2022","origem":"Linha do tempo do STJ sobre print e captura de tela","grupo":""},{"id":"j002175828","eixo":"e10","trib":"STJ","classe":"AgRg no RHC 133.430/PE","registro":"2020/0217582-8","rel":"Nefi Cordeiro","conv":"","relac":"","orgao":"6ª T.","data":"23/02/2021","dje":"26/02/2021","ementa":"AGRAVO REGIMENTAL NO RECURSO EM HABEAS CORPUS. CORRUPÇÃO ATIVA E PASSIVA. NOTÍCIA ANÔNIMA DO CRIME APRESENTADA JUNTO COM A CAPTURA DA TELA DAS CONVERSAS DO WHATSAPP. INTERLOCUTOR INTEGRANTE DO GRUPO DE CONVERSAS DO APLICATIVO. POSSIBILIDADE DE PROMOÇÃO DE DILIGÊNCIAS PELO PODER PÚBLICO. ESPELHAMENTO, VIA WHATSAPP WEB, DAS CONVERSAS REALIZADAS PELO INVESTIGADO COM TERCEIROS. NULIDADE VERIFICADA. DEMAIS PROVAS VÁLIDAS. AGRAVO REGIMENTAL PARCIALMENTE PROVIDO.\n1. Não há ilegalidade no inquérito policial, pois, após a notícia anônima do crime, foi adotado um procedimento preliminar para apurar indícios de conduta delitiva, antes de serem adotadas medidas mais drásticas, como a quebra do sigilo telefônico, sendo que as delações anônimas não foram os únicos elementos utilizados para a instauração do procedimento investigatório, conforme a transcrição do Relatório Técnico, datado de 30/12/2015, no acórdão proferido no RHC 79.848.\nAdemais, de acordo com as informações prestadas pelo Juízo de Direito da Vara Criminal da Comarca de Ipojuca/PE nos autos do RHC 79.848, \"No IPL há a denúncia por escrito e assinada com a qualificação dos denunciantes, assim não há que se falar em que somente houve denúncia anônima para a instauração de um IPL\" (fl. 736 do RHC 79.848).\n2. Consta dos autos que os prints das conversas do WhatsApp teriam sido efetivados por um dos integrantes do grupo de conversas do aplicativo, isto é, seria um dos próprios interlocutores, haja vista que ainda consta no acórdão do Tribunal de origem que, \"como bem pontuado pela douta Procuradoria de Justiça que '(...) a tese da defesa de que a prova é ilícita se contrapõe a tese da acusação de que as conversas foram vazadas por um dos próprios interlocutores devendo ser objeto de prova no decorrer da instrução processual'\".\n3. Esta Sexta Turma entende que é invalida a prova obtida pelo WhatsApp Web, pois \"é possível, com total liberdade, o envio de novas mensagens e a exclusão de mensagens antigas (registradas antes do emparelhamento) ou recentes (registradas após), tenham elas sido enviadas pelo usuário, tenham elas sido recebidas de alg
