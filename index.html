<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><meta name="claude:viewport-fit-sides" content="cover">
<title>Painel de Ementas Prova Digital</title>
<style id="css">:root{
  --font-sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-display:"Palatino Linotype","Book Antiqua",Palatino,"URW Palladio L",Georgia,serif;
  --font-body:"Libre Caslon Text",Georgia,"Times New Roman",serif;
  --bg:#ffffff; --bg-alt:#f8f9fa; --bg-muted:#f1f3f5;
  --text:#1a1a2e; --text-2:#4a5568; --text-3:#6b7280;
  --border:#e2e8f0; --rule:#e7e1d4;
  --gold:#d4a853; --gold-deep:#8a6508; --graphite:#5a5a5a; --danger:#9b2c2c;
  --radius:.5rem; --radius-lg:.75rem;
  --focus:0 0 0 2px rgba(212,160,23,.25);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#14141f; --bg-alt:#1a1a2e; --bg-muted:#222238;
  --text:#f1f3f5; --text-2:#cbd5e0; --text-3:#9aa5b5;
  --border:#2d2d44; --rule:#2d2d44; --gold-deep:#e5c47a; --graphite:#b8b8b8; --danger:#f0a0a0;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font-sans);line-height:1.55;-webkit-font-smoothing:antialiased;font-size:15px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--gold-deep)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:none;box-shadow:var(--focus)}

.brandbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:2px solid var(--gold)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
.brandbar .wrap{display:flex;align-items:center;gap:.8rem;padding-block:.55rem;flex-wrap:wrap}
.brandbar img{height:48px;width:auto;max-width:160px;display:block}
:root[data-theme="dark"] .brandbar img{filter:brightness(0) invert(1)}
.brandbar .sp{flex:1}
.btn{font-size:.82rem;font-weight:600;padding:.4rem .85rem;border:1px solid var(--border);border-radius:999px;background:var(--bg);color:var(--text-2)}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.page-head{padding-block:1.6rem 1rem}
.kicker{font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;color:var(--gold-deep);font-weight:600}
h1{font-family:var(--font-display);font-size:clamp(1.7rem,4vw,2.3rem);line-height:1.15;margin:.35rem 0 .7rem;text-wrap:balance}
.lead{font-family:var(--font-body);font-size:1.05rem;color:var(--text-2);text-align:justify;margin:0}
.fonte{font-size:.84rem;color:var(--text-3);margin:.7rem 0 0;text-align:justify}

.tabs{display:flex;gap:1.3rem;border-bottom:1px solid var(--border);overflow-x:auto;margin-top:.6rem}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:.65rem .1rem;font-weight:600;font-size:.92rem;color:var(--text-2);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--gold)}
.panel{padding-block:1.4rem 2.5rem}
h2.sec{font-family:var(--font-display);font-size:1.45rem;margin:0 0 .8rem}
.prose{font-family:var(--font-body);font-size:1rem;text-align:justify}
.prose h3{font-family:var(--font-display);font-size:1.15rem;margin:1.5rem 0 .4rem;text-align:left}
.prose p{margin:.5rem 0}

.head-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:2rem;align-items:start}
.stats-box{border:1px solid var(--border);border-radius:var(--radius-lg);padding:.9rem 1.1rem;background:var(--bg-alt)}
.stats-box h2{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text-3);margin:0 0 .5rem;font-weight:700}
.stats-box dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.7rem .8rem;margin:0}
.stats-box dt{font-size:.7rem;color:var(--text-3);order:2;line-height:1.25}
.stats-box dd{margin:0;font-family:var(--font-display);font-weight:700;font-size:1.45rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stats-box div{display:flex;flex-direction:column;min-width:0}
.stats-box .wide{grid-column:1/-1}.stats-box .wide dd{font-size:1.05rem}
.prose.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:.4rem 2.5rem}
.prose.cols h3{margin-top:.8rem}
#gloss{column-width:430px;column-gap:2.5rem}
body.editing #gloss{column-width:auto}
.disp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:.8rem 1.2rem;align-items:start}
.disp{border:1px solid var(--border);border-radius:var(--radius-lg);padding:.8rem 1rem;min-width:0}
.disp-h{display:flex;gap:.6rem;align-items:baseline;flex-wrap:wrap}
.disp-h b{font-family:var(--font-display);font-size:1.02rem}
.disp-h .n{font-size:.76rem;color:var(--text-3);margin-left:auto}
.disp details{margin:.4rem 0}
.disp details>summary{cursor:pointer;font-weight:600;font-size:.84rem;color:var(--gold-deep)}
.norma{font-family:var(--font-body);font-size:.95rem;line-height:1.65;background:var(--bg-alt);border-left:3px solid var(--gold);border-radius:var(--radius);padding:.8rem 1rem;margin:.5rem 0;white-space:pre-wrap;text-align:justify;overflow-wrap:anywhere}
.dest{border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1.2rem}
.dest h3{font-family:var(--font-display);font-size:1.25rem;margin:0 0 .2rem}
.dest .prov{font-size:.8rem;color:var(--text-3);margin:0 0 .4rem}
.dest .norma{column-width:460px;column-gap:2.2rem}
/* Sumário */
.sumario{border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1.2rem;margin-bottom:1.4rem;background:var(--bg-alt)}
.sumario h2{font-family:var(--font-display);font-size:1.2rem;margin:0 0 .6rem}
.sumario ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:.15rem 1.4rem}
.sumario li{min-width:0}
.sum-link{display:flex;gap:.55rem;align-items:baseline;width:100%;text-align:left;background:none;border:none;padding:.32rem 0;border-bottom:1px solid var(--border)}
.sum-link:hover .sum-t{color:var(--gold-deep)}
.sum-n{font-family:var(--font-display);font-weight:700;min-width:1.6rem;color:var(--text)}
.sum-t{flex:1;font-weight:600;font-size:.92rem;min-width:0}
.sum-c{font-size:.78rem;color:var(--text-3);white-space:nowrap}
.sum-sub{list-style:none;margin:0 0 .2rem 2.15rem;padding:0;display:block}
.sum-sub .sum-link{border-bottom:none;padding:.12rem 0}
.sum-sub .sum-t{font-weight:500;font-size:.85rem;color:var(--text-2)}

.toolbar{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:.6rem}
.toolbar input[type=search]{flex:1;min-width:200px;padding:.6rem .9rem;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--bg-alt)}
.count{font-size:.8rem;color:var(--text-3);white-space:nowrap}

/* Eixos: hierarquia acima do corpo dos cartões */
.eixo-head{margin:2.6rem 0 1rem;padding-top:1.3rem;border-top:2px solid var(--text);scroll-margin-top:90px}
.eixo-num{font-family:var(--font-sans);font-size:.95rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-deep)}
.eixo-head h2{font-family:var(--font-display);font-size:clamp(1.6rem,3.6vw,2.05rem);line-height:1.15;margin:.15rem 0 .3rem;text-wrap:balance}
.eixo-desc{font-family:var(--font-body);font-size:.98rem;color:var(--text-2);margin:0;text-align:justify}
.sub-head{font-family:var(--font-display);font-size:1.3rem;margin:1.8rem 0 .7rem;padding-bottom:.3rem;border-bottom:1px solid var(--rule);scroll-margin-top:90px}
.sub-head span{font-family:var(--font-sans);font-size:.8rem;font-weight:500;color:var(--text-3);margin-left:.5rem}

.card{border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--bg);padding:1rem 1.2rem;margin-bottom:.9rem;scroll-margin-top:90px}
.card.flash{box-shadow:0 0 0 3px var(--gold)}
.card-top{display:flex;gap:.7rem;align-items:flex-start}
.num{flex:none;min-width:2rem;height:2rem;padding:0 .4rem;border-radius:999px;border:1px solid var(--border);background:var(--bg-alt);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}
.cit{font-family:var(--font-display);font-weight:700;font-size:1.02rem;line-height:1.35;margin:.15rem 0 0;min-width:0;overflow-wrap:anywhere}
.meta{font-size:.8rem;color:var(--text-3);margin:.35rem 0 .5rem}
.verbete{font-family:var(--font-body);font-size:.93rem;color:var(--text);text-align:justify;margin:.3rem 0 .6rem;overflow-wrap:anywhere}
details.em{border-top:1px dashed var(--border);padding-top:.5rem}
details.em>summary{cursor:pointer;font-weight:600;font-size:.86rem;color:var(--gold-deep);list-style-position:inside}
.ementa{font-family:var(--font-body);font-size:.96rem;line-height:1.7;background:var(--bg-alt);border-left:3px solid var(--gold);border-radius:var(--radius);padding:.8rem 1rem;margin:.6rem 0 .4rem;white-space:pre-wrap;text-align:justify;overflow-wrap:anywhere}
.cit-par{font-size:.85rem;color:var(--text-2);margin:.3rem 0;overflow-wrap:anywhere}
.acts{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem;align-items:center}
.acts .btn{font-size:.76rem;padding:.28rem .7rem}
.acts a.btn{text-decoration:none}
.vazio{color:var(--text-3);font-style:italic}

/* Edição */
.editbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:25;background:var(--bg-muted);border:1px solid var(--border);border-radius:var(--radius-lg);padding:.6rem .9rem;display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem}
.editbar .msg{font-size:.82rem;color:var(--text-2);flex:1;min-width:160px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.5rem .7rem;margin:.5rem 0}
.form label{display:flex;flex-direction:column;gap:.15rem;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);min-width:0}
.form .full{grid-column:1/-1}
.form input,.form select,.form textarea{padding:.4rem .55rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);font-size:.9rem;width:100%;text-transform:none;letter-spacing:0;color:var(--text)}
.form textarea{font-family:var(--font-body);line-height:1.6;resize:vertical;min-height:5rem}
.form textarea.big{min-height:18rem}

/* Glossário e base legal */
.gl{border-bottom:1px solid var(--border);padding:.75rem 0;text-align:justify;break-inside:avoid}
.gl b{font-family:var(--font-display);font-size:1.02rem}
.gl span{font-family:var(--font-body);font-size:.96rem}
.tbl-wrap{overflow-x:auto}
table.tbl{border-collapse:collapse;width:100%;font-size:.88rem}
.tbl th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);padding:.5rem .6rem;border-bottom:2px solid var(--text)}
.tbl td{padding:.5rem .6rem;border-bottom:1px solid var(--border);vertical-align:top}
.tbl td:first-child{font-weight:600;white-space:nowrap}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:1.7rem;font-size:.74rem;border:1px solid var(--border);border-radius:999px;padding:.08rem .45rem;margin:.1rem .12rem;background:var(--bg);color:var(--text-2)}
.chip:hover{border-color:var(--gold)}

/* Grafo: layout da ferramenta REDE */
.rede{display:grid;grid-template-columns:250px minmax(0,1fr);gap:1rem;align-items:start}
.rede-side{display:flex;flex-direction:column;gap:.9rem;min-width:0}
.rede-box{border:1px solid var(--border);border-radius:var(--radius-lg);padding:.7rem .8rem;background:var(--bg)}
.rede-box h3{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);margin:0 0 .5rem;font-weight:700}
.filter-item{display:flex;align-items:center;gap:.45rem;font-size:.82rem;padding:.2rem .25rem;border-radius:6px;cursor:pointer;user-select:none}
.filter-item:hover{background:var(--bg-alt)}
.filter-item.off{opacity:.38;text-decoration:line-through}
.swatch{width:11px;height:11px;border-radius:50%;flex:none}
.swatch.line{height:3px;border-radius:2px;width:16px}
.filter-item .n{margin-left:auto;font-size:.72rem;color:var(--text-3)}
.rede-box select,.rede-box input{width:100%;padding:.4rem .5rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);font-size:.82rem;margin-bottom:.4rem}
#path-result{font-size:.8rem;color:var(--text-2);margin-top:.4rem;overflow-wrap:anywhere}
.rede-main{position:relative;min-width:0}
.canvas-wrap{position:relative;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--bg);overflow:hidden;height:min(72vh,680px);min-height:420px}
#graph{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.zoom{position:absolute;left:.6rem;bottom:.6rem;display:flex;gap:.3rem}
.zoom .btn{padding:.25rem .6rem;border-radius:var(--radius)}
.stats{position:absolute;left:.7rem;top:.6rem;font-size:.75rem;color:var(--text-3);background:var(--bg);padding:.1rem .4rem;border-radius:6px}
.ecard{position:absolute;right:.6rem;top:.6rem;width:min(330px,calc(100% - 1.2rem));max-height:calc(100% - 1.2rem);overflow:auto;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:.8rem .9rem;box-shadow:0 4px 14px rgba(0,0,0,.12);font-size:.85rem}
.ecard h2{font-family:var(--font-display);font-size:1.05rem;margin:.4rem 1.4rem .3rem 0;line-height:1.3;overflow-wrap:anywhere}
.ec-close{position:absolute;right:.5rem;top:.4rem;border:none;background:none;font-size:1.2rem;color:var(--text-3)}
.ec-type{display:inline-block;color:#fff;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:.12rem .5rem;border-radius:999px}
.ec-sum{font-family:var(--font-body);font-size:.84rem;color:var(--text-2);margin:.3rem 0;text-align:justify}
.ec-lbl{font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3);font-weight:700;margin:.7rem 0 .25rem}
.ec-conns{list-style:none;margin:0;padding:0}
.ec-conns li{display:flex;gap:.4rem;align-items:baseline;padding:.22rem .2rem;border-radius:6px;cursor:pointer}
.ec-conns li:hover{background:var(--bg-alt)}
.ec-dot{width:8px;height:8px;border-radius:50%;flex:none;transform:translateY(-1px)}
.ec-rot{color:var(--text-3);font-size:.76rem}
.hubs{margin-top:1rem}

footer{border-top:1px solid var(--border);padding-block:1rem 2rem;font-size:.78rem;color:var(--text-3)}
footer img{height:28px;width:auto;max-width:62px;display:block;margin-bottom:.4rem}
:root[data-theme="dark"] footer img{filter:brightness(0) invert(1)}
@media(max-width:820px){.rede{grid-template-columns:1fr}.rede-side{order:2}.head-grid{grid-template-columns:1fr;gap:1rem}}
.disp-grid,.prose.cols{min-width:0}
@media(max-width:520px){.disp-grid,.prose.cols{grid-template-columns:1fr}#gloss{column-width:auto}.dest .norma{column-width:auto}.brandbar img{height:40px}.card{padding:.85rem .9rem}.sumario ol{grid-template-columns:1fr}}
</style>

  <section class="panel" id="p-grafo" role="tabpanel" hidden>
    <h2 class="sec">Grafo de Entidades</h2>
    <p class="prose">Rede formada pelos julgados e pelas entidades nomeadas nas ementas: relator, órgão julgador, eixo, dispositivo, precedente citado e conceito técnico. O tamanho do nó acompanha o número de vínculos. Arraste um nó para reposicionar, arraste o fundo para deslocar e use a rolagem para ampliar. O clique em um nó abre a ficha com os vínculos navegáveis.</p>
    <div class="rede">
      <aside class="rede-side">
        <div class="rede-box"><h3>Busca</h3><input type="search" id="g-q" placeholder="Nome da entidade" aria-label="Buscar no grafo"></div>

  <section class="panel" id="p-base-legal" role="tabpanel" hidden>
    <h2 class="sec">Base Legal</h2>
    <div id="base-dest"></div>
    <h2 class="sec" style="margin-top:2rem;font-size:1.2rem">Dispositivos e Súmulas Citados nas Ementas</h2>
    <p class="prose">Cada dispositivo traz a fonte oficial, a transcrição literal e os julgados que o mencionam. O número remete ao item na aba Ementas.</p>
    <div id="base-auto" class="disp-grid"></div>
    <h2 class="sec" style="margin-top:2rem;font-size:1.2rem">Normas Técnicas e Procedimentos Operacionais</h2>
    <div id="base-man"></div>
  </section>

  <section class="panel" id="p-instrucoes" role="tabpanel" hidden>
    <h2 class="sec">Instruções de Uso</h2>
    <div class="prose cols">
      <div><h3>Ementas</h3><p>O Sumário dos Eixos abre a aba e leva a cada grupo de julgados. Cada item mostra a citação [tribunal, classe e número, relator, órgão julgador e data] e a verbetação. O comando "Ementa completa" abre a transcrição literal, entre aspas, seguida da referência do julgado e do link de inteiro teor. O botão "Copiar" leva a ementa e a referência para a área de transferência.</p></div>
      <div><h3>Busca</h3><p>O campo de busca filtra os itens pelo texto da citação e da ementa. O Sumário permanece disponível durante a busca.</p></div>
      <div><h3>Grafo</h3><p>O grafo liga cada julgado ao relator, ao órgão julgador, ao eixo, aos dispositivos, aos precedentes citados e aos conceitos técnicos que a ementa menciona. Os filtros ligam e desligam tipos de entidade e naturezas de vínculo. A camada restringe a rede a um eixo. O caminho entre entidades destaca a ligação mais curta entre dois nós. Na ficha de um julgado, o botão "Abrir Ementa" leva ao item correspondente.</p></div>
      <div><h3>Edição Direta</h3><p>O botão "Editar Painel" aparece para quem tem permissão de edição do artefato. No modo de edição, cada julgado, eixo e termo do glossário vira formulário. "Salvar Alterações" grava uma nova versão do painel para todos os leitores. "Descartar" restaura a versão publicada.</p></div>
    </div>
  </section>

<script id="state" type="application/json">{"meta":{"titulo":"Painel de Ementas sobre Prova Digital","kicker":"Prova Digital no Processo Penal","lead":"Julgados do Supremo Tribunal Federal e do Superior Tribunal de Justiça sobre prova digital e cadeia de custódia, organizados por eixo temático, para uso de qualquer agente processual [investigador, acusador, defensor ou julgador]. Cada item traz a citação, a verbetação e a ementa completa em transcrição literal.","fonte":"Textos obtidos em pesquisas no Jurisconsulto sobre prova digital, quebra da cadeia de custódia e captura de tela. O link de inteiro teor de cada item remete ao portal do tribunal."},"eixos":[{"id":"e1","titulo":"Acesso ao Dispositivo","desc":"Licitude do acesso aos dados armazenados no aparelho e exigência de autorização judicial."},{"id":"e2","titulo":"Insuficiência Documental da Extração","desc":"Extração sem laudo, sem hash ou sem registro do percurso do vestígio; prints sem arquivo de origem."},{"id":"e3","titulo":"Nulidade Não Automática","desc":"Exigência de demonstração concreta de adulteração ou de prejuízo para o reconhecimento da quebra."},{"id":"e4","titulo":"Retroatividade do Regime de Custódia","desc":"Aplicação das exigências de preservação a fatos anteriores à Lei 13.964/2019."},{"id":"e5","titulo":"Comprometimento Material do Vestígio","desc":"Arquivos corrompidos, bloqueio por senha superveniente, ausência de lacre e irrepetibilidade da perícia."},{"id":"e6","titulo":"Dúvida em Sede Cautelar","desc":"Efeito da dúvida sobre a integridade da prova digital na prisão preventiva."},{"id":"e7","titulo":"Metodologia Certificada","desc":"Perícia com ABNT NBR ISO/IEC 27037 e 27042 e algoritmo hash."},{"id":"e8","titulo":"Acesso da Defesa à Cópia Forense","desc":"Entrega da extração integral e da documentação técnica à defesa."},{"id":"e9","titulo":"Via Processual Adequada","desc":"Limite cognitivo do habeas corpus e remessa do exame técnico à instrução."},{"id":"e10","titulo":"Prints e Capturas de Tela","desc":"Capturas de tela e mensagens eletrônicas como prova: autenticidade, integridade, espelhamento e valoração com a prova oral."},{"id":"e11","titulo":"Quebra da Cadeia de Custódia","desc":"Julgados das pesquisas específicas sobre quebra da cadeia de custódia da prova digital, agrupados pela tese central da ementa."}],"julgados":[{"id":"jRJ—STF","eixo":"e1","trib":"STF","classe":"ARE 1042075/RJ","registro":"","rel":"Dias Toffoli","conv":"","relac":"","orgao":"Tribunal Pleno","data":"25/06/2025","dje":"24/09/2025","ementa":"Recurso extraordinário com agravo. Julgamento sob a sistemática da repercussão geral. Constitucional. Processual penal. Aparelho celular encontrado fortuitamente no local do crime. Acesso à agenda telefônica, aos registros de chamadas e às fotografias arquivadas no aparelho sem prévia autorização judicial. Condenação em primeira instância. Acórdão recorrido em que se reconheceu a ilicitude da prova. Violação do sigilo das comunicações (CF, art. 5º, inciso XII). Aplicação da teoria dos frutos da árvore envenenada. Absolvição do recorrido por insuficiência de provas. Alteração considerável do contexto fático e normativo. Transformação tecnológica. Superveniência do MCI, da LGPD e da EC nº 115, de 2022. Direito à proteção dos dados pessoais nos meios digitais. Autodeterminação informacional. Proteção jurídica especial e autônoma. Direitos fundamentais à vida privada e à intimidade. Superação do entendimento firmado no HC nº 91.867/PA. Necessidade de consentimento ou de prévia autorização judicial para acesso aos dados contidos no aparelho celular apreendido em prisão em flagrante. Contemporização desse entendimento nas situações de encontro fortuito do aparelho no local do crime. Identificação do autor do fato ou do proprietário do aparelho celular. Licitude da prova. Restabelecimento da condenação. Possibilidade de preservação cautelar dos dados. Recurso provido.\n\nI. Caso em exame\n\n1. No caso dos autos, o aparelho celular foi encontrado fortuitamente no local dos fatos e apreendido pela autoridade policial (CPP, art. 6º, inciso II). A identificação do autor do delito decorreu do exame da agenda telefônica, dos registros de chamadas e de fotografias constantes do aparelho celular pelos agentes policiais, sem consentimento de quem de direito ou prévia autorização judicial, o qual permitiu a coleta de evidências que nortearam a realização de diligências que culminaram na identificação e na prisão do autor do fato (flagrante impróprio) e em sua posterior condenação, em primeira instância, pelo crime de roubo.\n\nII. Questão em discussão\n\n2. A controvérsia constitucional posta nos autos consiste em saber se a autoridade policial pode acessar, sem prévia autorização judicial, os dados armazenados em aparelho celular encontrado fortuitamente no local do crime e apreendido nos termos do art. 6º, inciso II, do CPP.\n\nIII. Razões de decidir\n\n3. Os smartphones já eram realidade no país em 2013. Tais aparelhos multifuncionais, além de servirem de instrumento para os serviços ordinários de telefonia móvel, permitem a produção, o armazenamento, a transmissão e a reprodução de arquivos dos mais diversos formatos (textos, imagens, áudios e vídeos) e – mais que isso – viabilizam o acesso amplo e irrestrito à internet e, por conseguinte, às redes sociais, aos provedores de e-mail, às plataformas bancárias e de e-commerce, a uma miríade de sites e blogs e aos inúmeros aplicativos de mensagens instantâneas, inclusive gratuitamente. Graças aos smartphones, “o mundo passou a caber na palma da mão”. Mas, à medida que isso acontecia, as informações pessoais também se concentraram nos aparelhos celulares. Hoje, as múltiplas funcionalidades dos aparelhos celulares geram dados e metadados que são registrados na memória física do aparelho, ou “em nuvem”, e podem ser facilmente acessados, rastreados e/ou recuperados.\n\n4. Examinados em conjunto, dados e metadados revelam um espectro enorme de dados pessoais, o que torna possível uma investigação completa e – diga-se de passagem – muito eficiente acerca das preferências pessoais, das relações familiares e interpessoais, dos hábitos de vida, de trabalho e de consumo e, em última análise, da forma de pensar, de agir e de decidir de determinado indivíduo. Isso sem falar, obviamente, das facilidades que o acesso proporciona para a intrusão indevida e “para o futuro”, a partir da instalação de softwares “espiões”.\n\n5. A possibilidade de se acessar, por meio de aparelhos celulares, bem mais que metadados relativos à comunicação telefônica desloca a discussão travada nos autos para a questão da inviolabilidade da intimidade, da vida privada, da honra e da imagem (CF/88, art. 5º, inciso X), do direito à proteção dos dados pessoais, inclusive nos meios digitais (CF/88, art. 5º, inciso LXXIX, introduzido pela Emenda Constitucional nº 115, de 2022), e do direito à autodeterminação informacional, os quais conferem proteção jurídica especial e diferenciada aos dados pessoais armazenados e justificam a superação do entendimento firmado no HC nº 91.867/PA para se construir uma solução mais condizente com a nova realidade.\n\n6. Após revisitar os precedentes sobre a matéria, verifica-se que a jurisprudência do Supremo Tribunal Federal acabou encampando, ao menos em parte, o texto seminal do Professor Tércio Sampaio Ferraz Júnior, para quem, “[o] sigilo, no inciso XII do art. 5º, está referido à comunicação, no interesse da defesa da privacidade”. Isso não significa, contudo, que o texto constitucional asseguraria proteção jurídica apenas e tão somente à “comunicação de dados”, isto é, ao “fluxo comunicacional”, ou aos “dados em trânsito”. Como lembrou Ferraz Júnior, os “dados estáticos”, ou seja, os “dados armazenados” também são passíveis de proteção jurídica e, embora não se revistam sempre e incondicionalmente de caráter sigiloso, podem alcançar tal qualidade a depender das circunstâncias, encontrando guarida, por exemplo, no disposto no art. 5º, inciso X, do texto constitucional.\n\n7. A Emenda Constitucional nº 115, de 2022, ao introduzir no art. 5º da Constituição o inciso LXXIX, segundo o qual “é assegurado, nos termos da lei, o direito à proteção dos dados pessoais, inclusive nos meios digitais” e, antes dela, as Leis nº 12.695/14 e nº 13.709/18, que instituíram no ordenamento jurídico brasileiro, respectivamente, o Marco Civil da Internet e a Lei Geral de Proteção de Dados, passaram a conferir proteção jurídica especial e autônoma aos dados pessoais. Assim, enquanto o primeiro diploma legal elevou ao patamar de direito dos usuários de internet a inviolabilidade e o sigilo de suas comunicações privadas armazenadas e o não fornecimento de seus dados pessoais, a segunda lei alçou a proteção jurídica dos dados pessoais a uma categoria autônoma com relação aos direitos à privacidade e à intimidade (CF, art. 5º, inciso X).\n\n8. Não se pode olvidar, ainda, que o direito à privacidade, apesar de relativamente recente, passou – e ainda passa – por considerável ressignificação. É dizer, no contexto da sociedade atual, a possibilidade de o indivíduo proceder ao controle dos dados que dizem respeito à própria pessoa – porque eles consistem em manifestação de sua personalidade – é conditio sine qua non para a preservação de sua personalidade e para o desenvolvimento pleno de sua autonomia. Isso porque é o direito à privacidade que assegura a cada indivíduo um espaço próprio de experimentação, no qual é possível a cada qual expressar “sentimentos, reflexões, visões de mundo e experiências pessoais sem medo de estar sendo observado por órgãos estatais” (GRECO, Luís; GLEIZER, Orlandino. A infiltração online no processo penal – Notícia sobre a experiência alemã. Revista Brasileira de Direito Processual Penal. Porto Alegre, v. 5, n. 3, set./dez. 2019, p. 1495).\n\nIV. Dispositivo e tese\n\n9. Recurso extraordinário com agravo ao qual se dá provimento para se reconhecer a licitude da prova e se restabelecer a sentença condenatória proferida em primeiro grau de jurisdição, fixando-se a seguinte tese de repercussão geral: “1. A mera apreensão de aparelho celular, nos termos do art. 6º do CPP ou em flagrante delito, não está sujeita à reserva de jurisdição. Contudo, o acesso aos dados nele contidos deve observar as seguintes condicionantes: 1.1 Nas hipóteses de encontro fortuito de aparelho celular, o acesso aos respectivos dados para o fim exclusivo de se esclarecer a autoria do fato supostamente criminoso, ou quem seja o proprietário do aparelho, não depende de consentimento ou de prévia decisão judicial, desde que justificada posteriormente a adoção da medida. 1.2 No caso de aparelho celular apreendido por ocasião de prisão em flagrante, o acesso aos respectivos dados está condicionado ao consentimento expresso e livre do titular dos dados ou de prévia decisão judicial (cf. art. 7º, inciso III, e art. 10, § 2º, da Lei nº 12.965/14) que justifique, com base em elementos concretos, a proporcionalidade da medida e delimite sua abrangência à luz dos direitos fundamentais à intimidade, à privacidade, à proteção dos dados pessoais e à autodeterminação informacional, inclusive nos meios digitais (art. 5º, incisos X e LXXIX, da CRFB/88). Nesses casos, a celeridade se impõe, devendo a autoridade policial atuar com a maior rapidez e eficiência possível e o Poder Judiciário conferir tramitação e apreciação prioritárias aos pedidos dessa natureza, inclusive em regime de plantão. 2. A autoridade policial poderá adotar as providências necessárias para a preservação dos dados e metadados contidos no aparelho celular apreendido antes da autorização judicial, justificando posteriormente a adoção da medida. 3. As teses acima enunciadas só produzirão efeitos prospectivos, ressalvados os pedidos eventualmente formulados pelas defesas até a data do encerramento do presente julgamento\".","cit":"(ARE 1042075/RJ, Relator(a): DIAS TOFFOLI, Tribunal Pleno, julgado em 25/06/2025, DJe de 24/09/2025)","link":"https://portal.stf.jus.br/jurisprudencia/obterInteiroTeor.asp?idDocumento=790808052","origem":"Pesquisa \"prova digital\" [posição 1]","grupo":""},{"id":"j504948225","eixo":"e2","trib":"STJ","classe":"AREsp 3.132.918/RS","registro":"2025/0494822-5","rel":"Ribeiro Dantas","conv":"","relac":"","orgao":"5ª T.","data":"09/06/2026","dje":"15/06/2026","ementa":"DIREITO PROCESSUAL PENAL. AGRAVO EM RECURSO ESPECIAL. PROVA DIGITAL. PRINTS DE MENSAGENS. CADEIA DE CUSTÓDIA. VÍDEOS. NULIDADE DA SENTENÇA CONDENATÓRIA. AGRAVO CONHECIDO E RECURSO ESPECIAL PARCIALMENTE PROVIDO.\nI. CASO EM EXAME\n1. Agravo interposto pela Defesa contra decisão que inadmitiu recurso especial fundado na alínea \"a\" do art. 105, III, da Constituição Federal, manejado em ação penal na qual o Recorrente foi condenado com base, em especial, em prova digital consistente em capturas de tela de supostas conversas, notificações de caixa postal e vídeos produzidos extrajudicialmente pela noticiante e juntados ao inquérito policial.\n2. O recurso especial aponta violação aos arts. 155, 157, 158-A a 158-F e 315, § 2º, II e IV, do Código de Processo Penal, sob o argumento de (i) ausência de observância da cadeia de custódia na produção e juntada da prova digital; e (ii) deficiência de fundamentação do acórdão estadual, inclusive por utilização de fundamentação per relationem imprópria ao manter a condenação.\nII. QUESTÃO EM DISCUSSÃO\n3. Há duas questões em discussão: (i) saber se provas digitais consistentes em prints de mensagens, notificações de caixa postal e vídeos, produzidas extrajudicialmente pela vítima e juntadas diretamente ao inquérito policial, sem observância formal da cadeia de custódia prevista nos arts. 158-A a 158-F do Código de Processo Penal, são aptas a fundamentar a condenação; e (ii) saber se o acórdão recorrido padece de nulidade por deficiência de fundamentação, inclusive por uso impróprio de fundamentação per relationem ao valorar a prova oral e manter o édito condenatório.\nIII. RAZÕES DE DECIDIR\n4. Os prints de mensagens não se mostram admissíveis como prova penal, pois não há notícia do arquivo digital de onde foram extraídas as conversas juntadas aos autos, o que impede a verificação da cadeia de custódia e da mesmidade entre o material colhido e o conteúdo apresentado, comprometendo de forma irremediável a confiabilidade e a integridade da prova digital.\n5. Não sendo possível verificar a autenticidade do conteúdo digital, os prints de mensagens se revelam inutilizáveis, devendo ser desentranhados dos autos e afastados do acervo probatório, impondo-se a anulação da sentença condenatória para que seja proferida nova decisão com base exclusivamente no conjunto probatório remanescente.\n6. Quanto aos vídeos, a disciplina da cadeia de custódia prevista no art. 158-A do Código de Processo Penal deve ser interpretada à luz do princípio da instrumentalidade das formas, de modo que eventuais irregularidades formais no procedimento apenas assumem relevância jurídica quando demonstrado efetivo risco à autenticidade, integridade ou credibilidade da prova, o que não foi evidenciado no caso concreto.\n7. O material digital referente aos vídeos foi devidamente juntado e disponibilizado nos autos, permanecendo acessível às partes para análise e eventual impugnação, preservando-se o acesso integral ao conteúdo; não havendo demonstração de manipulação ou risco a sua credibilidade, não se reconhece irregularidade na sua utilização probatória.\n8. Declarada a inadmissibilidade dos prints de mensagens e anulada a sentença para novo julgamento com base nas provas remanescentes, ficam prejudicadas as demais teses defensivas.\nIV. DISPOSITIVO E TESE\n9. Resultado do Julgamento: Agravo conhecido e recurso especial parcialmente provido para declarar inadmissíveis os prints de mensagens, determinar o seu desentranhamento dos autos, anular a sentença condenatória e determinar ao juízo de primeira instância a prolação de nova sentença com base no acervo probatório remanescente.\nTese de julgamento:\n1. Os prints de mensagens desacompanhados do arquivo digital de origem, que impeçam a verificação da cadeia de custódia e da mesmidade do conteúdo, são inadmissíveis como prova penal e devem ser desentranhados dos autos.\nDispositivos relevantes citados:CPP, arts. 155, 157, 158-A a 158-F e 315, § 2º, II e IV; RISTJ, art. 253, parágrafo único, II, \"b\" e \"c\".\nJurisprudência relevante citada:STJ, AgRg no HC n. 738.418/SP, Sexta Turma, j. 11.03.2025; STJ, AgRg nos EDcl no AREsp n. 2.521.345/RO, Quinta Turma, j. 18.06.2024; STJ, AgRg no HC n. 828.054/RN, Quinta Turma, j. 23.04.2024; STJ, RHC n. 218.499/SC, Sexta Turma, j.\n10.09.2025; STJ, AgRg no HC n. 958.288/SP, Sexta Turma, j.\n11.06.2025; STJ, AgRg no REsp n. 2.207.132/TO, Quinta Turma, j.\n09.12.2025; STJ, AgRg no RHC n. 216.742/RJ, Sexta Turma, j.\n25.11.2025.","cit":"(AREsp n. 3.132.918/RS, relator Ministro Ribeiro Dantas, Quinta Turma, julgado em 9/6/2026, DJEN de 15/6/2026.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202504948225&dt_publicacao=15/06/2026","origem":"Pesquisa \"prova digital\" [posição 2]","grupo":""},{"id":"j502520901","eixo":"e2","trib":"STJ","classe":"AgRg no AREsp 2.985.235/MT","registro":"2025/0252090-1","rel":"Ribeiro Dantas","conv":"","relac":"","orgao":"5ª T.","data":"09/06/2026","dje":"16/06/2026","ementa":"DIREITO PROCESSUAL PENAL. AGRAVO REGIMENTAL. PROVA DIGITAL EXTRAÍDA DE CELULARES. OPERAÇÃO CAPISTRUM. CADEIA DE CUSTÓDIA. TRIBUNAL DE ORIGEM QUE AFIRMA TER HAVIDO DOCUMENTAÇÃO DA ARRECADAÇÃO, ARMAZENAMENTO E ANÁLISE DOS ELETRÔNICOS. AUSÊNCIA DE ENFRENTAMENTO DOS PONTOS ESPECÍFICOS IMPUGNADOS PELA DEFESA. RESPONSÁVEL PELA EXTRAÇÃO, MÉTODO, DATA, INTEGRALIDADE DO CONTEÚDO TRANSFERIDO E ORIGEM DA ANÁLISE. ÔNUS DO ESTADO DE DEMONSTRAR A CONFIABILIDADE DA PROVA DIGITAL. DÉFICIT DE FUNDAMENTAÇÃO. ANULAÇÃO DO ACÓRDÃO RECORRIDO PARA NOVO JULGAMENTO. AGRAVO REGIMENTAL IMPROVIDO.\nI. CASO EM EXAME\n1. Agravo regimental interposto contra decisão que conheceu agravo para dar parcial provimento ao recurso especial, anulando o acórdão recorrido e determinando o retorno dos autos ao Tribunal de origem para novo julgamento quanto à admissibilidade de prova digital extraída de celulares apreendidos na Operação Capistrum, à luz dos parâmetros da cadeia de custódia.\n2. Fato relevante. A defesa alegou inadmissibilidade dos dados dos Relatórios Técnicos n. 005/2022 e 009/2023 por ausência de indicação do responsável pela extração, do método empregado, da data do procedimento, da integralidade do conteúdo transferido e da origem da análise (aparelhos ou HD externo), sustentando contaminação das provas derivadas. O acórdão de origem afastou a nulidade, atribuindo à defesa o ônus de demonstrar adulteração ou prejuízo e referindo genericamente a integridade do material.\n3. Decisão anterior. A decisão agravada concluiu haver déficit de fundamentação sobre a cadeia de custódia da prova digital, afirmando ser ônus do Estado demonstrar a integridade e autenticidade dos vestígios e determinando a anulação do acórdão de apelação para novo julgamento à luz dos arts. 157, § 1º, 158 e 158-A a 158-F do CPP.\nII. QUESTÃO EM DISCUSSÃO\n4. Há duas questões em discussão: (i) definir se a decisão agravada deve ser reconsiderada diante das alegações de incidência das Súmulas 182/STJ e 7/STJ e da orientação jurisprudencial segundo a qual a quebra da cadeia de custódia, sem elementos de adulteração, manipulação ou prejuízo concreto, não conduz automaticamente à nulidade da prova; e (ii) estabelecer se o acórdão recorrido enfrentou adequadamente a alegação defensiva de quebra da cadeia de custódia da prova digital, especialmente quanto à ausência de indicação do responsável pela extração, do método utilizado, da data do procedimento, da integralidade do conteúdo transferido e da origem da análise.\nIII. RAZÕES DE DECIDIR\n5. A parte agravante não apresenta argumentos suficientes para alterar a decisão agravada.\n6. O Tribunal de origem afirma que a Polícia Civil e o Ministério Público Estadual documentaram os atos praticados na arrecadação, armazenamento e análise dos eletrônicos apreendidos, com a apresentação de garantias de que o conteúdo permaneceu íntegro enquanto esteve sob custódia policial.\n7. O acórdão recorrido registra que os relatórios técnicos indicam os lacres em que acondicionados os celulares, o modelo, o número de série e o IMEI dos aparelhos, o chip e a operadora utilizada, os dados cadastrais de seus proprietários, bem como informações relativas a aplicativos, contas de usuário, chamadas, contatos telefônicos, localizações, mensagens e mídias.\n8. O Tribunal de origem também assenta que a defesa não nega a autenticidade dos elementos informativos encontrados nos smartphones, não aponta qual informação teria sido manipulada e não demonstra inconsistência das fontes, adulteração ou falta de cautela no manuseio dos registros.\n9. Apesar dessas afirmações, o acórdão recorrido não enfrenta o ponto decisivo suscitado pela defesa: a ausência de indicação do responsável pela extração, do método empregado, da data do procedimento, da integralidade do conteúdo transferido e da origem da análise, isto é, se realizada diretamente a partir dos aparelhos apreendidos ou de HD externo.\n10. A controvérsia não se limita à existência de relatórios técnicos ou à presença de dados extraídos dos aparelhos, mas envolve saber se esses relatórios permitem reconstruir o percurso pelo qual a prova digital foi obtida, preservada e analisada.\n11. O Estado tem o ônus de demonstrar a confiabilidade da fonte probatória, não sendo admissível presumir que o conteúdo analisado corresponde ao conteúdo apreendido, que a extração foi completa, que o método empregado era idôneo ou que o material examinado teve origem nos próprios aparelhos.\n12. A transferência ao acusado do ônus de demonstrar o efetivo comprometimento da cadeia de custódia converte em presunção aquilo que deve ser demonstrado pelo Estado.\n13. O déficit de fundamentação impede o controle da instância superior sobre a admissibilidade da prova digital, pois permanece sem resposta a questão sobre a correspondência entre o conteúdo apreendido e aquele posteriormente utilizado no processo.\n14. O Tribunal de origem deve realizar novo julgamento, explicitando, a partir do que consta dos autos, o procedimento de arrecadação e extração dos dados, a preservação da integridade e da autenticidade dos vestígios digitais e as consequências de eventual imprestabilidade para o conjunto probatório.\nIV. DISPOSITIVO E TESE\n15. . Resultado do Julgamento: Agravo regimental improvido, mantida a anulação do acórdão recorrido para novo julgamento pelo Tribunal de origem quanto à admissibilidade da prova digital, observados os parâmetros da cadeia de custódia.\nTese de julgamento:\n1. A existência de relatórios técnicos sobre aparelhos celulares apreendidos não basta, por si só, para demonstrar a confiabilidade da prova digital quando não enfrentadas as impugnações específicas sobre extração, método, data, integralidade e origem da análise.\n2. O Estado-acusação tem o ônus de demonstrar a integridade, a autenticidade e a rastreabilidade da prova digital que apresenta.\n3. O acórdão que afasta a alegação de quebra da cadeia de custódia sem examinar se os autos permitem reconstruir o percurso de obtenção, preservação e análise da prova digital apresenta déficit de fundamentação.\n4. A insuficiência de fundamentação quanto à cadeia de custódia da prova digital impõe a anulação do acórdão recorrido para novo julgamento pela instância de origem.\nDispositivos relevantes citados: CPP, art. 157, § 1º; CPP, art. 158; CPP, arts. 158-A a 158-F\nJurisprudência relevante citada: STJ, Súmulas 7 e 182; STJ, AgRg no RHC n. 125.733/SP, Rel. Min. Antonio Saldanha Palheiro, Sexta Turma, j. 23.11.2021, DJe 26.11.2021; STJ, AgRg no RHC n. 143.169/RJ, Rel. Min. Messod Azulay Neto, Rel. p/ acórdão Min. Ribeiro Dantas, Quinta Turma, j. 07.02.2023, DJe 02.03.2023; STJ, AgRg no HC n. 828.054/RN, Rel. Min. Joel Ilan Paciornik, Quinta Turma, j. 23.04.2024, DJe 29.04.2024; STJ, AREsp n. 2.967.413/RS, Rel. Min. Ribeiro Dantas, Quinta Turma, j. 09.12.2025, DJEN 16.12.2025.","cit":"(AgRg no AREsp n. 2.985.235/MT, relator Ministro Ribeiro Dantas, Quinta Turma, julgado em 9/6/2026, DJEN de 16/6/2026.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202502520901&dt_publicacao=16/06/2026","origem":"Pesquisa \"prova digital\" [posição 12]","grupo":""},{"id":"j601246168","eixo":"e2","trib":"STJ","classe":"AgRg no RHC 235.625/SP","registro":"2026/0124616-8","rel":"Reynaldo Soares da Fonseca","conv":"","relac":"","orgao":"5ª T.","data":"27/05/2026","dje":"01/06/2026","ementa":"PROCESSUAL PENAL. AGRAVO REGIMENTAL NO RECURSO ORDINÁRIO EM HABEAS CORPUS. PROVA DIGITAL. CADEIA DE CUSTÓDIA. DOCUMENTAÇÃO MÍNIMA. REGULAR ARRECADAÇÃO, PRESERVAÇÃO, EXTRAÇÃO E ARMAZENAMENTO. INADEQUAÇÃO DO HABEAS CORPUS. NÃO OCORRÊNCIA. QUESTÃO OBJETIVAMENTE VERIFICÁVEL A PARTIR DOS AUTOS. AUSÊNCIA DE LAUDO TÉCNICO DE EXTRAÇÃO, DE INDICAÇÃO DO MEIO DE ENTREGA E DE FORMALIZAÇÃO DO PERCURSO DA PROVA DIGITAL. IMPOSSIBILIDADE DE BAIXAR OS ARQUIVOS APÓS A INSERÇÃO NO SISTEMA. DISPONIBILIZAÇÃO DE NOVO LINK A PARTIR DE GRAVAÇÃO DA TELA DO SISTEMA. PRESUNÇÃO DE IDONEIDADE DA PROVA E FÉ PÚBLICA DA SERVIDORA. INSUFICIÊNCIA. INTEGRIDADE, MESMIDADE E AUDITABILIDADE NÃO DEMONSTRADAS. INADMISSIBILIDADE DAS PROVAS DIGITAIS, NO ESTADO ATUAL. AGRAVO REGIMENTAL NÃO PROVIDO.\n1. A controvérsia deduzida no habeas corpus diz respeito à existência, ou não, de documentação mínima apta a demonstrar a regular arrecadação, preservação, extração e armazenamento de elementos de prova digitais, matéria objetivamente verificável a partir da leitura dos autos e que não exige reexame aprofundado da narrativa fática nem incursão valorativa sobre a suficiência do conteúdo dos vídeos para futura condenação.\n2. A cadeia de custódia da prova digital não traduz simples formalismo procedimental, mas instrumento voltado a assegurar a idoneidade epistemológica da prova, a correspondência entre o vestígio originariamente arrecadado e o elemento submetido ao contraditório e à valoração jurisdicional, bem como a sua integridade, mesmidade e auditabilidade.\n3. No caso, não há notícia de: apreensão técnica do equipamento de origem; laudo descrevendo a forma de extração dos arquivos; indicação do meio pelo qual teriam sido entregues à autoridade policial; referência à geração e confrontação de hash; ou formalização adequada do percurso percorrido pela prova digital até sua inserção no sistema policial.\n4. A circunstância de os arquivos, após inseridos no Portal de Vídeos da Polícia Civil, não mais poderem ser baixados, tendo a visualização franqueada à defesa decorrido de nova captação mediante gravação daquilo que aparecia na tela do sistema, reforça a ausência de demonstração objetiva da integridade da prova.\n5. A mera informação de que o link estaria identificado como proveniente de câmera de segurança ou de aparelho celular, o relatório policial descritivo e a invocação de presunção de idoneidade da prova ou de fé pública da servidora não suprem, no caso, a ausência de documentação técnica objetiva e auditável acerca da obtenção, preservação e integridade dos arquivos.\n6. Em se tratando de prova digital, a ausência de documentação técnica pode inviabilizar o próprio acesso aos parâmetros necessários para a identificação de eventual adulteração, não sendo legítimo inverter contra a defesa o ônus de demonstrar precisamente aquilo cuja averiguação se tornou inviável pela própria deficiência da custódia estatal, sob pena de verdadeira prova diabólica.\n7. Mantém-se, assim, a conclusão de que as provas digitais, da forma como juntadas aos autos, são inadmissíveis, com ressalva de eventual perícia, caso ainda existentes os arquivos originais ou fonte primária tecnicamente idônea e viável sua análise.\n8. Agravo regimental não provido.","cit":"(AgRg no RHC n. 235.625/SP, relator Ministro Reynaldo Soares da Fonseca, Quinta Turma, julgado em 27/5/2026, DJEN de 1/6/2026.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202601246168&dt_publicacao=01/06/2026","origem":"Pesquisa \"prova digital\" [posição 3]","grupo":""},{"id":"j502241816","eixo":"e2","trib":"STJ","classe":"AREsp 2.967.413/RS","registro":"2025/0224181-6","rel":"Ribeiro Dantas","conv":"","relac":"","orgao":"5ª T.","data":"09/12/2025","dje":"16/12/2025","ementa":"DIREITO PROCESSUAL PENAL E PENAL. AGRAVO EM RECURSO ESPECIAL. ORGANIZAÇÃO CRIMINOSA ARMADA (ART. 2º, § 2º, DA LEI 12.850/2013). PREQUESTIONAMENTO. AUSÊNCIA QUANTO AO ART. 7º DA LEI 12.965/2014. APLICAÇÃO DAS SÚMULAS 282 E 356/STF. PROVA DIGITAL EXTRAÍDA DE CELULAR. CAPTURAS DE TELA DE APLICATIVO DE MENSAGENS. CADEIA DE CUSTÓDIA. ÔNUS DO ESTADO DE DEMONSTRAR A INTEGRIDADE E A AUTENTICIDADE DOS DADOS. NECESSIDADE DE DOCUMENTAÇÃO DO PROCEDIMENTO TÉCNICO DE OBTENÇÃO DA PROVA. ANULAÇÃO DO ACÓRDÃO DE APELAÇÃO PARA NOVO JULGAMENTO, À LUZ DOS PARÂMETROS DA CADEIA DE CUSTÓDIA DA PROVA DIGITAL. AGRAVO CONHECIDO. RECURSO ESPECIAL PARCIALMENTE PROVIDO.\nI. CASO EM EXAME\n1. Agravo em recurso especial interposto contra decisão que inadmitiu recurso especial fundado na alínea \"a\" do art. 105, III, da Constituição, em processo de organização criminosa armada voltada ao tráfico de drogas e emprego de armas de fogo, no qual o agravante foi condenado, com base, entre outros elementos, em dados telemáticos (capturas de tela de aplicativo de mensagens) extraídos do celular de corréu, aparelho entregue espontaneamente por sua mãe e tia após tentativa de homicídio, sendo central a discussão sobre a validade da prova digital produzida, a observância da cadeia de custódia e a suficiência de sua documentação para fins de condenação.\nII. QUESTÃO EM DISCUSSÃO\n2. Há três questões em discussão: (i) definir se é possível conhecer da alegada violação ao art. 7º, I, II e III, da Lei 12.965/2014 sem que o tema tenha sido objeto de debate e decisão pelo Tribunal de origem; (ii) estabelecer se as capturas de tela de conversas em aplicativo de mensagens, obtidas de celular apreendido e juntadas aos autos sem descrição e documentação dos procedimentos técnicos de extração e preservação, atendem às exigências de cadeia de custódia previstas no CPP para que sejam consideradas prova digital confiável; e (iii) determinar quais são as consequências processuais da ausência de demonstração, pelo Estado, da integridade e autenticidade da prova digital, notadamente quanto à necessidade de novo julgamento da apelação à luz de parâmetros claros sobre a cadeia de custódia.\nIII. RAZÕES DE DECIDIR\n3. Reconhece-se que o recurso especial preenche os requisitos gerais de admissibilidade, inclusive quanto à demonstração da relevância da matéria, por se tratar de ação penal abrangida pela presunção do art. 105, § 3º, I, da Constituição da República, incluído pela EC 125/2022.\n4. Afirma-se a impossibilidade de exame da alegada violação ao art. 7º, I, II e III, da Lei 12.965/2014 (Marco Civil da Internet), porque a matéria não foi apreciada pelo acórdão recorrido, tampouco foram opostos embargos de declaração para provocar manifestação da Corte local, incidindo, quanto a esse ponto, os óbices das Súmulas 282 e 356 do STF, aplicáveis inclusive às matérias de ordem pública, que também exigem prequestionamento (AgRg nos EDcl no AREsp n. 1.721.960/SC).\n5. Assenta-se que a cadeia de custódia constitui desdobramento lógico do conceito de corpo de delito (CPP, art. 158), sendo destinada a garantir a correspondência entre os vestígios originalmente arrecadados e o material efetivamente apresentado ao juiz, de modo a afastar dúvidas sobre identidade e integridade da prova, em linha com os arts. 158-A a 158-F do CPP, ainda que sua positivação tenha sido posterior aos fatos.\n6. Exige-se, ao menos, que o processo de coleta, preservação e análise seja documentado de forma compreensível, verificável, auditável e repetível, de modo a viabilizar o controle pelas partes e eventual perícia independente.\n7. Destaca-se que capturas de tela (printscreens) de conversas em aplicativos de mensagens, quando produzidas sem protocolo padronizado, sem descrição do dispositivo, do aplicativo utilizado e da sequência de extração, consistem em recortes visuais descontextualizados, altamente suscetíveis a manipulações (cortes, supressões, inserções) que não deixam rastro imediatamente perceptíveis, razão pela qual tais arquivos, isoladamente, configuram prova intrinsecamente frágil e dependente de documentação adequada para alcançar grau mínimo de confiabilidade.\n8. Atribui-se ao Estado-acusação o ônus de demonstrar positivamente a integridade e a confiabilidade da prova digital que apresenta, não sendo admissível presumir a higidez de elementos obtidos à margem dos protocolos de cadeia de custódia, conforme já assentado por esta Corte (AgRg no RHC n. 143.169/RJ e AgRg no HC n. 828.054/RN), de modo que a ausência de documentação do percurso probatório e de garantias mínimas de \"mesmidade\" conduz à inadmissibilidade da prova ou, ao menos, à necessidade de reavaliação de sua validade em instância ordinária.\n9. Assinala-se que a falta de documentação precisa sobre a forma de obtenção das capturas de tela, aliada à ausência de descrição das etapas de arrecadação, armazenamento e análise do conteúdo digital, torna inviável à defesa comprovar eventual adulteração, caracterizando verdadeira \"prova diabólica\", pois inexiste parâmetro objetivo que permita cotejar o material juntado aos autos com o conteúdo originalmente existente no dispositivo, o que compromete o contraditório substancial e inviabiliza o controle epistêmico da prova.\n10. Reconhece-se que o Tribunal de origem, ao afastar genericamente a alegação de quebra da cadeia de custódia sob o argumento de que a defesa não demonstrou prejuízo nem apontou qual etapa do procedimento teria sido violada, deixou de explicitar, com base nos elementos concretos dos autos, como se deu a coleta e preservação das capturas de tela, quais atos foram praticados pela polícia, que registros existem e em que medida tais registros asseguram a correspondência entre o material apreendido e o exibido em juízo, configurando déficit de fundamentação que impede o controle desta Corte sobre a admissão da prova digital.\nIV. DISPOSITIVO E TESE\n11. Agravo conhecido para dar parcial provimento ao recurso especial, a fim de anular o acórdão de apelação e determinar o retorno dos autos ao Tribunal de origem para novo julgamento, diante da insuficiência de motivação quanto à observância da cadeia de custódia da prova digital - elemento decisivo para a condenação por organização criminosa. No novo exame, deverá o Tribunal: (a) descrever, com base no que efetivamente consta dos autos, o procedimento de arrecadação e extração da captura de tela do celular; (b) avaliar, à luz dos arts. 157, § 1º, 158 e 158-A a 158-F do CPP, se foram preservadas a integridade e a autenticidade dos printscreens; e (c) definir, com motivação adequada, a admissibilidade ou não da prova digital e as consequências de eventual imprestabilidade para o conjunto probatório.\nTese de julgamento:\n1. A apreciação de alegada violação ao art. 7º da Lei 12.965/2014, ainda que a matéria seja de ordem pública, exige prévio exame pela instância ordinária, sendo indispensável o prequestionamento, sob pena de incidência das Súmulas 282 e 356/STF. 2. A cadeia de custódia constitui condição de confiabilidade da prova digital e impõe ao Estado o dever de documentar, de forma minimamente verificável, os procedimentos de coleta, preservação e análise dos dados, notadamente quando se tratar de capturas de tela de aplicativo de mensagens extraídas de aparelho celular apreendido. 3.\nÉ ônus exclusivo da acusação demonstrar a integridade e a autenticidade da prova digital apresentada, não sendo admissível presumir sua higidez quando inexistem registros técnicos e documentação da cadeia de custódia, circunstância que pode conduzir à inadmissibilidade da prova ou à necessidade de novo julgamento em instância ordinária. 4. A ausência, no acórdão de apelação, de fundamentação específica sobre a forma de obtenção e preservação de capturas de tela utilizadas como prova central em condenação penal enseja a anulação do julgamento e a devolução dos autos ao Tribunal de origem para novo exame, com motivação expressa à luz dos arts.\n157, § 1º, 158 e 158-A a 158-F do CPP. Dispositivos relevantes citados:\nCR/1988, art. 105, III, \"a\"; CPP, arts. 155, 157, §1º, 158, 158-A, 158-B, 158-C; Lei nº 12.850/2013, art. 2º, §2º; Lei nº 12.965/2014, art. 7º, incisos I, II e III.\nJurisprudência relevante citada:STJ, AgRg no RHC 143.169/RJ, Rel. Min. Messod Azulay Neto, Rel. p/ Acórdão Min. Ribeiro Dantas, Quinta Turma, julgado em 07.02.2023, DJe 02.03.2023; STJ, AgRg no HC 828.054/RN, Rel. Min. Joel Ilan Paciornik, Quinta Turma, julgado em 23.04.2024, DJe 29.04.2024.","cit":"(AREsp n. 2.967.413/RS, relator Ministro Ribeiro Dantas, Quinta Turma, julgado em 9/12/2025, DJEN de 16/12/2025.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202502241816&dt_publicacao=16/12/2025","origem":"Pesquisa \"prova digital\" [posição 9]","grupo":""},{"id":"j301896150","eixo":"e2","trib":"STJ","classe":"AgRg no HC 828.054/RN","registro":"2023/0189615-0","rel":"Joel Ilan Paciornik","conv":"","relac":"","orgao":"5ª T.","data":"23/04/2024","dje":"29/04/2024","ementa":"PROCESSUAL PENAL. AGRAVO REGIMENTAL NO HABEAS CORPUS. TRÁFICO DE DROGAS. APREENSÃO DE CELULAR. EXTRAÇÃO DE DADOS. CAPTURA DE TELAS. QUEBRA DA CADEIA DE CUSTÓDIA. INADMISSIBILIDADE DA PROVA DIGITAL. AGRAVO REGIMENTAL PROVIDO.\n1. O instituto da cadeia de custódia visa a garantir que o tratamento dos elementos probatórios, desde sua arrecadação até a análise pela autoridade judicial, seja idôneo e livre de qualquer interferência que possa macular a confiabilidade da prova.\n2. Diante da volatilidade dos dados telemáticos e da maior suscetibilidade a alterações, imprescindível se faz a adoção de mecanismos que assegurem a preservação integral dos vestígios probatórios, de forma que seja possível a constatação de eventuais alterações, intencionais ou não, dos elementos inicialmente coletados, demonstrando-se a higidez do caminho percorrido pelo material.\n3. A auditabilidade, a repetibilidade, a reprodutibilidade e a justificabilidade são quatro aspectos essenciais das evidências digitais, os quais buscam ser garantidos pela utilização de metodologias e procedimentos certificados, como, e.g., os recomendados pela ABNT.\n4. A observação do princípio da mesmidade visa a assegurar a confiabilidade da prova, a fim de que seja possível se verificar a correspondência entre aquilo que foi colhido e o que resultou de todo o processo de extração da prova de seu substrato digital. Uma forma de se garantir a mesmidade dos elementos digitais é a utilização da técnica de algoritmo hash, a qual deve vir acompanhada da utilização de um software confiável, auditável e amplamente certificado, que possibilite o acesso, a interpretação e a extração dos dados do arquivo digital.\n5. De relevo trazer à baila o entendimento majoritário desta Quinta Turma no sentido de que \"é ônus do Estado comprovar a integridade e confiabilidade das fontes de prova por ele apresentadas. É incabível, aqui, simplesmente presumir a veracidade das alegações estatais, quando descumpridos os procedimentos referentes à cadeia de custódia\" (AgRg no RHC n. 143.169/RJ, relator Ministro Messod Azulay Neto, relator para acórdão Ministro Ribeiro Dantas, Quinta Turma, DJe de 2/3/2023).\n6. Neste caso, não houve a adoção de procedimentos que assegurassem a idoneidade e a integridade dos elementos obtidos pela extração dos dados do celular apreendido. Logo, evidentes o prejuízo causado pela quebra da cadeia de custódia e a imprestabilidade da prova digital.\n7. Agravo regimental provido a fim de conceder a ordem de ofício para que sejam declaradas inadmissíveis as provas decorrentes da extração de dados do celular do corréu, bem como as delas decorrentes, devendo o Juízo singular avaliar a existência de demais elementos probatórios que sustentem a manutenção da condenação.","cit":"(AgRg no HC n. 828.054/RN, relator Ministro Joel Ilan Paciornik, Quinta Turma, julgado em 23/4/2024, DJe de 29/4/2024.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202301896150&dt_publicacao=29/04/2024","origem":"Pesquisa \"prova digital\" [posição 7]; Pesquisa \"prova digital\" e \"quebra da cadeia de custódia\" [posição 1]","grupo":""},{"id":"j600564538","eixo":"e3","trib":"STJ","classe":"AgRg no HC 1.074.649/RS","registro":"2026/0056453-8","rel":"Sebastião Reis Júnior","conv":"","relac":"","orgao":"6ª T.","data":"29/10/2026","dje":"05/11/2026","ementa":"AGRAVO REGIMENTAL EM HABEAS CORPUS. DIREITO PENAL E PROCESSUAL PENAL. TRÁFICO DE DROGAS E ASSOCIAÇÃO PARA O TRÁFICO. PROVA DIGITAL. CADEIA DE CUSTÓDIA. PERÍCIA OFICIAL. INFORMAÇÕES SUPERVENIENTES SOBRE GUARDA, EXTRAÇÃO E PRESERVAÇÃO DOS DADOS. AUSÊNCIA DE DEMONSTRAÇÃO CONCRETA DE ADULTERAÇÃO OU PREJUÍZO.\n1. As informações prestadas após a concessão da liminar esclareceram a localização dos aparelhos, sua guarda, movimentação e metodologia de extração dos dados, superando a incerteza que justificara a tutela de urgência.\n2. Eventual inobservância de etapa da cadeia de custódia não acarreta, por si só, a inadmissibilidade da prova, exigindo demonstração concreta de comprometimento de sua integridade ou de efetivo prejuízo à defesa.\n3. O parecer técnico apresentado pela defesa aponta riscos metodológicos decorrentes da ausência de imagem forense integral e da manipulação direta dos dispositivos, mas não identifica adulteração concreta de arquivo, mensagem ou dado utilizado na persecução penal.\n4. A confiabilidade e o valor da prova digital devem ser apreciados pelo Juízo natural em conjunto com os demais elementos probatórios, sendo inviável o aprofundado reexame do acervo fático-probatório na via do habeas corpus.\n5. Agravo regimental improvido.","cit":"(AgRg no HC n. 1.074.649/RS, relator Ministro Sebastião Reis Júnior, Sexta Turma, julgado em 29/10/2026, DJEN de 5/11/2026.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202600564538&dt_publicacao=05/11/2026","origem":"Pesquisa \"prova digital\" [posição 15]","grupo":""},{"id":"j601514562","eixo":"e3","trib":"STJ","classe":"AgRg no HC 1.090.663/MS","registro":"2026/0151456-2","rel":"Reynaldo Soares da Fonseca","conv":"","relac":"","orgao":"5ª T.","data":"15/06/2026","dje":"18/06/2026","ementa":"PENAL E PROCESSO PENAL. AGRAVO REGIMENTAL NO HABEAS CORPUS. TRÁFICO DE DROGAS, POSSE IRREGULAR DE ARMA DE FOGO OU MUNIÇÃO DE USO PERMITIDO. INTEGRAÇÃO DE ORGANIZAÇÃO CRIMINOSA. MAUS TRATOS DE ANIMAIS. PROVA DIGITAL. ALEGADA QUEBRA DA CADEIA DE CUSTÓDIA. AUSÊNCIA DE DEMONSTRAÇÃO DE ADULTERAÇÃO OU PREJUÍZO. PERÍCIA TÉCNICA. DISPENSABILIDADE NO CASO CONCRETO. ACESSO DA DEFESA AO MATERIAL PROBATÓRIO. CERCEAMENTO DE DEFESA NÃO CONFIGURADO. DISPONIBILIZAÇÃO DE ARQUIVOS EM MÍDIA EXTERNA OU LINK. REGULARIDADE. AUSÊNCIA DE FLAGRANTE ILEGALIDADE. AGRAVO REGIMENTAL A QUE SE NEGA PROVIMENTO.\n1. O julgamento monocrático pelo Relator, nas hipóteses regimentais e legais, não viola a colegialidade, sendo assegurado o controle pelo agravo regimental e a sustentação oral.\n2. A cadeia de custódia, definida no art. 158-A do CPP, visa assegurar a idoneidade e rastreabilidade do vestígio; eventual inobservância de procedimentos não gera nulidade automática, devendo-se aferir confiabilidade da prova e prejuízo à defesa. No caso, As instâncias ordinárias consignaram autorização judicial para acesso ao conteúdo dos celulares, adequada documentação das diligências e inexistência de qualquer indício concreto de adulteração, manipulação ou substituição de arquivos; a mera ausência de perícia oficial não invalida a prova quando inexiste exigência legal e não há mácula demonstrada.\n3. A disponibilização de arquivos por meio de mídia externa ou link eletrônico não acarreta, por si só, nulidade da prova, desde que assegurado o acesso às partes e ausentes indícios de adulteração.\n4. A pretensão de desconstituir as conclusões das instâncias ordinárias quanto à integridade, autenticidade e preservação do material digital demanda amplo reexame fático-probatório, incompatível com o habeas corpus.\n5. Agravo regimental a que se nega provimento.","cit":"(AgRg no HC n. 1.090.663/MS, relator Ministro Reynaldo Soares da Fonseca, Quinta Turma, julgado em 15/6/2026, DJEN de 18/6/2026.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202601514562&dt_publicacao=18/06/2026","origem":"Pesquisa \"prova digital\" [posição 18]","grupo":""},{"id":"j502986619","eixo":"e3","trib":"STJ","classe":"AgRg no RHC 221.121/DF","registro":"2025/0298661-9","rel":"Ribeiro Dantas","conv":"","relac":"","orgao":"5ª T.","data":"10/12/2025","dje":"15/12/2025","ementa":"DIREITO PROCESSUAL PENAL. AGRAVO REGIMENTAL EM HABEAS CORPUS. QUEBRA DA CADEIA DE CUSTÓDIA. PROVA DIGITAL. INEXISTÊNCIA DE DEMONSTRAÇÃO DE ADULTERAÇÃO OU PREJUÍZO. AGRAVO IMPROVIDO.\n\nI. CASO EM EXAME\n1. Agravo regimental interposto contra decisão que negou provimento ao recurso em habeas corpus, no qual se pleiteava o reconhecimento da nulidade de provas digitais por suposta quebra da cadeia de custódia.\n2. O agravante alegou que as mídias digitais apresentadas como prova não possuem garantia de integridade, não foram acompanhadas de laudo pericial e não há documentação que comprove a preservação de sua integridade, como forma e procedimentos adotados na extração e armazenamento.\n3. O Tribunal de Justiça entendeu que a confiabilidade da prova deve ser examinada pelo magistrado em conjunto com os demais elementos colhidos na instrução criminal, não havendo indícios de adulteração ou manipulação das mídias digitais.\n\nII. QUESTÃO EM DISCUSSÃO\n4. A questão em discussão consiste em saber se a ausência de documentação técnica que comprove a preservação da integridade das mídias digitais utilizadas como prova na ação penal em curso, sem indícios concretos de adulteração ou manipulação, é suficiente para caracterizar a quebra da cadeia de custódia e a nulidade da prova.\n\nIII. RAZÕES DE DECIDIR\n5. A quebra da cadeia de custódia exige demonstração concreta de adulteração ou prejuízo à prova, não sendo suficiente a mera ausência de documentação técnica ou alegações genéricas.\n6. A confiabilidade da prova deve ser aferida pelo magistrado em conjunto com os demais elementos colhidos na instrução criminal, conforme o princípio do livre convencimento motivado previsto no art. 155 do Código de Processo Penal.\n7. A alegação de nulidade da prova por quebra da cadeia de custódia, sem indícios concretos de adulteração ou manipulação, não pode ser analisada na via estreita do habeas corpus, sendo necessária a análise aprofundada durante a instrução criminal.\n8. A prova digital, por sua natureza volátil e manipulável, exige cuidados específicos quanto à sua produção, guarda e utilização, mas sua validade e eficácia probante devem ser avaliadas no curso da instrução criminal.\n\nIV. DISPOSITIVO E TESE\n9. Resultado do Julgamento: Agravo regimental improvido.\n\nTese de julgamento: 1. A quebra da cadeia de custódia da prova exige demonstração concreta de adulteração ou prejuízo, não sendo suficiente a mera ausência de documentação técnica ou alegações genéricas. 2. A confiabilidade da prova deve ser aferida pelo magistrado em conjunto com os demais elementos colhidos na instrução criminal, conforme o princípio do livre convencimento motivado. 3. A alegação de nulidade da prova por quebra da cadeia de custódia, sem indícios concretos de adulteração ou manipulação, não pode ser analisada na via estreita do habeas corpus. 4. A validade e eficácia probante de provas digitais devem ser avaliadas no curso da instrução criminal.\n\nDispositivos relevantes citados: CPP, arts. 155 e 158-B.\n\nJurisprudência relevante citada: STJ, HC n. 653.515/RJ, Rel. Min. Rogerio Schietti Cruz, Sexta Turma, julgado em 23.11.2021, DJe 01.02.2022; STJ, AgRg no RHC n. 208.857/BA, Rel. Min. Joel Ilan Paciornik, Quinta Turma, julgado em 30.04.2025, DJEN 07.05.2025; STJ, HC n. 574.131/RS, Rel. Min. Nefi Cordeiro, Sexta Turma, julgado em 25.08.2020, DJe 04.09.2020; STJ, AgRg no RHC n. 145.671/RJ, Rel. Min. Olindo Menezes (Desembargador Convocado do TRF 1ª Região), Sexta Turma, julgado em 24.08.2021, DJe 31.08.2021.","cit":"(AgRg no RHC n. 221.121/DF, relator Ministro Ribeiro Dantas, Quinta Turma, julgado em 10/12/2025, DJEN de 15/12/2025.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202502986619&dt_publicacao=15/12/2025","origem":"Pesquisa \"prova digital\" [posição 20]; Pesquisa \"prova digital\" e \"quebra da cadeia de custódia\" [posição 4]","grupo":""},{"id":"j404371520","eixo":"e3","trib":"STJ","classe":"AgRg no HC 961.638/RS","registro":"2024/0437152-0","rel":"Ribeiro Dantas","conv":"","relac":"","orgao":"5ª T.","data":"26/02/2025","dje":"07/03/2025","ementa":"DIREITO PROCESSUAL PENAL. AGRAVO REGIMENTAL. PROVAS DIGITAIS. AUTENTICIDADE E CONFIABILIDADE. INEXISTÊNCIA DE VIOLAÇÃO A NORMAS CONSTITUCIONAIS OU LEGAIS. DESENTRANHAMENTO. DESCABIMENTO. AGRAVO DESPROVIDO.\nI. CASO EM EXAME\n1. Agravo regimental interposto contra decisão monocrática que não conheceu do habeas corpus, no qual se alegava a nulidade de provas digitais juntadas aos autos, devido à impossibilidade de atestar sua autenticidade e veracidade por meio de perícia técnica.\n2. As gravações questionadas foram encaminhadas pela vítima, que as teria recebido de terceira pessoa, e não foram captadas diretamente das câmeras de monitoramento, mas sim por meio de gravação de tela utilizando aparelho celular.\n3. O Instituto Geral de Perícias informou a impossibilidade de realizar os exames solicitados, pois o arquivo questionado não foi apresentado em seu formato original.\nII. QUESTÃO EM DISCUSSÃO\n4. A questão em discussão consiste em saber se a impossibilidade de realização de perícia técnica para atestar a autenticidade de gravações digitais, obtidas por meio de gravação de tela, autoriza sua exclusão dos autos por violação ao devido processo legal e ao exercício da ampla defesa.\nIII. RAZÕES DE DECIDIR\n5. A jurisprudência desta Corte Superior orienta que questionamentos quanto à autenticidade ou confiabilidade de provas digitais devem ser avaliados no momento de sua valoração pelo julgador, não constituindo, por si só, causa de nulidade.\n6. A peculiaridade da forma de obtenção e apresentação das gravações deve ser considerada pelo magistrado ao sopesar seu valor probatório, em conjunto com os demais elementos produzidos sob o crivo do contraditório.\n7. A impossibilidade de realização da perícia pode impactar o valor probante das gravações, mas não impede o exercício do contraditório e da ampla defesa sobre seu conteúdo.\n8. As mídias questionadas constituem elementos informativos colhidos na fase investigativa e não podem fundamentar exclusivamente uma eventual pronúncia, por não serem provas produzidas sob o crivo do contraditório e da ampla defesa.\nIV. DISPOSITIVO E TESE\n9. Agravo desprovido.\nTese de julgamento: \"1. Questionamentos sobre a autenticidade de provas digitais devem ser avaliados na valoração pelo julgador, não constituindo causa de nulidade. 2. A forma de obtenção das gravações deve ser considerada ao sopesar seu valor probatório. 3. A impossibilidade de perícia não impede o contraditório e a ampla defesa sobre o conteúdo das gravações\".\nDispositivos relevantes citados: CPP, art. 157.\nJurisprudência relevante citada: STJ, AgRg no HC 828321, Rel. Min. Laurita Vaz, Sexta Turma, julgado em 25.09.2023.","cit":"(AgRg no HC n. 961.638/RS, relator Ministro Ribeiro Dantas, Quinta Turma, julgado em 26/2/2025, DJEN de 7/3/2025.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202404371520&dt_publicacao=07/03/2025","origem":"Pesquisa \"prova digital\" [posição 11]","grupo":""},{"id":"j201215086","eixo":"e4","trib":"STJ","classe":"AgRg no HC 738.418/SP","registro":"2022/0121508-6","rel":"Otávio de Almeida Toledo","conv":"Desembargador Convocado do TJSP","relac":"","orgao":"6ª T.","data":"11/03/2025","dje":"21/03/2025","ementa":"DIREITO PROCESSUAL PENAL. AGRAVO REGIMENTAL. CADEIA DE CUSTÓDIA. PROVA DIGITAL. FATOS ANTERIORES À LEI N. 13.964/2019. NECESSIDADE DE PRESERVAÇÃO. AUSÊNCIA DE EVIDENCIAÇÃO DA ADOÇÃO DE SALVAGUARDAS PARA PRESERVAÇÃO DA AUDITABILIDADE, REPETIBILIDADE, REPRODUTIBILIDADE E JUSTIFICABILIDADE. NULIDADE CONFIGURADA. DESENTRANHAMENTO DA PROVA E NOVO JULGAMENTO. AGRAVO REGIMENTAL PROVIDO.\n\nI. Caso em exame\n1. Agravo regimental interposto contra decisão que denegou a ordem de habeas corpus, visando ao desentranhamento de provas digitais obtidas sem a devida preservação da cadeia de custódia.\n2. O agravante foi condenado em primeira instância por corrupção passiva, com base em provas digitais consistentes em mensagens de WhatsApp, cuja cadeia de custódia foi questionada.\n3. A defesa alega que o celular não foi entregue voluntariamente e que a cadeia de custódia não foi preservada, comprometendo a integridade e autenticidade das provas.\n\nII. Questão em discussão\n4. A questão em discussão consiste em saber se (i) é exigível a preservação da cadeia de custódia da prova mesmo antes da entrada em vigor da Lei n. 13.964/2019; (ii) houve a devida preservação da cadeia de custódia das provas digitais (mensagens de WhatsApp) e (iii) em não havendo tal observância, há ou não comprometimento da validade dessas provas no processo penal.\n5. A análise envolve a verificação da cadeia custódia em toda a sua extensão, desde a obtenção até o descarte do vestígio, perpassando pelos cuidados necessários para permitir a sua devida avaliação e teste. A higidez da prova digital deve ser garantida sob os aspectos de auditabilidade, repetibilidade, reprodutibilidade e justificabilidade.\n\nIII. Razões de decidir\n6. A cadeia de custódia deve ser preservada para garantir a confiabilidade das provas digitais, conforme os arts. 158-A a 158-F do CPP, mesmo para fatos anteriores à Lei n. 13.964/2019, por ser ínsita à garantia da higidez probatória no processo penal e consectário lógico do devido processo legal.\n7. A ausência de medidas para a preservação da cadeia de custódia, quando impede qualquer teste de confiabilidade do conteúdo digital, torna a prova imprestável.\n8. No caso concreto, em que pese não se afigurar dos autos a ilicitude na obtenção da prova (hipótese textualmente prevista no art. 157 do CPP), é caso de inviabilidade de utilização de tais elementos em decorrência da quebra da cadeia de custódia nos momentos subsequentes. Nesse contexto, a imprestabilidade da prova digital, em razão da quebra da cadeia de custódia, impõe seu desentranhamento dos autos.\n\nIV. Dispositivo e tese\n9. Agravo regimental provido para conceder a ordem de habeas corpus, declarando a imprestabilidade da prova impugnada (conversas de WhatsApp) e determinando seu desentranhamento dos autos e a prolação de nova decisão.\n\nTese de julgamento: \"1. A cadeia de custódia deve ser preservada para garantir a confiabilidade das provas digitais. 2. A ausência de medidas para a preservação da cadeia de custódia, quando impede qualquer teste de confiabilidade do conteúdo digital, torna a prova imprestável. 3. A quebra da cadeia de custódia, nessas circunstâncias, impõe o desentranhamento da prova dos autos\".\n\nDispositivos relevantes citados: CPP, arts. 158-A a 158-F.\n\nJurisprudência relevante citada: STJ, AgRg no RHC n. 143.169/RJ, Rel. Min. Messod Azulay Neto, Rel. para acórdão Min. Ribeiro Dantas, Quinta Turma, j. 7/2/2023; STJ, AgRg no HC 902.195/RS, Rel. Min. Joel Ilan Paciornik, Quinta Turma, j. 03.12.2024; STJ, RHC 174.325/PR, Rel. Min. Rogerio Schietti Cruz, Sexta Turma, j. 05.11.2024.","cit":"(AgRg no HC n. 738.418/SP, relator Ministro Otávio de Almeida Toledo (Desembargador Convocado do TJSP), Sexta Turma, julgado em 11/3/2025, DJEN de 21/3/2025.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202201215086&dt_publicacao=21/03/2025","origem":"Pesquisa \"prova digital\" [posição 5]; Pesquisa \"prova digital\" e \"quebra da cadeia de custódia\" [posição 2]","grupo":""},{"id":"j503180246","eixo":"e5","trib":"STJ","classe":"AgRg no HC 1.029.565/ES","registro":"2025/0318024-6","rel":"Joel Ilan Paciornik","conv":"","relac":"Messod Azulay Neto","orgao":"5ª T.","data":"13/10/2026","dje":"04/11/2026","ementa":"DIREITO PROCESSUAL PENAL. AGRAVO REGIMENTAL EM HABEAS CORPUS. PROVA DIGITAL. CADEIA DE CUSTÓDIA. BLOQUEIO POR SENHA SUPERVENIENTE E AUSÊNCIA DE LACRE. IMPOSSIBILIDADE DE REPETIÇÃO DA PERÍCIA. ÔNUS DO ESTADO SOBRE INTEGRIDADE E CONFIABILIDADE DA PROVA. IMPRESTABILIDADE PROBATÓRIA. AGRAVO REGIMENTAL PARCIALMENTE PROVIDO. ORDEM CONCEDIDA.\n\nI. CASO EM EXAME\n1. O recurso. Agravo regimental interposto em habeas corpus, impugnando decisão monocrática que denegou a ordem e revogou liminar, em ação penal que apura, em tese, corrupção passiva majorada (art. 317, caput e § 1º, c/c arts. 29 e 71 do Código Penal), com denúncia lastreada em dados telemáticos extraídos, em processo diverso e sem a participação do paciente, de aparelho celular de corréu.\n2. Fato relevante. Em decisão colegiada, foi determinada nova perícia com a possibilidade de apresentação de quesitos pelas partes. O Laudo Pericial n. 18.500/2023 registrou, no entanto, bloqueio por senha no dispositivo, inviabilizando nova extração do conteúdo. Consta divergência documental quanto à conservação do vestígio: laudo anterior registrou devolução em sacola lacrada com número específico, enquanto o novo exame encontrou apenas fita adesiva e grampeamento, sem lacre formal.\n3. As decisões anteriores. Órgão julgador estadual rejeitou nulidade por suposta quebra da cadeia de custódia, sob fundamento de licitude da extração originária (mandado judicial, peritos oficiais e certificação por hash). Na via do habeas corpus, decisão monocrática entendeu inexistente adulteração efetiva e reputou eventual falha superveniente insuficiente para contaminar a prova, apontando acervo probatório autônomo. A defesa agravou buscando reconhecer a inadmissibilidade ou, sucessivamente, a imprestabilidade da prova digital e o cerceamento de defesa pelo impedimento de contraprova técnica.\n\nII. QUESTÃO EM DISCUSSÃO\n4. Há duas questões em discussão: (i) saber se a impossibilidade de repetição da perícia, decorrente do aparecimento de senha no aparelho durante a custódia estatal e da ausência de lacre formal, justifica o reconhecimento de quebra da cadeia de custódia e a consequente imprestabilidade da prova digital para a ação penal em curso; e (ii) saber se a impossibilidade de nova extração impõe ao Estado o ônus de afirmar e demonstrar a integralidade, identidade e confiabilidade da prova, afastando a presunção de veracidade quando descumpridos procedimentos de conservação do vestígio.\n\nIII. RAZÕES DE DECIDIR\n5. A superveniência de bloqueio por senha enquanto o aparelho permaneceu sob custódia estatal e a ausência de lacre formal rompem a mesmidade do vestígio, geram desconfiança epistêmica e comprometem a autenticidade e a comparabilidade do conteúdo, inviabilizando o contraditório técnico na reprodução da prova.\n6. A conservação do corpo de delito é dever estatal contínuo; a divergência documental entre o lacre certificado no laudo originário e o estado do aparelho no novo exame evidencia inobservância da preservação adequada, o que afasta a confiabilidade da prova digital para fins de persecução penal contra terceiro não participante da relação processual originária.\n7. Diante da irrepetibilid
