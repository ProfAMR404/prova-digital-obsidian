sua geração e a sua coleta ou preservação, em razão de sobrescrição de dados, atualizações de sistema ou exclusão por rotina de armazenamento."},{"t":"Endereço IP","d":"Número que identifica o terminal na internet, registrado no momento da conexão ou do uso de uma aplicação."},{"t":"ERB [estação rádio base]","d":"Antena de telefonia móvel instalada em torre, prédio ou poste, que atende os aparelhos em uma área ao redor e gera o registro técnico da conexão, pelo qual se situa o terminal."},{"t":"Espaço livre","d":"Área do volume marcada como disponível para gravação que retém dados de arquivos apagados."},{"t":"Espelhamento de WhatsApp Web","d":"Técnica de acesso a conversas por meio da sessão web vinculada ao aparelho, que permite o envio e a exclusão de mensagens sem rastro verificável. Distingue-se da duplicação forense de mídia [ver Imagem forense]."},{"t":"Exportação de chat [WhatsApp]","d":"Recurso nativo do WhatsApp que gera um arquivo .txt [sem mídia] ou .zip [com mídia] com o histórico de mensagens de uma conversa, distinto da extração forense de dispositivo e do espelhamento de sessão."},{"t":"Fistel","d":"Número de registro da estação na Anatel [Fundo de Fiscalização das Telecomunicações], que identifica a outorga e serve à conferência da autenticidade do dado."},{"t":"Geolocalização","d":"Determinação da posição de um dispositivo, aproximada quando obtida por ERB e métrica quando obtida por GPS."},{"t":"Geotag","d":"Metadado que registra a localização geográfica [coordenadas] em que um arquivo digital, como fotografia ou vídeo, foi criado, normalmente gerado automaticamente pelo dispositivo de captura."},{"t":"GPS","d":"Sistema de posicionamento por satélite, com coordenadas de erro reduzido, distinto do dado de ERB."},{"t":"Guarda cautelar","d":"Conservação dos registros por prazo superior ao legal, requerida pela autoridade ao provedor antes da ordem judicial de acesso."},{"t":"Handover","d":"Troca automática de uma célula para outra enquanto o aparelho se desloca ou a rede se reorganiza."},{"t":"Hash [função hash; código hash]","d":"Valor de tamanho fixo [resumo criptográfico] calculado por função criptográfica sobre arquivo, conjunto de dados, mídia ou imagem forense: sequência alfanumérica única que funciona como impressão digital do conteúdo. Qualquer alteração no conteúdo produz hash diferente, o que permite verificar a integridade e a mesmidade do material ao longo da cadeia de custódia. O algoritmo que gera o valor é a função hash."},{"t":"Hash de eliminação","d":"Base de somas de verificação dos arquivos do sistema instalado, usada para excluir da análise os arquivos conhecidos."},{"t":"Hiberfil.sys e Pagefile.sys","d":"Arquivos do Windows que armazenam o conteúdo da memória durante a hibernação e a paginação."},{"t":"IA explicável [XAI]","d":"Sistema que dá resultado e mostra o raciocínio, de forma conferível."},{"t":"Imagem forense [cópia espelhada; espelhamento; cópia bit a bit]","d":"Arquivo que reproduz, em cópia bit a bit, integral e verificável, o conteúdo da mídia ou do dispositivo de armazenamento, incluídos os espaços não alocados. O exame pericial recai sobre a cópia, preservado o original. Distingue-se do espelhamento de WhatsApp Web."},{"t":"IMEI","d":"Identificador do aparelho, que persiste à troca de chip."},{"t":"IMSI e SIM [chip]","d":"O IMSI identifica a linha e o SIM é o chip físico. O registro atesta aparelho e chip, e a identidade do portador depende de outra prova."},{"t":"Indexação","d":"Atribuição sistemática de palavras-chave e descritores para recuperação célere de dados."},{"t":"Interpretabilidade","d":"Propriedade do modelo cuja lógica se compreende pela própria estrutura, dispensada explicação externa."},{"t":"IOC","d":"Indicador de comprometimento: assinatura que identifica pacote ou domínio malicioso."},{"t":"Justificabilidade","d":"Atributo da evidência digital pelo qual o responsável demonstra a razão de cada método e de cada ação adotados no tratamento do vestígio."},{"t":"Lacre","d":"Dispositivo de segurança aplicado a um bem apreendido ou a um invólucro que o contém, destinado a evidenciar violação quando rompido, utilizado como mecanismo de controle da cadeia de custódia."},{"t":"Latitude e longitude","d":"Coordenadas geográficas de um ponto. No registro de ERB, as coordenadas localizam a antena."},{"t":"Laudo pericial","d":"Documento técnico produzido por perito, oficial ou nomeado, que registra a metodologia empregada, as etapas realizadas e as conclusões alcançadas no exame de um vestígio ou elemento probatório."},{"t":"Live Session","d":"Sessão de sistema operacional executada a partir de mídia removível, com a memória do computador como área de trabalho."},{"t":"Marco Civil da Internet","d":"Lei 12.965/2014, que disciplina a guarda e a entrega de registros por provedores mediante ordem judicial [arts. 22 e 23]."},{"t":"Mesmidade","d":"Identidade entre o vestígio coletado e o vestígio apresentado ao juiz: o vestígio ou a cópia de dados corresponde ao material originalmente coletado, sem acréscimo, subtração ou alteração. A correspondência é atestada por mecanismos técnicos, como o hash."},{"t":"Metadados","d":"[1] Acepção forense: conjunto de informações associadas a um arquivo digital que descrevem suas características e seu histórico [data e hora de criação, dispositivo de origem, geolocalização, histórico de modificações, software utilizado]. [2] Acepção de gestão documental: dado estruturado destinado a classificar, descrever e gerenciar documentos e processos nos sistemas informatizados."},{"t":"Metadados administrativos","d":"Metadados que informam como e quando o recurso foi criado e auxiliam a sua gestão [NISO Press, 2004]."},{"t":"Metadados descritivos","d":"Metadados que servem à descoberta e à identificação do recurso [NISO Press, 2004]."},{"t":"Metadados estruturais","d":"Metadados que indicam como objetos compostos se organizam [NISO Press, 2004]."},{"t":"$MFT","d":"Tabela mestra de arquivos do NTFS, que registra os arquivos e diretórios do volume."},{"t":"MIME","d":"Padrão de identificação de tipo de arquivo por assinatura de conteúdo."},{"t":"Minimização","d":"Coleta pelo mínimo necessário, com anonimização inicial e filtragem progressiva, que limita o alcance da busca reversa."},{"t":"Modo de navegação privada","d":"Função do navegador que suprime o armazenamento, no dispositivo, dos dados das ações de navegação do usuário, com os nomes Incognito, InPrivate e janela privada."},{"t":"Modo Persistente","d":"Modo de inicialização do PALADIN que usa um volume rotulado como writable ou casper-rw para guardar dados."},{"t":"NISTIR 8312","d":"Documento do NIST que define os 4 princípios da IA explicável."},{"t":"Perícia oficial","d":"Exame técnico realizado por órgão de criminalística vinculado ao Estado, dotado de fé pública quanto aos procedimentos adotados, distinto do exame realizado por assistente técnico da parte."},{"t":"Printscreen [captura de tela]","d":"Imagem estática obtida pela captura da tela de um dispositivo no momento da visualização de um conteúdo, desprovida, por si, de metadados que certifiquem a origem e a integridade do conteúdo capturado."},{"t":"Processamento client-side [local]","d":"Execução do código inteiramente no navegador do usuário, com o arquivo de entrada mantido no dispositivo, o que permite auditar a ferramenta pela leitura do código-fonte aberto."},{"t":"Programa XAI da DARPA","d":"Iniciativa dos Estados Unidos [2016 a 2021] que financiou pesquisas sobre explicabilidade."},{"t":"Provedor de aplicações de internet","d":"Pessoa jurídica que oferece aplicação de internet e mantém os registros de acesso dos usuários."},{"t":"RDC-Arq","d":"Repositório Arquivístico Digital Confiável estruturado para assegurar a preservação de dados e o acesso em longo prazo."},{"t":"Refine Volume Snapshot","d":"Processamento do X-Ways Forensics que descompacta e indexa o volume, ampliando o alcance da busca posterior."},{"t":"Registro de conexão","d":"“O conjunto de informações referentes à data e hora de início e término de uma conexão à internet, sua duração e o endereço IP utilizado pelo terminal para o envio e recebimento de pacotes de dados” [Lei 12.965/2014, art. 5º, VI]."},{"t":"Registros de acesso a aplicações de internet","d":"“O conjunto de informações referentes à data e hora de uso de uma determinada aplicação de internet a partir de um determinado endereço IP” [Lei 12.965/2014, art. 5º, VIII]."},{"t":"Repetibilidade","d":"Atributo da evidência digital pelo qual o mesmo procedimento, com os mesmos instrumentos e nas mesmas condições, produz o mesmo resultado."},{"t":"Reprodutibilidade","d":"Atributo da evidência digital pelo qual o mesmo procedimento, com instrumentos diversos e em condições diversas, produz o mesmo resultado."},{"t":"Secure Boot","d":"Recurso do firmware UEFI que verifica a assinatura do software de inicialização."},{"t":"Setor","d":"Face da antena que irradia em direção específica. Uma ERB costuma ter três setores."},{"t":"Sinal","d":"Posicionamento da estação de cobertura, setorização e intensidade de radiofrequência [CPP, art. 13-B, § 1º]."},{"t":"Stalkerware","d":"Aplicativo de monitoramento oculto instalado à revelia do titular do aparelho."},{"t":"Terminal","d":"Computador ou dispositivo que se conecta à internet [Lei 12.965/2014, art. 5º, II]."},{"t":"Triangulação","d":"Estimativa de posição a partir do sinal de várias antenas, que refina a área, permanece sujeita a erro e depende de dados da operadora."},{"t":"UFED [Universal Forensic Extraction Device]","d":"Ferramenta forense da Cellebrite utilizada para extração de dados de dispositivos móveis, cujos arquivos de saída típicos são o UFD, o UFDX e o UFDR; o módulo UFED Reader permite a visualização do conteúdo extraído sem necessidade da licença completa da ferramenta."},{"t":"Vazamento de sessão privada","d":"Presença, no dispositivo, de dados da sessão privada recuperáveis por meio de exame forense."},{"t":"Vestígio","d":"Objeto ou material bruto, visível ou latente, constatado ou recolhido, relacionado à infração penal [CPP, art. 158-A, § 3º]."},{"t":"Vestígio digital","d":"Elemento probatório em forma de dado, como o registro de ERB, sujeito à cadeia de custódia."},{"t":"Volatilidade","d":"Propriedade do dado digital que desaparece com o desligamento ou com o tempo e impõe ordem de coleta."},{"t":"XSS","d":"Falha que permite a execução de código no navegador de quem acessa a página."}],"base":[{"t":"POP Perícia Criminal 2024, Volume 2: Áudio e Imagem","d":"Procedimentos Operacionais Padrão de perícia criminal em áudio e imagem, publicados pelo Ministério da Justiça e Segurança Pública.","url":"https://www.gov.br/mj/pt-br/assuntos/sua-seguranca/seguranca-publica/analise-e-pesquisa/pop/pops-pericia-criminal-2024-audio-e-imagem-vol-2-pdf.pdf/view"},{"t":"POP Perícia Criminal 2024, Volume 5: Informática Forense","d":"Procedimentos Operacionais Padrão de perícia criminal em informática forense, publicados pelo Ministério da Justiça e Segurança Pública.","url":"https://www.gov.br/mj/pt-br/assuntos/sua-seguranca/seguranca-publica/analise-e-pesquisa/pop/pop-pericia-criminal-2024-informatica-forense-vol-5-pdf.pdf/view"},{"t":"POP Perícia Criminal 2024, Volume 6: Local de Crime","d":"Procedimentos Operacionais Padrão de perícia criminal em local de crime, publicados pelo Ministério da Justiça e Segurança Pública.","url":"https://www.gov.br/mj/pt-br/assuntos/sua-seguranca/seguranca-publica/analise-e-pesquisa/pop/pops-pericia-criminal-2024-local-de-crime-vol-6-pdf.pdf/view"},{"t":"ABNT NBR ISO/IEC 27037","d":"Diretrizes para identificação, coleta, aquisição e preservação de evidência digital. Norma citada nos julgados do Eixo 7.","url":""}],"normas":{"CPP, arts. 158-A a 158-F":"Art. 158-A. Considera-se cadeia de custódia o conjunto de todos os procedimentos utilizados para manter e documentar a história cronológica do vestígio coletado em locais ou em vítimas de crimes, para rastrear sua posse e manuseio a partir de seu reconhecimento até o descarte. (Incluído pela Lei nº 13.964, de 2019)\n§ 1º O início da cadeia de custódia dá-se com a preservação do local de crime ou com procedimentos policiais ou periciais nos quais seja detectada a existência de vestígio. (Incluído pela Lei nº 13.964, de 2019)\n§ 2º O agente público que reconhecer um elemento como de potencial interesse para a produção da prova pericial fica responsável por sua preservação. (Incluído pela Lei nº 13.964, de 2019)\n§ 3º Vestígio é todo objeto ou material bruto, visível ou latente, constatado ou recolhido, que se relaciona à infração penal. (Incluído pela Lei nº 13.964, de 2019)\n\nArt. 158-B. A cadeia de custódia compreende o rastreamento do vestígio nas seguintes etapas: (Incluído pela Lei nº 13.964, de 2019)\nI - reconhecimento: ato de distinguir um elemento como de potencial interesse para a produção da prova pericial; (Incluído pela Lei nº 13.964, de 2019)\nII - isolamento: ato de evitar que se altere o estado das coisas, devendo isolar e preservar o ambiente imediato, mediato e relacionado aos vestígios e local de crime; (Incluído pela Lei nº 13.964, de 2019)\nIII - fixação: descrição detalhada do vestígio conforme se encontra no local de crime ou no corpo de delito, e a sua posição na área de exames, podendo ser ilustrada por fotografias, filmagens ou croqui, sendo indispensável a sua descrição no laudo pericial produzido pelo perito responsável pelo atendimento; (Incluído pela Lei nº 13.964, de 2019)\nIV - coleta: ato de recolher o vestígio que será submetido à análise pericial, respeitando suas características e natureza; (Incluído pela Lei nº 13.964, de 2019)\nV - acondicionamento: procedimento por meio do qual cada vestígio coletado é embalado de forma individualizada, de acordo com suas características físicas, químicas e biológicas, para posterior análise, com anotação da data, hora e nome de quem realizou a coleta e o acondicionamento; (Incluído pela Lei nº 13.964, de 2019)\nVI - transporte: ato de transferir o vestígio de um local para o outro, utilizando as condições adequadas (embalagens, veículos, temperatura, entre outras), de modo a garantir a manutenção de suas características originais, bem como o controle de sua posse; (Incluído pela Lei nº 13.964, de 2019)\nVII - recebimento: ato formal de transferência da posse do vestígio, que deve ser documentado com, no mínimo, informações referentes ao número de procedimento e unidade de polícia judiciária relacionada, local de origem, nome de quem transportou o vestígio, código de rastreamento, natureza do exame, tipo do vestígio, protocolo, assinatura e identificação de quem o recebeu; (Incluído pela Lei nº 13.964, de 2019)\nVIII - processamento: exame pericial em si, manipulação do vestígio de acordo com a metodologia adequada às suas características biológicas, físicas e químicas, a fim de se obter o resultado desejado, que deverá ser formalizado em laudo produzido por perito; (Incluído pela Lei nº 13.964, de 2019)\nIX - armazenamento: procedimento referente à guarda, em condições adequadas, do material a ser processado, guardado para realização de contraperícia, descartado ou transportado, com vinculação ao número do laudo correspondente; (Incluído pela Lei nº 13.964, de 2019)\nX - descarte: procedimento referente à liberação do vestígio, respeitando a legislação vigente e, quando pertinente, mediante autorização judicial. (Incluído pela Lei nº 13.964, de 2019)\n\nArt. 158-C. A coleta dos vestígios deverá ser realizada preferencialmente por perito oficial, que dará o encaminhamento necessário para a central de custódia, mesmo quando for necessária a realização de exames complementares. (Incluído pela Lei nº 13.964, de 2019)\n§ 1º Todos vestígios coletados no decurso do inquérito ou processo devem ser tratados como descrito nesta Lei, ficando órgão central de perícia oficial de natureza criminal responsável por detalhar a forma do seu cumprimento. (Incluído pela Lei nº 13.964, de 2019)\n§ 2º É proibida a entrada em locais isolados bem como a remoção de quaisquer vestígios de locais de crime antes da liberação por parte do perito responsável, sendo tipificada como fraude processual a sua realização. (Incluído pela Lei nº 13.964, de 2019)\n\nArt. 158-D. O recipiente para acondicionamento do vestígio será determinado pela natureza do material. (Incluído pela Lei nº 13.964, de 2019)\n§ 1º Todos os recipientes deverão ser selados com lacres, com numeração individualizada, de forma a garantir a inviolabilidade e a idoneidade do vestígio durante o transporte. (Incluído pela Lei nº 13.964, de 2019)\n§ 2º O recipiente deverá individualizar o vestígio, preservar suas características, impedir contaminação e vazamento, ter grau de resistência adequado e espaço para registro de informações sobre seu conteúdo. (Incluído pela Lei nº 13.964, de 2019)\n§ 3º O recipiente só poderá ser aberto pelo perito que vai proceder à análise e, motivadamente, por pessoa autorizada. (Incluído pela Lei nº 13.964, de 2019)\n§ 4º Após cada rompimento de lacre, deve se fazer constar na ficha de acompanhamento de vestígio o nome e a matrícula do responsável, a data, o local, a finalidade, bem como as informações referentes ao novo lacre utilizado. (Incluído pela Lei nº 13.964, de 2019)\n§ 5º O lacre rompido deverá ser acondicionado no interior do novo recipiente. (Incluído pela Lei nº 13.964, de 2019)\n\nArt. 158-E. Todos os Institutos de Criminalística deverão ter uma central de custódia destinada à guarda e controle dos vestígios, e sua gestão deve ser vinculada diretamente ao órgão central de perícia oficial de natureza criminal. (Incluído pela Lei nº 13.964, de 2019)\n§ 1º Toda central de custódia deve possuir os serviços de protocolo, com local para conferência, recepção, devolução de materiais e documentos, possibilitando a seleção, a classificação e a distribuição de materiais, devendo ser um espaço seguro e apresentar condições ambientais que não interfiram nas características do vestígio. (Incluído pela Lei nº 13.964, de 2019)\n§ 2º Na central de custódia, a entrada e a saída de vestígio deverão ser protocoladas, consignando-se informações sobre a ocorrência no inquérito que a eles se relacionam. (Incluído pela Lei nº 13.964, de 2019)\n§ 3º Todas as pessoas que tiverem acesso ao vestígio armazenado deverão ser identificadas e deverão ser registradas a data e a hora do acesso. (Incluído pela Lei nº 13.964, de 2019)\n§ 4º Por ocasião da tramitação do vestígio armazenado, todas as ações deverão ser registradas, consignando-se a identificação do responsável pela tramitação, a destinação, a data e horário da ação. (Incluído pela Lei nº 13.964, de 2019)\n\nArt. 158-F. Após a realização da perícia, o material deverá ser devolvido à central de custódia, devendo nela permanecer. (Incluído pela Lei nº 13.964, de 2019)\nParágrafo único. Caso a central de custódia não possua espaço ou condições de armazenar determinado material, deverá a autoridade policial ou judiciária determinar as condições de depósito do referido material em local diverso, mediante requerimento do diretor do órgão central de perícia oficial de natureza criminal. (Incluído pela Lei nº 13.964, de 2019)","CPP, art. 155":"Art. 155. O juiz formará sua convicção pela livre apreciação da prova produzida em contraditório judicial, não podendo fundamentar sua decisão exclusivamente nos elementos informativos colhidos na investigação, ressalvadas as provas cautelares, não repetíveis e antecipadas. (Redação dada pela Lei nº 11.690, de 2008)\nParágrafo único. Somente quanto ao estado das pessoas serão observadas as restrições estabelecidas na lei civil. (Incluído pela Lei nº 11.690, de 2008)","CPP, art. 157":"Art. 157. São inadmissíveis, devendo ser desentranhadas do processo, as provas ilícitas, assim entendidas as obtidas em violação a normas constitucionais ou legais. (Redação dada pela Lei nº 11.690, de 2008)\n§ 1 o São também inadmissíveis as provas derivadas das ilícitas, salvo quando não evidenciado o nexo de causalidade entre umas e outras, ou quando as derivadas puderem ser obtidas por uma fonte independente das primeiras. (Incluído pela Lei nº 11.690, de 2008)\n§ 2 o Considera-se fonte independente aquela que por si só, seguindo os trâmites típicos e de praxe, próprios da investigação ou instrução criminal, seria capaz de conduzir ao fato objeto da prova. (Incluído pela Lei nº 11.690, de 2008)\n§ 3 o Preclusa a decisão de desentranhamento da prova declarada inadmissível, esta será inutilizada por decisão judicial, facultado às partes acompanhar o incidente. (Incluído pela Lei nº 11.690, de 2008)\n§ 4 o (VETADO) (Incluído pela Lei nº 11.690, de 2008)\n§ 5º O juiz que conhecer do conteúdo da prova declarada inadmissível não poderá proferir a sentença ou acórdão. (Incluído pela Lei nº 13.964, de 2019) (Vide ADI 6.300 )","CPP, art. 158":"Art. 158. Quando a infração deixar vestígios, será indispensável o exame de corpo de delito, direto ou indireto, não podendo supri-lo a confissão do acusado.\nParágrafo único. Dar-se-á prioridade à realização do exame de corpo de delito quando se tratar de crime que envolva: (Incluído dada pela Lei nº 13.721, de 2018)\nI - violência doméstica e familiar contra mulher; (Incluído dada pela Lei nº 13.721, de 2018)\nII - violência contra criança, adolescente, idoso ou pessoa com deficiência. (Incluído dada pela Lei nº 13.721, de 2018)","CPP, art. 159":"Art. 159. O exame de corpo de delito e outras perícias serão realizados por perito oficial, portador de diploma de curso superior. (Redação dada pela Lei nº 11.690, de 2008)\n§ 1 o Na falta de perito oficial, o exame será realizado por 2 (duas) pessoas idôneas, portadoras de diploma de curso superior preferencialmente na área específica, dentre as que tiverem habilitação técnica relacionada com a natureza do exame. (Redação dada pela Lei nº 11.690, de 2008)\n§ 2 o Os peritos não oficiais prestarão o compromisso de bem e fielmente desempenhar o encargo. (Redação dada pela Lei nº 11.690, de 2008)\n§ 3 o Serão facultadas ao Ministério Público, ao assistente de acusação, ao ofendido, ao querelante e ao acusado a formulação de quesitos e indicação de assistente técnico. (Incluído pela Lei nº 11.690, de 2008)\n§ 4 o O assistente técnico atuará a partir de sua admissão pelo juiz e após a conclusão dos exames e elaboração do laudo pelos peritos oficiais, sendo as partes intimadas desta decisão. (Incluído pela Lei nº 11.690, de 2008)\n§ 5 o Durante o curso do processo judicial, é permitido às partes, quanto à perícia: (Incluído pela Lei nº 11.690, de 2008)\nI – requerer a oitiva dos peritos para esclarecerem a prova ou para responderem a quesitos, desde que o mandado de intimação e os quesitos ou questões a serem esclarecidas sejam encaminhados com antecedência mínima de 10 (dez) dias, podendo apresentar as respostas em laudo complementar; (Incluído pela Lei nº 11.690, de 2008)\nII – indicar assistentes técnicos que poderão apresentar pareceres em prazo a ser fixado pelo juiz ou ser inquiridos em audiência. (Incluído pela Lei nº 11.690, de 2008)\n§ 6 o Havendo requerimento das partes, o material probatório que serviu de base à perícia será disponibilizado no ambiente do órgão oficial, que manterá sempre sua guarda, e na presença de perito oficial, para exame pelos assistentes, salvo se for impossível a sua conservação. (Incluído pela Lei nº 11.690, de 2008)\n§ 7 o Tratando-se de perícia complexa que abranja mais de uma área de conhecimento especializado, poder-se-á designar a atuação de mais de um perito oficial, e a parte indicar mais de um assistente técnico. (Incluído pela Lei nº 11.690, de 2008)","CPP, art. 386":"Art. 386. O juiz absolverá o réu, mencionando a causa na parte dispositiva, desde que reconheça:\nI - estar provada a inexistência do fato;\nII - não haver prova da existência do fato;\nIII - não constituir o fato infração penal;\nIV – estar provado que o réu não concorreu para a infração penal; (Redação dada pela Lei nº 11.690, de 2008)\nV – não existir prova de ter o réu concorrido para a infração penal; (Redação dada pela Lei nº 11.690, de 2008)\nVI – existirem circunstâncias que excluam o crime ou isentem o réu de pena ( arts. 20, 21, 22, 23 , 26 e § 1º do art. 28, todos do Código Penal) , ou mesmo se houver fundada dúvida sobre sua existência; (Redação dada pela Lei nº 11.690, de 2008)\nVII – não existir prova suficiente para a condenação. (Incluído pela Lei nº 11.690, de 2008)\nParágrafo único. Na sentença absolutória, o juiz:\nI - mandará, se for o caso, pôr o réu em liberdade;\nII – ordenará a cessação das medidas cautelares e provisoriamente aplicadas; (Redação dada pela Lei nº 11.690, de 2008)\nIII - aplicará medida de segurança, se cabível.","CPP, art. 400":"Art. 400. Na audiência de instrução e julgamento, a ser realizada no prazo máximo de 60 (sessenta) dias, proceder-se-á à tomada de declarações do ofendido, à inquirição das testemunhas arroladas pela acusação e pela defesa, nesta ordem, ressalvado o disposto no art. 222 deste Código , bem como aos esclarecimentos dos peritos, às acareações e ao reconhecimento de pessoas e coisas, interrogando-se, em seguida, o acusado. (Redação dada pela Lei nº 11.719, de 2008).\n§ 1 o As provas serão produzidas numa só audiência, podendo o juiz indeferir as consideradas irrelevantes, impertinentes ou protelatórias. (Incluído pela Lei nº 11.719, de 2008).\n§ 2 o Os esclarecimentos dos peritos dependerão de prévio requerimento das partes. (Incluído pela Lei nº 11.719, de 2008).","CPP, art. 563":"Art. 563. Nenhum ato será declarado nulo, se da nulidade não resultar prejuízo para a acusação ou para a defesa.","CPP, art. 565":"Art. 565. Nenhuma das partes poderá argüir nulidade a que haja dado causa, ou para que tenha concorrido, ou referente a formalidade cuja observância só à parte contrária interesse.","CPP, art. 619":"Art. 619. Aos acórdãos proferidos pelos Tribunais de Apelação, câmaras ou turmas, poderão ser opostos embargos de declaração, no prazo de dois dias contados da sua publicação, quando houver na sentença ambiguidade, obscuridade, contradição ou omissão.","Súmula 7/STJ":"A pretensão de simples reexame de prova não enseja recurso especial. (SÚMULA 7, CORTE ESPECIAL, julgado em 28/06/1990, DJ 03/07/1990, p. 6478)","Súmula 83/STJ":"Não se conhece do recurso especial pela divergência, quando a orientação do Tribunal se firmou no mesmo sentido da decisão recorrida. (SÚMULA 83, CORTE ESPECIAL, julgado em 18/06/1993, DJ 02/07/1993, p. 13283)","Súmula 182/STJ":"É inviável o agravo do art. 545 do CPC que deixa de atacar especificamente os fundamentos da decisão agravada. (SÚMULA 182, CORTE ESPECIAL, julgado em 05/02/1997, DJ 17/02/1997, p. 2231)","Súmula Vinculante 14":"É direito do defensor, no interesse do representado, ter acesso amplo aos elementos de prova que, já documentados em procedimento investigatório realizado por órgão com competência de polícia judiciária, digam respeito ao exercício do direito de defesa."}}</script>
<script id="app">function trat(j) { return j.conv ? (/Convocada/.test(j.conv) ? "Desa. " : "Des. ") : "Min. "; }
(function () {
"use strict";
var SKEL = '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>';
var $ = function (id) { return document.getElementById(id); };
var tpl = $("shell");
$("root").appendChild(tpl.content.cloneNode(true));
var PUBLISHED = $("state").textContent;
var S = JSON.parse(PUBLISHED);
var editing = false, dirty = false, graph = null, graphStale = true;

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function uid(p) { return p + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36); }

/* ---------- Ordenação, numeração e agrupamento ---------- */
function ordered() {
  var out = [];
  S.eixos.forEach(function (e) { S.julgados.forEach(function (j) { if (j.eixo === e.id) out.push(j); }); });
  S.julgados.forEach(function (j) { if (!S.eixos.some(function (e) { return e.id === j.eixo; })) out.push(j); });
  return out;
}
function numbers() { var m = {}; ordered().forEach(function (j, i) { m[j.id] = i + 1; }); return m; }
function orgLabel(j) { return [j.trib, j.orgao].filter(Boolean).join(" · "); }
function groups(list) {
  var byG = list.some(function (j) { return j.grupo; });
  if (!byG && list.length <= 12) return [{ label: "", items: list }];
  var g = [], idx = {};
  list.forEach(function (j) { var k = byG ? (j.grupo || "Demais Julgados") : orgLabel(j); if (!(k in idx)) { idx[k] = g.length; g.push({ label: k, items: [] }); } g[idx[k]].items.push(j); });
  return g;
}
function citShort(j) {
  var p = [j.trib, j.classe];
  if (j.rel) p.push(trat(j) + j.rel + (j.conv ? " [" + j.conv + "]" : ""));
  if (j.orgao) p.push(j.orgao);
  if (j.data) p.push("j. " + j.data);
  return p.filter(Boolean).join(", ");
}
function verbete(j) {
  var ls = (j.ementa || "").split("\n");
  for (var i = 0; i < ls.length; i++) { var t = ls[i].trim(); if (t && t.toUpperCase() !== "EMENTA") return t; }
  return "";
}

/* ---------- Entidades nomeadas extraídas do texto das ementas ---------- */
var PL = "https://www.planalto.gov.br/ccivil_03/";
var CPPU = PL + "decreto-lei/del3689.htm", CRU = PL + "constituicao/constituicao.htm", STJS = "https://scon.stj.jus.br/SCON/sumstj/";
function cpp(n) { return new RegExp("(?:CPP|Código de Processo Penal)[^.;\\n]{0,60}?\\b" + n + "\\b(?!-)|\\b" + n + "\\b(?!-)[^.;\\n]{0,80}?(?:CPP|Código de Processo Penal)"); }
var DISP = [
  ["CPP, arts. 158-A a 158-F", /158-[A-F]/, CPPU],
  ["CPP, art. 155", cpp(155), CPPU], ["CPP, art. 157", cpp(157), CPPU], ["CPP, art. 158", cpp(158), CPPU], ["CPP, art. 159", cpp(159), CPPU],
  ["CPP, art. 386", cpp(386), CPPU], ["CPP, art. 400", cpp(400), CPPU],
  ["CPP, art. 563", new RegExp(cpp(563).source + "|pas de nullit", "i"), CPPU], ["CPP, art. 565", cpp(565), CPPU], ["CPP, art. 619", cpp(619), CPPU],
  ["CR, art. 5º, XII", /5º,\s*(?:inciso\s*)?XII\b/, CRU], ["CR, art. 5º, LIV", /5º,\s*(?:inciso\s*)?LIV\b/, CRU], ["CR, art. 5º, LVI", /5º,\s*(?:inciso\s*)?LVI\b/, CRU],
  ["Lei 13.964/2019", /13\.964/, PL + "_ato2019-2022/2019/lei/l13964.htm"],
  ["Lei 12.965/2014", /12\.965/, PL + "_ato2011-2014/2014/lei/l12965.htm"],
  ["Lei 12.850/2013", /12\.850/, PL + "_ato2011-2014/2013/lei/l12850.htm"],
  ["Lei 11.340/2006", /11\.340/, PL + "_ato2004-2006/2006/lei/l11340.htm"],
  ["Súmula 7/STJ", /Súmulas?\s*(?:n\.?º?\s*)?7\b/, STJS + "toc.jsp?livre=%277%27.num.&O=JT"],
  ["Súmula 83/STJ", /Súmulas?\s*(?:n\.?º?\s*)?(?:7\s*e\s*)?83\b/, STJS + "toc.jsp?livre=%2783%27.num.&O=JT"],
  ["Súmula 182/STJ", /Súmulas?\s*(?:n\.?º?\s*)?(?:7\s*e\s*)?182\b/, STJS + "toc.jsp?livre=%27182%27.num.&O=JT"],
  ["Súmula Vinculante 14", /Súmula Vinculante\s*(?:n\.?º?\s*)?14\b/, "https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=26&sumula=1230"],
  ["ABNT NBR ISO/IEC 27037", /27037|ABNT/, ""]
];
var CONC = [
  ["Hash", /\bhash/i], ["Mesmidade", /mesmidade/i], ["Metadados", /metadados/i], ["Capturas de Tela [Prints]", /prints?\b|printscreen|capturas? de tela/i],
  ["WhatsApp", /whatsapp/i], ["Cellebrite [UFED]", /cellebrite|\bUFED|\bUFDR/i], ["Espelhamento", /espelha/i], ["Lacre", /\blacr/i],
  ["Frutos da Árvore Envenenada", /árvore envenenada|por derivação/i], ["Fishing Expedition", /fishing/i],
  ["Ônus do Estado", /ônus d[oe] Estado|ônus estatal|incumb\w+ ao Estado|Estado tem o ônus|recai sobre o Estado/i],
  ["Auditabilidade", /auditab/i], ["Encontro Fortuito", /fortuit/i], ["Acesso da Defesa", /acesso (?:da defesa|integral|às mídias|aos elementos)|Súmula Vinculante/i]
];
var PREC = /((?:(?:AgRg|EDcl|AgInt|RCD)\s+n[oa]s?\s+)*(?:HC|RHC|REsp|AREsp|EAREsp|EREsp|ARE|RE|Inq|APn|RMS|ADI|Rcl))\s*(?:n\.?º?\s*)?(\d{1,3}(?:\.\d{3})+|\d{4,7})\s*\/\s*([A-Z]{2})\b/g;
function pkey(cls, num, uf) { return (cls.replace(/\s+/g, " ").trim() + " " + num.replace(/\./g, "") + "/" + uf).toLowerCase(); }
function plabel(cls, num, uf) { var n = String(parseInt(num.replace(/\./g, ""), 10)).replace(/\B(?=(\d{3})+(?!\d))/g, "."); return cls.replace(/\s+/g, " ").trim() + " " + n + "/" + uf; }
function ownKey(j) { PREC.lastIndex = 0; var m = PREC.exec(j.classe || ""); return m ? pkey(m[1], m[2], m[3]) : ""; }
function ents(j) {
  var t = j.ementa || "", d = [], c = [], p = [], seen = {};
  DISP.forEach(function (x) { if (x[1].test(t)) d.push(x[0]); });
  CONC.forEach(function (x) { if (x[1].test(t)) c.push(x[0]); });
  var own = ownKey(j), m; PREC.lastIndex = 0;
  while ((m = PREC.exec(t))) { var k = pkey(m[1], m[2], m[3]); if (k !== own && !seen[k]) { seen[k] = 1; p.push({ key: k, label: plabel(m[1], m[2], m[3]) }); } }
  return { d: d, c: c, p: p };
}

/* ---------- Cabeçalho ---------- */
function renderMeta() {
  $("m-kicker").textContent = S.meta.kicker; $("m-titulo").textContent = S.meta.titulo;
  $("m-lead").textContent = S.meta.lead; $("m-fonte").textContent = S.meta.fonte;
  var ds = S.julgados.map(function (x) { var p = (x.data || "").split("/"); return p.length === 3 ? p[2] + p[1] + p[0] : ""; }).filter(Boolean).sort();
  function fd(k) { return k.slice(4, 6) + "/" + k.slice(0, 4); }
  var nd = {}; S.julgados.forEach(function (x) { ents(x).d.forEach(function (d) { nd[d] = 1; }); });
  function st(v, l, w) { return '<div' + (w ? ' class="wide"' : "") + "><dd>" + esc(v) + "</dd><dt>" + esc(l) + "</dt></div>"; }
  $("m-stats").innerHTML = st(S.julgados.length, "julgados") + st(S.eixos.length, "eixos temáticos") + st(S.glossario.length, "termos no glossário") +
    st(S.julgados.filter(function (x) { return x.trib === "STJ"; }).length, "do STJ") + st(S.julgados.filter(function (x) { return x.trib === "STF"; }).length, "do STF") + st(Object.keys(nd).length, "dispositivos citados") +
    (ds.length ? st(fd(ds[0]) + " a " + fd(ds[ds.length - 1]), "período dos julgamentos", true) : "");
  document.body.classList.toggle("editing", editing);
  var f = $("meta-form");
  if (!editing) { f.innerHTML = ""; return; }
  f.innerHTML = '<div class="card"><div class="form">' +
    inp("Título", "m::titulo", S.meta.titulo) + inp("Sobretítulo", "m::kicker", S.meta.kicker) +
    txa("Apresentação", "m::lead", S.meta.lead) + txa("Fonte", "m::fonte", S.meta.fonte) + '</div></div>';
}
function inp(lbl, bind, v, cls) { return '<label class="' + (cls || "") + '">' + esc(lbl) + '<input data-bind="' + esc(bind) + '" value="' + esc(v) + '"></label>'; }
function txa(lbl, bind, v, big) { return '<label class="full">' + esc(lbl) + '<textarea data-bind="' + esc(bind) + '"' + (big ? ' class="big"' : "") + '>' + esc(v) + '</textarea></label>'; }

/* ---------- Sumário e cartões ---------- */
function renderEmentas() {
  var nums = numbers(), sum = [], out = [];
  var eixos = S.eixos.slice();
  var orphans = S.julgados.filter(function (j) { return !S.eixos.some(function (e) { return e.id === j.eixo; }); });
  eixos.forEach(function (e, i) {
    var list = S.julgados.filter(function (j) { return j.eixo === e.id; });
    var gs = groups(list), n = i + 1;
    var sub = "";
    if (gs.length > 1) sub = '<ol class="sum-sub">' + gs.map(function (g, k) {
      return '<li><button class="sum-link" data-goto="sub-' + e.id + "-" + k + '"><span class="sum-n">' + n + "." + (k + 1) + '</span><span class="sum-t">' + esc(g.label) + '</span><span class="sum-c">' + g.items.length + '</span></button></li>';
    }).join("") + "</ol>";
    var range = list.length ? " · itens " + nums[list[0].id] + (list.length > 1 ? " a " + nums[list[list.length - 1].id] : "") : "";
    sum.push('<li><button class="sum-link" data-goto="eixo-' + e.id + '"><span class="sum-n">' + n + '</span><span class="sum-t">' + esc(e.titulo) + '</span><span class="sum-c">' + list.length + (list.length === 1 ? " julgado" : " julgados") + '</span></button>' + sub + "</li>");
    out.push('<section class="eixo" data-eixo="' + e.id + '"><div class="eixo-head" id="eixo-' + e.id + '"><div class="eixo-num">Eixo ' + n + '</div>');
    if (editing) {
      out.push('<div class="form">' + inp("Título do eixo", "e:" + e.id + ":titulo", e.titulo) + txa("Descrição", "e:" + e.id + ":desc", e.desc) + '</div><div class="acts">' +
        '<button class="btn" data-act="e-up" data-id="' + e.id + '">Subir</button><button class="btn" data-act="e-down" data-id="' + e.id + '">Descer</button>' +
        '<button class="btn danger" data-act="e-del" data-id="' + e.id + '"' + (list.length ? ' disabled title="Mova ou exclua os julgados do eixo antes"' : "") + '>Excluir Eixo</button></div>');
    } else {
      out.push('<h2>' + esc(e.titulo) + '</h2><p class="eixo-desc">' + esc(e.desc) + (range ? '<span style="white-space:nowrap">' + esc(range) + "</span>" : "") + "</p>");
    }
    out.push("</div>");
    if (!list.length) out.push('<p class="vazio">Eixo sem julgados.</p>');
    gs.forEach(function (g, k) {
      if (g.label) out.push('<h3 class="sub-head" id="sub-' + e.id + "-" + k + '">' + n + "." + (k + 1) + " " + esc(g.label) + "<span>" + g.items.length + (g.items.length === 1 ? " julgado" : " julgados") + "</span></h3>");
      g.items.forEach(function (j) { out.push(card(j, nums[j.id])); });
    });
    out.push("</section>");
  });
  if (orphans.length) { out.push('<section class="eixo"><div class="eixo-head"><h2>Sem Eixo</h2></div>'); orphans.forEach(function (j) { out.push(card(j, nums[j.id])); }); out.push("</section>"); }
  $("sumario").innerHTML = sum.join("");
  $("cards").innerHTML = out.join("");
  filter();
}
function card(j, n) {
  if (editing) return cardForm(j, n);
  var meta = [];
  if (j.registro) meta.push("Registro " + j.registro);
  if (j.relac) meta.push("Rel. p/ acórdão Min. " + j.relac);
  if (j.dje) meta.push("Publicação " + j.dje);
  if (j.origem) meta.push(j.origem);
  return '<article class="card" id="c-' + j.id + '" data-id="' + j.id + '">' +
    '<div class="card-top"><span class="num">' + n + '</span><h3 class="cit">' + esc(citShort(j)) + "</h3></div>" +
    '<p class="meta">' + esc(meta.join(" · ")) + "</p>" +
    '<p class="verbete">' + esc(verbete(j)) + "</p>" +
    '<details class="em"><summary>Ementa completa [transcrição literal]</summary>' +
    '<blockquote class="ementa">“' + esc(j.ementa) + '”</blockquote>' +
    (j.cit ? '<p class="cit-par">' + esc(j.cit) + "</p>" : "") + "</details>" +
    '<div class="acts">' + (j.link ? '<a class="btn" href="' + esc(j.link) + '" target="_blank" rel="noopener">Inteiro Teor ↗</a>' : "") +
    '<button class="btn" data-act="copy" data-id="' + j.id + '">Copiar</button>' +
    '<button class="btn" data-act="graph" data-id="' + j.id + '">Ver no Grafo</button></div></article>';
}
function cardForm(j, n) {
  var b = "j:" + j.id + ":";
  var opts = S.eixos.map(function (e, i) { return '<option value="' + e.id + '"' + (e.id === j.eixo ? " selected" : "") + ">Eixo " + (i + 1) + " · " + esc(e.titulo) + "</option>"; }).join("");
  return '<article class="card" id="c-' + j.id + '" data-id="' + j.id + '"><div class="card-top"><span class="num">' + n + '</span><h3 class="cit">' + esc(citShort(j) || "Novo julgado") + '</h3></div><div class="form">' +
    '<label>Eixo<select data-bind="' + b + 'eixo" data-rerender="1">' + opts + "</select></label>" +
    '<label>Subgrupo do eixo<input data-bind="' + b + 'grupo" data-rerender="1" value="' + esc(j.grupo || "") + '"></label>' + inp("Tribunal", b + "trib", j.trib) + inp("Classe e número", b + "classe", j.classe) + inp("Registro", b + "registro", j.registro) +

  colors(); resize(); setData(data); loop();
  return {
    selectNode: selectNode, resize: function () { resize(); }, fit: fit, colors: colors, nodes: function () { return st.nodes; },
    zoom: function (f) { zoomAt(canvas.clientWidth / 2, canvas.clientHeight / 2, f); },
    setSearch: function (s) { st.search = s; },
    setLayer: function (l) {
      st.layer = l; if (l === "all") st.layerSet = null; else { var s = new Set(); st.nodes.forEach(function (n) { if (n.camada === l) { s.add(n.id); (st.adj[n.id] || []).forEach(function (v) { if (st.nodeById[v].tipo !== "Julgado" || st.nodeById[v].camada === l) s.add(v); }); } }); st.layerSet = s; }
      alpha = Math.max(alpha, 0.3); fit();
    },
    path: function (a, b) { var ps = paths(a, b); if (!ps.length) { st.pathNodes = null; st.pathEdges = null; return []; } var ns = new Set(), es = new Set(); ps.forEach(function (p) { p.forEach(function (id, i) { ns.add(id); if (i) es.add(p[i - 1] + "|" + id); }); }); st.pathNodes = ns; st.pathEdges = es; st.selected = null; opts.cardEl.hidden = true; return ps.map(function (p) { return p.map(function (id) { return st.nodeById[id].nome; }); }); },
    clearPath: function () { st.pathNodes = null; st.pathEdges = null; },
    destroy: function () { dead = true; if (raf) cancelAnimationFrame(raf); canvas.removeEventListener("pointerdown", down); canvas.removeEventListener("pointermove", move); canvas.removeEventListener("pointerup", up); canvas.removeEventListener("pointercancel", up); canvas.removeEventListener("wheel", wheel); window.removeEventListener("resize", resize); }
  };
}
function mountGraph() {
  if (graph && !graphStale) { graph.resize(); return; }
  if (graph) graph.destroy();
  graphStale = false;
  graph = Graph($("graph"), graphData(), { cardEl: $("g-card"), typesEl: $("g-types"), naturesEl: $("g-natures"), statsEl: $("g-stats") });
  var ns = graph.nodes().slice();
  $("g-layer").innerHTML = '<option value="all">Todos os eixos</option>' + S.eixos.map(function (e, i) { return '<option value="' + e.id + '">Eixo ' + (i + 1) + " · " + esc(e.titulo) + "</option>"; }).join("");
  var ord = Object.keys(TYPE_COLORS), byT = {};
  ns.forEach(function (n) { (byT[n.tipo] = byT[n.tipo] || []).push(n); });
  var optsH = '<option value="">Selecione</option>' + ord.filter(function (t) { return byT[t]; }).map(function (t) {
    var l = byT[t].slice().sort(function (a, b) { return t === "Julgado" ? a.num - b.num : a.nome.localeCompare(b.nome, "pt"); });
    return '<optgroup label="' + esc(TYPE_LABEL[t]) + '">' + l.map(function (n) { return '<option value="' + esc(n.id) + '">' + esc(n.nome) + "</option>"; }).join("") + "</optgroup>";
  }).join("");
  $("path-a").innerHTML = optsH; $("path-b").innerHTML = optsH; $("path-result").textContent = "";
  $("g-hubs").innerHTML = ns.filter(function (n) { return n.tipo !== "Julgado"; }).sort(function (a, b) { return b.deg - a.deg; }).slice(0, 12).map(function (n) {
    return '<tr><td style="white-space:normal"><button class="chip" data-node="' + esc(n.id) + '">' + esc(n.nome) + "</button></td><td>" + esc(TYPE_LABEL[n.tipo]) + "</td><td>" + n.deg + "</td></tr>";
  }).join("");
}

/* ---------- Edição direta e publicação ---------- */
function setPath(bind, val) {
  var p = bind.split(":"), k = p[0], id = p[1], f = p[2], o = null;
  if (k === "m") o = S.meta; else if (k === "j") o = S.julgados.find(function (x) { return x.id === id; });
  else if (k === "e") o = S.eixos.find(function (x) { return x.id === id; }); else if (k === "g") o = S.glossario[+id]; else if (k === "b") o = S.base[+id];
  if (o) { o[f] = val; markDirty(); }
}
function markDirty() { dirty = true; $("edit-msg").textContent = "Alterações pendentes. Salve para publicar a nova versão."; }
function setEditing(on) {
  editing = on; $("editbar").hidden = !on; $("btn-edit").textContent = on ? "Sair da Edição" : "Editar Painel";
  if (on) $("edit-msg").textContent = "Modo de edição. As alterações valem para todos os leitores depois de salvas.";
  renderAll();
}
function buildDocument() {
  var json = JSON.stringify(S).replace(/</g, "\\u003c");
  return SKEL + '\n<meta name="claude:viewport-fit-sides" content="cover">\n<title>Painel de Ementas Prova Digital</title>\n<style id="css">' + $("css").textContent + '</style>\n<div id="root"></div>\n<template id="shell">' + tpl.innerHTML + '</template>\n<script id="state" type="application/json">' + json + "</" + 'script>\n<script id="app">' + $("app").textContent + "</" + "script>\n</body></html>";
}
var art = null;
async function save() {
  if (!art) return;
  S.glossario = S.glossario.filter(function (g) { return (g.t || "").trim(); });
  var b = $("btn-save"); b.disabled = true; $("edit-msg").textContent = "Publicando nova versão.";
  try { await art.publish(buildDocument()); dirty = false; $("edit-msg").textContent = "Versão publicada."; }
  catch (e) {
    var c = e && e.code;
    if (c === "conflict") $("edit-msg").textContent = "Outra versão foi publicada antes. O painel recarrega com a versão vigente.";
    else if (c === "not_writer" || c === "not_granted" || c === "not_declared" || c === "consent_required") { $("edit-msg").textContent = "Visualização somente de leitura. A edição exige permissão de edição do artefato."; $("btn-edit").hidden = true; }
    else if (c === "too_large") $("edit-msg").textContent = "O painel excede o limite de tamanho. Reduza o conteúdo e salve de novo.";
    else if (c === "rate_limited") $("edit-msg").textContent = "Limite de publicações atingido. Aguarde e salve de novo.";
    else $("edit-msg").textContent = "A publicação falhou. Salve de novo em instantes.";
  }
  b.disabled = false;
}

/* ---------- Eventos ---------- */
document.addEventListener("input", function (e) {
  var t = e.target;
  if (t.id === "q") return filter();
  if (t.id === "g-q") { if (graph) graph.setSearch(t.value.trim().toLowerCase()); return; }
  if (t.dataset && t.dataset.bind) { setPath(t.dataset.bind, t.value); graphStale = true; }
});
document.addEventListener("change", function (e) {
  var t = e.target;
  if (t.id === "g-layer" && graph) graph.setLayer(t.value);
  if (t.dataset && t.dataset.rerender) { var id = t.closest(".card").dataset.id; renderEmentas(); var c = $("c-" + id); if (c) c.scrollIntoView({ block: "center" }); }
});
document.addEventListener("click", function (e) {
  var t = e.target.closest("button, a"); if (!t) return;
  if (t.classList.contains("tab")) return showTab(t.dataset.tab);
  if (t.dataset.goto) { var el = $(t.dataset.goto); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  if (t.dataset.gotoCard) return gotoCard(t.dataset.gotoCard);
  if (t.dataset.node) { if (graph) graph.selectNode(t.dataset.node, true); $("graph").scrollIntoView({ behavior: "smooth", block: "center" }); return; }
  var id = t.dataset.id, i;
  switch (t.dataset.act || t.id) {
    case "copy":
      var j = S.julgados.find(function (x) { return x.id === id; }); if (!j) return;
      var txt = "“" + j.ementa + "”\n\n" + (j.cit || citShort(j));
      var done = function () { t.textContent = "Copiado"; setTimeout(function () { t.textContent = "Copiar"; }, 1500); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done).catch(function () { var d = t.closest(".card").querySelector("details"); d.open = true; var r = document.createRange(); r.selectNodeContents(d); var s = getSelection(); s.removeAllRanges(); s.addRange(r); });
      return;
    case "graph": showTab("grafo"); if (graph) { graph.clearPath(); graph.selectNode("J:" + id, true); } $("graph").scrollIntoView({ behavior: "smooth", block: "center" }); return;
    case "btn-open": document.querySelectorAll("#cards details").forEach(function (d) { d.open = true; }); return;
    case "btn-close": document.querySelectorAll("#cards details").forEach(function (d) { d.open = false; }); return;
    case "btn-theme": var dk = document.documentElement.getAttribute("data-theme") === "dark"; document.documentElement.setAttribute("data-theme", dk ? "light" : "dark"); t.textContent = dk ? "Tema Escuro" : "Tema Claro"; try { localStorage.setItem("amr_painel_tema", dk ? "light" : "dark"); } catch (x) { } if (graph) graph.colors(); return;
    case "z-in": if (graph) graph.zoom(1.25); return;
    case "z-out": if (graph) graph.zoom(0.8); return;
    case "z-fit": if (graph) graph.fit(); return;
    case "path-go":
      var a = $("path-a").value, b = $("path-b").value; if (!graph || !a || !b || a === b) { $("path-result").textContent = "Selecione duas entidades distintas."; return; }
      var ps = graph.path(a, b); $("path-result").innerHTML = ps.length ? ps.map(function (p, k) { return "<div><b>Caminho " + (k + 1) + "</b> [" + (p.length - 1) + " passo(s)]: " + p.map(esc).join(" → ") + "</div>"; }).join("") : "Sem caminho entre as entidades."; return;
    case "path-clear": if (graph) graph.clearPath(); $("path-result").textContent = ""; return;
    case "btn-edit": if (editing && dirty) { $("edit-msg").textContent = "Há alterações pendentes. Use Salvar Alterações ou Descartar."; return; } return setEditing(!editing);
    case "btn-cancel": S = JSON.parse(PUBLISHED); dirty = false; return setEditing(false);
    case "btn-save": return save();
    case "btn-add-j":
      var nj = { id: uid("j"), eixo: S.eixos.length ? S.eixos[S.eixos.length - 1].id : "", trib: "STJ", classe: "", registro: "", rel: "", conv: "", relac: "", orgao: "", data: "", dje: "", ementa: "", cit: "", link: "", origem: "", grupo: "" };
      S.julgados.push(nj); markDirty(); showTab("ementas"); renderEmentas(); $("c-" + nj.id).scrollIntoView({ behavior: "smooth", block: "center" }); return;
    case "btn-add-e": var ne = { id: uid("e"), titulo: "Novo Eixo", desc: "" }; S.eixos.push(ne); markDirty(); showTab("ementas"); renderEmentas(); $("eixo-" + ne.id).scrollIntoView({ behavior: "smooth", block: "center" }); return;
    case "j-del": if (t.dataset.sure) { S.julgados = S.julgados.filter(function (x) { return x.id !== id; }); markDirty(); renderEmentas(); graphStale = true; } else { t.dataset.sure = "1"; t.textContent = "Confirmar Exclusão"; } return;
    case "e-del": S.eixos = S.eixos.filter(function (x) { return x.id !== id; }); markDirty(); renderEmentas(); return;
    case "e-up": case "e-down": i = S.eixos.findIndex(function (x) { return x.id === id; }); var k2 = i + (t.dataset.act === "e-up" ? -1 : 1); if (k2 < 0 || k2 >= S.eixos.length) return; var tmp = S.eixos[i]; S.eixos[i] = S.eixos[k2]; S.eixos[k2] = tmp; markDirty(); renderEmentas(); $("eixo-" + id).scrollIntoView({ block: "center" }); return;
    case "g-add": S.glossario.push({ t: "", d: "" }); markDirty(); renderGloss(); var cs = document.querySelectorAll("#gloss .card"); cs[cs.length - 1].scrollIntoView({ block: "center" }); return;
    case "g-del": S.glossario.splice(+id, 1); markDirty(); renderGloss(); return;
    case "b-add": S.base.push({ t: "", d: "", url: "" }); markDirty(); renderBase(); return;
    case "b-del": S.base.splice(+id, 1); markDirty(); renderBase(); return;
  }
});
window.addEventListener("hashchange", function () { showTab(location.hash.slice(1), true); });

/* ---------- Início ---------- */
try { var th = localStorage.getItem("amr_painel_tema"); if (th === "dark") { document.documentElement.setAttribute("data-theme", "dark"); $("btn-theme").textContent = "Tema Claro"; } } catch (x) { }
renderAll();
showTab(location.hash.slice(1) || "ementas", true);
if (window.claude && typeof window.claude.use === "function") {
  window.claude.use("artifact").then(function (a) {
    if (!a) return; art = a;
    return window.claude.use("user").then(function (u) { return u && u.canEdit ? u.canEdit() : true; }).catch(function () { return true; }).then(function (ok) { if (ok !== false) $("btn-edit").hidden = false; });
  }).catch(function () { });
}
})();
</script>
