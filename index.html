eração ou interferência indevida capaz de invalidá-la.\n2. A análise de teses que demandem revolvimento fático-probatório é inviável na via do habeas corpus e de seu recurso.\n3. É inviável o agravo regimental que não ataca especificamente os fundamentos da decisão agravada, conforme Súmula n. 182, STJ.\nDispositivos relevantes citados: CPP, arts. 158-A a 158-F; Súmula n. 182, STJ.\nJurisprudência relevante citada: STJ, HC 653.515/RJ, Rel. Min. Rogerio Schietti Cruz, Sexta Turma, DJe 01.02.2022; STJ, AgRg no RHC 147.885/SP, Rel. Min. Olindo Menezes, Sexta Turma, DJe 13.12.2021; STJ, AgRg no HC 832.832/GO, Rel. Min. Ribeiro Dantas, Quinta Turma, DJe 14.09.2023; STJ, AgRg no HC 819.499/SC, Rel. Min. Reynaldo Soares da Fonseca, Quinta Turma, DJe 29.09.2023; STJ, REsp 1.931.145/SP, Rel. Min. Sebastião Reis Júnior, Terceira Seção, DJe 24.06.2022.","cit":"(AgRg nos EDcl no HC n. 1.032.583/RS, relator Ministro Messod Azulay Neto, Quinta Turma, julgado em 29/10/2025, DJEN de 4/11/2025.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202503357572&dt_publicacao=04/11/2025","origem":"Pesquisa \"prova digital\" [posição 21]","grupo":"Exigência de Demonstração de Adulteração ou de Prejuízo"},{"id":"j501908178","eixo":"e11","trib":"STJ","classe":"AgRg no REsp 2.215.383/PR","registro":"2025/0190817-8","rel":"Carlos Cini Marchionatti","conv":"Desembargador Convocado do TJRS","relac":"","orgao":"5ª T.","data":"19/08/2025","dje":"25/08/2025","ementa":"PENAL E PROCESSUAL PENAL. AGRAVO REGIMENTAL NO RECURSO ESPECIAL. TRÁFICO INTERNACIONAL DE DROGAS E ASSOCIAÇÃO PARA O TRÁFICO. NULIDADE. PROVA DIGITAL. QUEBRA DA CADEIA DE CUSTÓDIA. ARTS. 158 E 158-A DO CPP. INOBSERVÂNCIA DE FORMALIDADES. AUSÊNCIA DE DEMONSTRAÇÃO DE PREJUÍZO CONCRETO OU INDÍCIOS DE ADULTERAÇÃO. JURISPRUDÊNCIA DO STJ. AGRAVO REGIMENTAL DESPROVIDO.\n\nI. Caso em exame\n1. Trata-se de agravo regimental interposto contra decisão monocrática que negou provimento a recurso especial. A decisão agravada manteve o acórdão do Tribunal Regional Federal da 4ª Região, que afastou a alegação de nulidade da prova obtida por meio da extração de dados de aparelho celular, supostamente viciada pela quebra da cadeia de custódia.\n\nII. Questão em discussão\n2. A controvérsia cinge-se em verificar se a alegada inobservância das formalidades previstas nos arts. 158 e 158-A do Código de Processo Penal, no que tange à cadeia de custódia de prova digital, é suficiente para, por si só, ensejar a nulidade da prova, independentemente da demonstração de prejuízo concreto ou de indícios de adulteração do material.\n\nIII. Razões de decidir\n3. Os argumentos expendidos no presente agravo regimental constituem mera reiteração das teses já apresentadas no recurso especial e devidamente rechaçadas pela decisão monocrática. A parte agravante não trouxe à colação qualquer elemento novo capaz de infirmar os fundamentos do julgado.\n4. A jurisprudência do Superior Tribunal de Justiça é pacífica no sentido de que eventuais irregularidades na cadeia de custódia da prova não acarretam, de forma automática, a sua nulidade. Para que a mácula seja reconhecida, é imprescindível que a defesa demonstre a ocorrência de prejuízo concreto (pas de nullité sans grief) e apresente indícios mínimos de que a prova foi adulterada, o que não ocorreu na espécie.\n5. No caso concreto, a extração dos dados do aparelho celular foi precedida de autorização judicial, formalizada em laudos técnicos elaborados por agentes públicos, e o material permaneceu à disposição das partes para eventual contraperícia. As alegações da defesa são genéricas e não apontam qualquer elemento concreto que sugira a manipulação ou a contaminação da prova, o que inviabiliza o reconhecimento da nulidade pretendida.\n\nIV. Dispositivo e tese de julgamento\n6. Agravo regimental desprovido.\n\nTese de julgamento: A alegação de quebra da cadeia de custódia da prova digital exige a demonstração de prejuízo concreto e de indícios específicos de adulteração dos elementos probatórios, não sendo suficiente a mera arguição de inobservância de formalidades procedimentais para infirmar a validade da prova, mormente quando o acesso aos dados foi precedido de autorização judicial e devidamente documentado.","cit":"(AgRg no REsp n. 2.215.383/PR, relator Ministro Carlos Cini Marchionatti (Desembargador Convocado TJRS), Quinta Turma, julgado em 19/8/2025, DJEN de 25/8/2025.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202501908178&dt_publicacao=25/08/2025","origem":"Pesquisa \"prova digital\" e \"quebra da cadeia de custódia\" [posição 10]","grupo":"Exigência de Demonstração de Adulteração ou de Prejuízo"},{"id":"j501357445","eixo":"e11","trib":"STJ","classe":"AgRg no HC 996.954/PR","registro":"2025/0135744-5","rel":"Reynaldo Soares da Fonseca","conv":"","relac":"","orgao":"5ª T.","data":"28/05/2025","dje":"02/06/2025","ementa":"AGRAVO REGIMENTAL NO HABEAS CORPUS. REVISÃO CRIMINAL. QUEBRA DA CADEIA DE CUSTÓDIA. PROVA DIGITAL. NULIDADE. AUSÊNCIA DE PREJUÍZO. OUTROS ELEMENTOS PROBATÓRIOS AUTÔNOMOS. IMPOSSIBILIDADE DE REVOLVIMENTO FÁTICO-PROBATÓRIO. AUSÊNCIA DE FLAGRANTE ILEGALIDADE. AGRAVO REGIMENTAL NÃO PROVIDO.\n1. A quebra da cadeia de custódia não acarreta nulidade automática da prova, devendo ser demonstrada a perda de confiabilidade e o prejuízo à defesa, nos termos do art. 563 do Código de Processo Penal.\n2. No caso concreto, a Corte local concluiu que não ficou comprovado qualquer indício de adulteração ou interferência indevida no conteúdo da prova digital apresentada, cuja apreensão e degravação foram realizadas por servidores públicos devidamente identificados, inclusive peritos ad hoc. Além disso, consignou que \"o acervo probatório conta com outros elementos, de modo que, ainda que reconhecida a ilegalidade deste elemento de prova em específico, tal circunstância não teria o condão de nulificar o processo, considerando a presença de outros independentes\".\n3. Conforme já decidiu esta Corte, \"a condenação, por si só, não é geradora de prejuízo, cabendo ao agente demonstrar que, caso não tivesse ocorrido a nulidade, acarretaria a absolvição criminal ou a desclassificação da conduta, hipótese não ocorrida nos autos\". (AgRg no AREsp n. 2.192.337/ES, relator Ministro Joel Ilan Paciornik, Quinta Turma, julgado em 8/8/2023, DJe de 15/8/2023.).\n4. O reexame do entendimento firmado pelas instâncias ordinárias encontra óbice na impossibilidade de revolvimento do conjunto fático-probatório, medida incompatível com a via do habeas corpus e de seu recurso ordinário.\n5. Agravo regimental não provido.","cit":"(AgRg no HC n. 996.954/PR, relator Ministro Reynaldo Soares da Fonseca, Quinta Turma, julgado em 28/5/2025, DJEN de 2/6/2025.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202501357445&dt_publicacao=02/06/2025","origem":"Pesquisa \"prova digital\" e \"quebra da cadeia de custódia\" [posição 11]","grupo":"Exigência de Demonstração de Adulteração ou de Prejuízo"},{"id":"j401750604","eixo":"e11","trib":"STJ","classe":"AgRg no AREsp 2.639.107/CE","registro":"2024/0175060-4","rel":"Og Fernandes","conv":"","relac":"","orgao":"6ª T.","data":"26/02/2025","dje":"10/03/2025","ementa":"PENAL E PROCESSO PENAL. AGRAVO REGIMENTAL NO AGRAVO EM RECURSO ESPECIAL. CADEIA DE CUSTÓDIA. PROVA DIGITAL. AUSÊNCIA DE INDICATIVOS DE ADULTERAÇÃO OU INTERFERÊNCIA NA PRODUÇÃO DA PROVA. OUTROS ELEMENTOS CAPAZES DE AMPARAR A CONDENAÇÃO. PRETENSÃO DE REVOLVIMENTO FÁTICO-PROBATÓRIO. INVIABILIDADE. SÚMULA 7/STJ. AGRAVO REGIMENTAL IMPROVIDO.\n1. Não se caracterizou a alegada quebra da cadeia de custódia, porquanto não há nos autos indicativos de que a prova foi adulterada ou de que houve interferência na sua produção.\n2. Existentes outros elementos de prova capazes de amparar a condenação do recorrente, nem mesmo o eventual vício probatório não teria aptidão para interferir na conclusão adotada pelas instâncias originárias.\n3. A modificação do julgado, nos moldes pretendidos pela defesa, demandaria amplo revolvimento fático-probatório, o que é vedado nesta via recursal, conforme o disposto na Súmula 7/STJ.\n4. Agravo regimental improvido.","cit":"(AgRg no AREsp n. 2.639.107/CE, relator Ministro Og Fernandes, Sexta Turma, julgado em 26/2/2025, DJEN de 10/3/2025.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202401750604&dt_publicacao=10/03/2025","origem":"Pesquisa \"prova digital\" [posição 37]","grupo":"Exigência de Demonstração de Adulteração ou de Prejuízo"},{"id":"j601134637","eixo":"e11","trib":"STJ","classe":"AgRg no HC 1.084.146/SP","registro":"2026/0113463-7","rel":"Og Fernandes","conv":"","relac":"","orgao":"6ª T.","data":"16/09/2026","dje":"21/09/2026","ementa":"DIREITO PENAL E PROCESSUAL PENAL. AGRAVO REGIMENTAL EM HABEAS CORPUS. INADEQUAÇÃO DO WRIT COMO SUBSTITUTIVO. PROVA DIGITAL. ALEGADA QUEBRA DA CADEIA DE CUSTÓDIA. AUSÊNCIA DE ILEGALIDADE FLAGRANTE. NECESSIDADE DE REVOLVIMENTO FÁTICO-PROBATÓRIO. INEXISTÊNCIA DE PREJUÍZO. CONDENAÇÃO FUNDADA EM OUTROS ELEMENTOS PROBATÓRIOS. RECURSO IMPROVIDO.\nI. CASO EM EXAME\n1. Agravo regimental interposto contra a decisão que não conheceu de habeas corpus, no qual se pleiteia o reconhecimento de nulidade de prova digital por suposta quebra da cadeia de custódia, com desentranhamento dos elementos probatórios, absolvição por erro de tipo essencial quanto à idade da vítima ou anulação/trancamento do processo.\nII. QUESTÃO EM DISCUSSÃO\n2. Há três questões em discussão: (i) definir se a alegada quebra da cadeia de custódia de prova digital configura ilegalidade flagrante apta a superar a inadequação do habeas corpus como substitutivo recursal; (ii) estabelecer se é possível o reconhecimento de nulidade e absolvição sem revolvimento do conjunto fático-probatório; e (iii) determinar se houve erro de tipo essencial quanto à idade da vítima.\nIII. RAZÕES DE DECIDIR\n3. O habeas corpus não pode ser utilizado como substitutivo de recurso próprio, salvo quando demonstrada flagrante ilegalidade, o que não se verifica no caso.\n4. O Tribunal de origem afastou a alegação de quebra da cadeia de custódia ao consignar a inexistência de indícios de adulteração da prova digital e a suficiência de outros elementos probatórios, especialmente da prova oral.\n5. A jurisprudência do STJ admite que eventuais irregularidades na cadeia de custódia sejam sopesadas com os demais elementos probatórios, não implicando nulidade automática.\n6. Não se declara nulidade processual sem demonstração de prejuízo concreto à defesa, nos termos do art. 563 do CPP.\n7. A condenação encontra amparo em prova oral consistente e harmônica, independentemente da prova digital impugnada.\n8. O Tribunal de origem reconhece que o réu tinha ciência da menoridade da vítima, com base em elementos probatórios idôneos, de modo que a pretensão absolutória por erro de tipo essencial quanto à idade da vítima demandaria reexame de provas, vedado na via cognitiva do habeas corpus.\nIV. DISPOSITIVO E TESE\n9. Agravo regimental improvido.","cit":"(AgRg no HC n. 1.084.146/SP, relator Ministro Og Fernandes, Sexta Turma, julgado em 16/9/2026, DJEN de 21/9/2026.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202601134637&dt_publicacao=21/09/2026","origem":"Pesquisa \"prova digital\" [posição 30]","grupo":"Limite do Habeas Corpus e Momento do Exame"},{"id":"j504895903","eixo":"e11","trib":"STJ","classe":"AgRg no HC 1.059.835/MG","registro":"2025/0489590-3","rel":"Carlos Pires Brandão","conv":"","relac":"","orgao":"6ª T.","data":"01/09/2026","dje":"05/10/2026","ementa":"DIREITO PROCESSUAL PENAL. AGRAVO REGIMENTAL EM HABEAS CORPUS. EVENTUAL QUEBRA DA CADEIA DE CUSTÓDIA NÃO ENSEJA NULIDADE AUTOMÁTICA. PROVAS DIGITAIS. NULIDADE POR DERIVAÇÃO. INADEQUAÇÃO DA VIA ELEITA. AGRAVO REGIMENTAL NÃO PROVIDO.\n\nI. Caso em exame\n1. Agravo regimental interposto contra decisão monocrática que denegou ordem em habeas corpus, cujo objeto central consiste em reconhecer a ilicitude de prova digital extraída de aparelho de corréu por suposta quebra da cadeia de custódia, com pedido de desentranhamento e anulação por derivação.\n2. Prisão em flagrante convertida em preventiva no contexto de investigação em que se realizaram apreensões e laudos periciais de anabolizantes sem registro, insumos e materiais diversos, com registros documentais, além de referências a movimentações financeiras e comunicação entre investigados.\n3. Acórdão estadual denegou a ordem originária, destacando a inadequação do habeas corpus para revolvimento probatório e a ausência de demonstração objetiva de adulteração ou manipulação do conteúdo digital; decisão monocrática nesta Corte indeferiu a liminar e, ao final, denegou a ordem, registrando a existência de provas autônomas e a fundamentação da prisão preventiva em elementos objetivos.\n\nII. Questão em discussão\n4. Há duas questões em discussão: (i) saber se a cadeia de custódia, disciplinada nos arts. 158-A a 158-F do Código de Processo Penal, foi violada de modo a comprometer, de plano, a integridade e confiabilidade da prova digital, exigindo nulidade automática; e (ii) saber se há nexo causal que imponha a nulidade por derivação das provas subsequentes, à luz do art. 157, § 1º, do Código de Processo Penal, ou se subsistem fontes independentes aptas a sustentar a persecução penal e o juízo cautelar.\n\nIII. Razões de decidir\n5. A via do habeas corpus não comporta dilação probatória nem exame minucioso de protocolos técnico-científicos, sendo inadequada para o revolvimento necessário à verificação de quebra da cadeia de custódia de prova digital.\n6. A eventual quebra da cadeia de custódia não enseja nulidade automática; impõe avaliação quanto à confiabilidade e à eficácia da prova em cotejo com o conjunto probatório, à luz do princípio de que não há nulidade sem prejuízo, exigindo demonstração objetiva de adulteração ou manipulação.\n7. A impugnação não demonstrou, de plano, comprometimento material do conteúdo digital; relatório técnico particular e alegadas ausências documentais não substituem a prova de adulteração ou manipulação, sobretudo na fase em que é possível exame pericial na origem.\n8. A nulidade por derivação depende do prévio reconhecimento da ilicitude da prova originária e da análise do nexo causal com as demais fontes, o que não se verifica no momento processual e na via estreita do habeas corpus.\n9. Ausência de ilegalidade flagrante e inequívoca a justificar concessão de ofício, mantendo-se a possibilidade de exame técnico e valoração exauriente pelo Juízo competente ao final da instrução.\n\nIV. Dispositivo\n10. Agravo regimental não provido.","cit":"(AgRg no HC n. 1.059.835/MG, relator Ministro Carlos Pires Brandão, Sexta Turma, julgado em 1/9/2026, DJEN de 5/10/2026.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202504895903&dt_publicacao=05/10/2026","origem":"Pesquisa \"prova digital\" e \"quebra da cadeia de custódia\" [posição 20]","grupo":"Limite do Habeas Corpus e Momento do Exame"},{"id":"j600947189","eixo":"e11","trib":"STJ","classe":"AgRg no RHC 234.121/SP","registro":"2026/0094718-9","rel":"Og Fernandes","conv":"","relac":"","orgao":"6ª T.","data":"04/08/2026","dje":"19/10/2026","ementa":"DIREITO PROCESSUAL PENAL. AGRAVO REGIMENTAL NO RECURSO EM HABEAS CORPUS. PROVAS DIGITAIS. QUEBRA DA CADEIA DE CUSTÓDIA. AUSÊNCIA DE DEMONSTRAÇÃO DE ADULTERAÇÃO E PREJUÍZO. INADEQUAÇÃO DA VIA ELEITA. NECESSIDADE DE REVOLVIMENTO PROBATÓRIO. AGRAVO IMPROVIDO.\nI. CASO EM EXAME\n1. Agravo regimental interposto contra decisão que negou provimento a recurso em habeas corpus, no qual se pleiteia o reconhecimento da ilicitude de provas digitais extraídas de aparelhos celulares, sob alegação de quebra da cadeia de custódia pela ausência de geração de código hash prévio ao manuseio e por supostos acessos indevidos pelo órgão acusador.\nII. QUESTÃO EM DISCUSSÃO\n2. Há duas questões em discussão: (i) definir se a ausência de código hash anterior ao manuseio dos dispositivos e alegados acessos indevidos caracterizam, por si sós, quebra da cadeia de custódia apta a invalidar a prova; (ii) estabelecer se é possível o reconhecimento da nulidade das provas na via do habeas corpus, sem demonstração de adulteração concreta e prejuízo à defesa.\nIII. RAZÕES DE DECIDIR\n3. O habeas corpus exige a demonstração de flagrante ilegalidade, não sendo cabível para exame aprofundado de matéria fático-probatória.\n4. A configuração da quebra da cadeia de custódia pressupõe a demonstração de irregularidade capaz de comprometer a integridade e a confiabilidade da prova, o que não se verifica sem indícios concretos de adulteração.\n5. A ausência de demonstração de prejuízo à defesa impede o reconhecimento de nulidade processual, nos termos do art. 563 do CPP.\n6. A avaliação de eventuais falhas na cadeia de custódia deve ser realizada em conjunto com o acervo probatório, especialmente após a instrução criminal.\n7. A inexistência, à época dos fatos, de disciplina legal específica sobre cadeia de custódia afasta a exigência rigorosa dos procedimentos posteriormente positivados, à luz do princípio do tempus regit actum.\nIV. DISPOSITIVO E TESE\n8. Agravo regimental improvido.","cit":"(AgRg no RHC n. 234.121/SP, relator Ministro Og Fernandes, Sexta Turma, julgado em 4/8/2026, DJEN de 19/10/2026.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202600947189&dt_publicacao=19/10/2026","origem":"Pesquisa \"prova digital\" [posição 23]","grupo":"Limite do Habeas Corpus e Momento do Exame"},{"id":"j600480695","eixo":"e11","trib":"STJ","classe":"AgRg no HC 1.073.160/SP","registro":"2026/0048069-5","rel":"Reynaldo Soares da Fonseca","conv":"","relac":"","orgao":"5ª T.","data":"16/06/2026","dje":"23/06/2026","ementa":"AGRAVO REGIMENTAL NO HABEAS CORPUS. ART. 337-F DO CP. NULIDADE DA PROVA DIGITAL POR QUEBRA DA CADEIA DE CUSTÓDIA. NÃO ENFRENTAMENTO DO TEMA PELA CORTE DE ORIGEM. SUPRESSÃO DE INSTÂNCIA. AGRAVO REGIMENTAL IMPROVIDO.\n1. Na hipótese, verifica-se que a Corte local não examinou a pretensão defensiva relativa à nulidade da prova digital por quebra da cadeia de custódia, sem o que se torna inviável a apreciação do tema diretamente por esta Corte superior, sob pena de indevida supressão de instância.\n2. Agravo regimental improvido.","cit":"(AgRg no HC n. 1.073.160/SP, relator Ministro Reynaldo Soares da Fonseca, Quinta Turma, julgado em 16/6/2026, DJEN de 23/6/2026.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202600480695&dt_publicacao=23/06/2026","origem":"Pesquisa \"prova digital\" [posição 31]","grupo":"Limite do Habeas Corpus e Momento do Exame"},{"id":"j56AgRPE","eixo":"e11","trib":"STF","classe":"RHC 268756 AgR/PE","registro":"","rel":"André Mendonça","conv":"","relac":"","orgao":"2ª T.","data":"22/04/2026","dje":"28/04/2026","ementa":"Ementa: Direito Processual Penal. Agravo regimental em recurso ordinário em habeas corpus. Prova digital. Cadeia de custódia. Alegada nulidade. Ausência de demonstração de adulteração. Necessidade de reexame fático-probatório. Via inadequada. Recurso desprovido.\n\nI. CASO EM EXAME\n\n1. Agravo regimental interposto em recurso ordinário em habeas corpus contra decisão que manteve acórdão do Superior Tribunal de Justiça que afastou alegação de nulidade de provas digitais.\n\nII. QUESTÃO EM DISCUSSÃO\n\n2. Há duas questões em discussão: (i) definir se a ausência de comprovação da integridade formal das provas digitais caracteriza, por si só, quebra da cadeia de custódia; (ii) estabelecer se a análise da alegada nulidade probatória pode ser realizada na via estreita do habeas corpus quando depende de reexame do conjunto fático-probatório.\n\nIII. RAZÕES DE DECIDIR\n\n4. A cadeia de custódia tem por finalidade assegurar a idoneidade da prova, exigindo demonstração concreta de irregularidade na colheita, preservação ou conservação do vestígio, não sendo suficiente alegação genérica de inconsistência técnica.\n\n5. O reconhecimento de quebra da cadeia de custódia pressupõe análise das circunstâncias concretas da obtenção e preservação da prova, providência que demanda revolvimento do conjunto fático-probatório.\n\n6. O habeas corpus não admite dilação probatória nem reexame aprofundado de fatos e provas.\n\nIV. DISPOSITIVO\n\n7. Recurso desprovido.\n\nJurisprudência relevante citada: STF, HC 213.264-AgR/SP, Rel. Min. Nunes Marques, Segunda Turma, j. 23.05.2022; STF, HC 231.635-AgR/SC, Rel. Min. Alexandre de Moraes, Primeira Turma, j. 02.10.2023; STF, HC 222.054-AgR/SP, Rel. Min. Roberto Barroso, Primeira Turma, j. 22.02.2023; STJ, HC 574.131/RS, Rel. Min. Nefi Cordeiro, Sexta Turma, j. 25.08.2020.","cit":"(RHC 268756 AgR/PE, Relator(a): André Mendonça, Segunda Turma, julgado em 22/04/2026, publicado em 28/04/2026.)","link":"https://portal.stf.jus.br/jurisprudencia/obterInteiroTeor.asp?idDocumento=796920036","origem":"Pesquisa \"prova digital\" [posição 33]","grupo":"Limite do Habeas Corpus e Momento do Exame"},{"id":"j502770811","eixo":"e11","trib":"STJ","classe":"AgRg no HC 1.021.994/RJ","registro":"2025/0277081-1","rel":"Joel Ilan Paciornik","conv":"","relac":"","orgao":"5ª T.","data":"15/04/2026","dje":"22/04/2026","ementa":"DIREITO PROCESSUAL PENAL. AGRAVO REGIMENTAL NO HABEAS CORPUS. PROVA DIGITAL. CADEIA DE CUSTÓDIA. NULIDADE PROBATÓRIA. NECESSIDADE DE DEMONSTRAÇÃO DE ADULTERAÇÃO E DE PREJUÍZO. INADEQUAÇÃO DA VIA ELEITA PARA REEXAME APROFUNDADO DA PROVA. AGRAVO REGIMENTAL DESPROVIDO.\n\nI. CASO EM EXAME\n1. Agravo regimental interposto contra decisão monocrática que não conheceu de habeas corpus impetrado em favor de acusado em ação penal que se apoia, de modo determinante, em extenso acervo de provas digitais, obtidas por medidas cautelares junto a provedores de serviços remotos.\n2. O agravante alega violação à cadeia de custódia, nos termos dos arts. 158-A a 158-F do CPP, por ausência de hash, manuseio por agentes não periciais, falta de registros formais de custódia e omissão na preservação das comunicações originais dos provedores, o que, em seu entender, inviabilizaria a aferição de integridade e rastreabilidade do material e imporia a declaração de ilicitude das provas digitais.\n3. O Tribunal de origem denegou a ordem por inexistirem indicativos concretos de adulteração, afirmando que a defesa teve pleno e irrestrito acesso à integralidade dos elementos dos autos e que não foi demonstrado prejuízo, enquanto a decisão ora agravada manteve esse entendimento e não conheceu do habeas corpus, afastando, inclusive, a concessão de ofício.\n\nII. QUESTÃO EM DISCUSSÃO\n4. A questão em discussão consiste em saber se a alegada quebra da cadeia de custódia das provas digitais armazenadas em HD e obtidas por medidas cautelares - fundada em suposta ausência de hash, registros e documentação formal - autoriza, na via estreita do habeas corpus, o reconhecimento de nulidade probatória e a consequente exclusão do material da ação penal.\n\nIII. Razões de decidir\n5. O Tribunal de origem consignou inexistirem evidências concretas de falhas procedimentais nas provas juntadas aos autos, destacando que não foi demonstrada adulteração dos objetos apreendidos, em especial das informações oriundas do HD de 2,20 TB, e que a defesa teve pleno e irrestrito acesso à integralidade do acervo probatório.\n6. De acordo com o art. 563 do CPP (princípio do pas de nullité sans grief), o reconhecimento de nulidade exige demonstração de efetivo prejuízo, não se admitindo a declaração de invalidade probatória com base apenas em presunções abstratas ou na mera ausência de determinados procedimentos técnicos, sem prova de comprometimento da integridade da prova.\n7. O acolhimento da tese defensiva demandaria análise aprofundada de todo o acervo digital e do iter de produção da prova, providência incompatível com a via estreita do habeas corpus, que não admite amplo revolvimento fático-probatório.\n8. Inexistindo demonstração de constrangimento ilegal evidente, mantém-se a decisão monocrática que não conheceu do habeas corpus e afastou a concessão de ordem de ofício.\n\nIV. DISPOSITIVO E TESE\n9. Resultado do Julgamento: Agravo regimental desprovido, mantendo-se a decisão que não conheceu do habeas corpus e não concedeu a ordem de ofício.\n\nTese de julgamento: 1. A alegação de quebra da cadeia de custódia da prova digital exige demonstração concreta de adulteração ou comprometimento do iter probatório, não bastando ilações genéricas ou parecer técnico unilateral. 2. À luz do art. 563 do CPP, a nulidade por suposta quebra de cadeia de custódia somente se reconhece diante de efetivo prejuízo à defesa, comprovado de forma objetiva. 3. O habeas corpus não é via adequada para reexame aprofundado de acervo probatório digital com o objetivo de aferir, em abstrato, a autenticidade e a integridade das provas.\n\nDispositivos relevantes citados: CPP, arts. 158-A a 158-F; CPP, art. 563\n\nJurisprudência relevante citada: STJ, AgRg no HC n. 958.288/SP, rel. Min. Antonio Saldanha Palheiro, Sexta Turma, DJEN 16/6/2025; STJ, HC n. 978.953/PE, rel. Min. Sebastião Reis Júnior, Sexta Turma, DJEN 10/6/2025; STJ, AgRg no AREsp n. 2.295.047/SC, rel. Min. Reynaldo Soares da Fonseca, Quinta Turma, DJe 8/9/2023; STJ, AgRg nos EDcl no HC n. 826.476/MG, rel. Min. Ribeiro Dantas, Quinta Turma, DJe 16/10/2023","cit":"(AgRg no HC n. 1.021.994/RJ, relator Ministro Joel Ilan Paciornik, Quinta Turma, julgado em 15/4/2026, DJEN de 22/4/2026.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202502770811&dt_publicacao=22/04/2026","origem":"Pesquisa \"prova digital\" e \"quebra da cadeia de custódia\" [posição 14]","grupo":"Limite do Habeas Corpus e Momento do Exame"},{"id":"j504345209","eixo":"e11","trib":"STJ","classe":"AgRg no RHC 226.790/SP","registro":"2025/0434520-9","rel":"Messod Azulay Neto","conv":"","relac":"","orgao":"5ª T.","data":"15/04/2026","dje":"22/04/2026","ementa":"DIREITO PROCESSUAL PENAL. AGRAVO REGIMENTAL EM RECURSO ORDINÁRIO EM HABEAS CORPUS. CADEIA DE CUSTÓDIA DA PROVA DIGITAL. ALEGADA NULIDADE DA EXTRAÇÃO DE DADOS E CERCEAMENTO DE DEFESA. TRANCAMENTO DA AÇÃO PENAL. AGRAVO REGIMENTAL IMPROVIDO.\nI. CASO EM EXAME\n1. O recurso. Agravo regimental interposto contra decisão monocrática que negara provimento a recurso ordinário em habeas corpus, por meio do qual se buscava o trancamento da Ação Penal n. 5000903-69.2021.4.03.6118, em curso perante a 1ª Vara Federal da Subseção Judiciária de Guaratinguetá/SP, na qual o agravante responde pelos supostos crimes de organização criminosa (Lei n. 12.850/2013, art. 2º, § 4º, II) e peculato por equiparação (CP, art. 312 c/c art. 327, § 1º).\n2. Fato relevante. A defesa alega quebra da cadeia de custódia de aparelhos celular e notebook apreendidos na residência do agravante, em razão de deslacramento no dia seguinte à apreensão, acondicionamento conjunto de dois dispositivos em um único recipiente, ausência de extração forense imediata \"bit a bit\" e divergência entre números de IMEI registrados no termo de apreensão e no laudo pericial. Sustenta, ainda, nulidade por suposta limitação de acesso ao contexto integral das mensagens extraídas, o que configuraria cerceamento de defesa.\n3. As decisões anteriores. O juízo de primeiro grau rejeitou as preliminares de nulidade por quebra da cadeia de custódia e por cerceamento de defesa, determinando o prosseguimento da ação penal. O Tribunal regional, em habeas corpus, denegou a ordem, afastando a alegada nulidade das provas digitais e a necessidade de trancamento da ação penal. A decisão monocrática ora agravada manteve esse entendimento.\nII. QUESTÃO EM DISCUSSÃO\n4. Há duas questões em discussão: (i) saber se a alegada quebra da cadeia de custódia dos dispositivos eletrônicos apreendidos - em especial o deslacramento prévio, o acondicionamento conjunto em único recipiente e a divergência de numeração de IMEI - torna ilícitas as provas digitais produzidas e impõe o trancamento da ação penal; (ii) saber se a extração seletiva de dados dos dispositivos e a não disponibilização da integralidade do conteúdo extraído configuram cerceamento de defesa e nulidade da prova, passíveis de reconhecimento na via estreita do habeas corpus e de seu agravo regimental.\nIII. RAZÕES DE DECIDIR\n5. A cadeia de custódia, disciplinada pelos arts. 158-A a 158-F do CPP, visa assegurar a autenticidade e a integridade dos vestígios, mas a mera inobservância formal de etapas ou falhas burocráticas na documentação não gera automaticamente nulidade da prova, exigindo-se demonstração concreta de adulteração, contaminação dos vestígios ou efetivo prejuízo à defesa, em consonância com o princípio do prejuízo (pas de nullité sans grief).\n6. As instâncias ordinárias registraram que o aparelho celular apreendido possui natureza dual SIM, com dois IMEI distintos, e que, não obstante a divergência entre IMEI 1 e IMEI 2 em documentos policiais e periciais, há coincidência de marca, modelo, cor, lacre, especificações técnicas e vinculação a conta de usuário e número telefônico atribuídos ao agravante, afastando a hipótese de substituição ou erro material relevante a macular a prova.\n7. Quanto ao acondicionamento conjunto de dois dispositivos em um único recipiente e ao posterior deslacramento, a decisão aponta que houve registro dos procedimentos, indicação de identificação (serial, IMEI, ICCID) e possibilidade técnica de rastreamento de eventuais manuseios, não se evidenciando qualquer intervenção indevida ou manipulação do conteúdo dos aparelhos, de modo que não se demonstra quebra substancial da cadeia de custódia apta a invalidar, de plano, a prova digital.\n8. Em relação ao acesso ao conteúdo dos dispositivos, consignou-se que a extração de dados foi realizada por órgão técnico oficial, com elaboração de laudo pericial contendo as mensagens reputadas relevantes à investigação, acompanhadas de informações de data, horário, interlocutores e contexto suficiente para compreensão, e que a defesa não especificou mensagens supostamente descontextualizadas nem indicou prejuízo concreto, podendo, inclusive, ter requerido nova perícia, o que não fez.\n9. A jurisprudência das Cortes Superiores admite a seleção, pela perícia, de elementos relevantes ao objeto da investigação, não exigindo a juntada ou transcrição integral de todo o conteúdo armazenado, desde que assegurado às partes o acesso aos elementos que fundam a acusação, inexistindo nulidade sem demonstração de efetivo cerceamento de defesa.\n10. O Tribunal regional, soberano na análise fático-probatória, já concluiu pela inexistência de qualquer evidência concreta de mácula às provas digitais, de adulteração ou de interferência indevida capaz de torná-las imprestáveis, tendo avaliado a capacidade comprobatória do material à luz das circunstâncias do caso e reputando íntegra a prova; a reversão desse juízo demandaria revolvimento aprofundado do acervo probatório.\n11. O habeas corpus e o agravo regimental nele interposto não constituem via adequada para reexame de fatos e provas ou para reconstrução pormenorizada da cadeia de custódia, cabendo às instâncias ordinárias, especialmente ao juízo de conhecimento, sopesar eventual irregularidade formal com os demais elementos de prova e definir, na sentença, a eficácia probatória dos vestígios questionados.\n12. O agravante não apresentou, no agravo regimental, argumentos novos ou circunstâncias distintas capazes de infirmar a decisão monocrática, limitando-se a reiterar alegações já examinadas e afastadas, razão pela qual se impõe a manutenção da decisão agravada pelos seus próprios fundamentos.\nIV. DISPOSITIVO E TESE\n13. Resultado do Julgamento: Agravo regimental improvido, mantida a decisão que negara provimento ao recurso ordinário em habeas corpus.\nTese de julgamento:\n1. Irregularidades formais na cadeia de custódia da prova, por si sós, não acarretam nulidades automáticas, sendo indispensável a demonstração de adulteração ou de efetivo prejuízo à defesa.\n2. A aferição da quebra da cadeia de custódia e da consequente eficácia probatória dos vestígios deve ser feita pelo magistrado à luz do conjunto probatório, não sendo a via do habeas corpus, nem do agravo regimental contra ele interposto, adequada para o reexame aprofundado de fatos e provas.\nDispositivos relevantes citados: CPP, arts. 158-A a 158-F; CPP, art. 158-D; CPP, art. 563; Lei n. 12.850/2013, art. 2º, § 4º, II; CP, art. 312; CP, art. 327, § 1º.\nJurisprudência relevante citada: STJ, HC 653.515/RJ, Sexta Turma, Rel. Min. Rogerio Schietti Cruz, DJe 1º/02/2022; STJ, AgRg no RHC 147.885/SP, Sexta Turma, Rel. Min. Olindo Menezes (Des. Convocado TRF1), DJe 13/12/2021; STJ, AgRg no HC 832.832/GO, Quinta Turma, Rel. Min. Ribeiro Dantas, DJe 14/09/2023; STJ, AgRg no HC 819.499/SC, Quinta Turma, Rel. Min. Reynaldo Soares da Fonseca, DJe 29/09/2023; STJ, REsp 1.931.145/SP, Terceira Seção, Rel. Min. Sebastião Reis Júnior, DJe 24/06/2022; STJ, REsp 2.198.427/SC, Sexta Turma, Rel. Min. Sebastião Reis Júnior, DJe 26/06/2025; STJ, AgRg no HC 931.683/MS, Quinta Turma, Rel. Min. Otavio de Almeida Toledo (Des. Convocado TJSP), DJe 26/06/2025; STJ, AgRg no HC 999.076, Sexta Turma, Rel. Min. Sebastião Reis Júnior, DJe 30/06/2025; STJ, AgRg no HC 746.113/SP, Sexta Turma, Rel. Min. Carlos Cini Marchionatti (Des. Convocado TJRS), DJe 18/06/2025; STJ, AgRg no HC 817.562/RS, Quinta Turma, Rel. Min. Reynaldo Soares da Fonseca, DJe 30/06/2023; STJ, AgRg no HC 812.438/SP, Quinta Turma, Rel. Min. Ribeiro Dantas, DJe 29/06/2023; STJ, HC 704.718/SP, Sexta Turma, Rel. Min. Laurita Vaz, DJe 23/05/2023; STJ, AgRg no HC 811.106/SP, Sexta Turma, Rel. Min. Rogerio Schietti Cruz, DJe 22/06/2023; STJ, AgRg no HC 819.078/SP, Sexta Turma, Rel. Min. Laurita Vaz, DJe 15/06/2023.","cit":"(AgRg no RHC n. 226.790/SP, relator Ministro Messod Azulay Neto, Quinta Turma, julgado em 15/4/2026, DJEN de 22/4/2026.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202504345209&dt_publicacao=22/04/2026","origem":"Pesquisa \"prova digital\" [posição 38]","grupo":"Limite do Habeas Corpus e Momento do Exame"},{"id":"j600623359","eixo":"e11","trib":"STJ","classe":"AgRg no RHC 232.734/MG","registro":"2026/0062335-9","rel":"Antonio Saldanha Palheiro","conv":"","relac":"","orgao":"6ª T.","data":"15/04/2026","dje":"23/04/2026","ementa":"DIREITO PROCESSUAL PENAL. AGRAVO REGIMENTAL EM RECURSO ORDINÁRIO EM HABEAS CORPUS. EXTORSÃO QUALIFICADA. CADEIA DE CUSTÓDIA. PROVAS DIGITAIS. TRANCAMENTO DA AÇÃO PENAL E REVOGAÇÃO DA PRISÃO PREVENTIVA. RECURSO DESPROVIDO.\nI. Caso em exame\n1. Agravo regimental interposto contra decisão monocrática que negara provimento ao recurso ordinário em habeas corpus, manejado em favor de pessoa presa preventivamente pela suposta prática de extorsão qualificada e disparo de arma de fogo.\n2. Defesa que sustenta ilegalidade na cadeia de custódia das provas digitais, com alegação de nulidade absoluta, ilicitude por derivação, usurpação de função pericial e inexistência de justa causa para a ação penal, requerendo a anulação das provas tidas por ilegais, o trancamento da ação penal e a revogação da prisão preventiva.\nII. Questão em discussão\n3. A questão em discussão consiste em saber se a alegada quebra da cadeia de custódia das provas digitais, bem como as demais nulidades invocadas, podem ser reconhecidas, na via estreita do habeas corpus e de seu recurso ordinário, como causa suficiente para anular a prova, trancar a ação penal e revogar a prisão preventiva, sem necessidade de dilação probatória.\nIII. Razões de decidir\n4. O trancamento da ação penal pela via do habeas corpus constitui medida excepcional, somente admitida quando demonstradas, de plano, a atipicidade da conduta, a existência de causa extintiva de punibilidade ou a ausência de indícios de autoria e materialidade, hipóteses não evidenciadas nos autos.\n5. A quebra da cadeia de custódia, para ensejar a imprestabilidade da prova, exige demonstração concreta de adulteração ou de comprometimento de sua integridade, o que não foi comprovado no rito estreito do habeas corpus e de seu recurso ordinário, que demanda prova pré-constituída das alegações.\n6. As teses de nulidade absoluta das provas digitais, de ilicitude por derivação e de inexistência de justa causa para a ação penal demandam exame aprofundado do acervo fático-probatório, providência incompatível com a via do habeas corpus, devendo ser apreciadas no decorrer da ação penal pelas instâncias ordinárias.\n7. Mantida, por ora, a presunção de legalidade das provas até análise exauriente pelas instâncias ordinárias, inexiste fundamento para revogar a prisão preventiva ou para determinar o trancamento da ação penal.\n8. Inexistindo demonstração inequívoca de ilegalidade apta a justificar a intervenção excepcional da instância superior, impõe-se a manutenção da decisão agravada.\nIV. Dispositivo e tese\n9. Resultado do Julgamento: Agravo regimental desprovido.\nTese de julgamento:\n1. A quebra da cadeia de custódia das provas digitais somente invalida o material probatório quando demonstrada, de plano, a adulteração ou o comprometimento de sua integridade.\n2. A via do habeas corpus e do recurso ordinário em habeas corpus exige prova pré-constituída e não comporta dilação probatória para exame aprofundado de nulidades de provas e de justa causa para a ação penal.\n3. O trancamento da ação penal e a revogação da prisão preventiva com fundamento em nulidade de provas digitais dependem de demonstração inequívoca de ilicitude, a ser apreciada, em regra, pelas instâncias ordinárias.","cit":"(AgRg no RHC n. 232.734/MG, relator Ministro Antonio Saldanha Palheiro, Sexta Turma, julgado em 15/4/2026, DJEN de 23/4/2026.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202600623359&dt_publicacao=23/04/2026","origem":"Pesquisa \"prova digital\" [posição 41]","grupo":"Limite do Habeas Corpus e Momento do Exame"},{"id":"j504929468","eixo":"e11","trib":"STJ","classe":"AgRg no HC 1.060.419/SC","registro":"2025/0492946-8","rel":"Carlos Pires Brandão","conv":"","relac":"","orgao":"6ª T.","data":"15/04/2026","dje":"24/04/2026","ementa":"DIREITO PROCESSUAL PENAL. AGRAVO REGIMENTAL EM HABEAS CORPUS. PROVA DIGITAL. CADEIA DE CUSTÓDIA. TEORIA DOS FRUTOS DA ÁRVORE ENVENENADA. TRANCAMENTO DA AÇÃO PENAL. PRISÃO PREVENTIVA. AGRAVO REGIMENTAL DESPROVIDO.\nI. Caso em exame\n1. Agravo regimental interposto contra decisão monocrática que denegou a ordem em habeas corpus impetrado em favor de paciente acusado da prática de delitos previstos nos arts. 240, § 2º, II e III, e 241-B do ECA, com prisão em flagrante convertida em preventiva e denúncia recebida.\n2. No habeas corpus originário, a defesa sustentou nulidade das provas digitais por quebra da cadeia de custódia, com pedido de desentranhamento dos elementos, trancamento da ação penal por ausência de justa causa e revogação da prisão preventiva, pleitos reiterados no agravo regimental sob o argumento de que a ilegalidade estaria demonstrada por prova pré-constituída.\nII. Questão em discussão\n3. Há quatro questões em discussão: (i) saber se, na via estreita do habeas corpus, é possível reconhecer, de plano, nulidade absoluta das provas digitais por suposta quebra da cadeia de custódia, inclusive em razão de ausência de geração de hash/imagem espelhada e de alegada violação da \"mesmidade\", sem exame pericial e contraditório; (ii) saber se a teoria dos frutos da árvore envenenada autoriza, desde logo, a extensão da nulidade às provas derivadas dos elementos digitais questionados; (iii) saber se há ausência de justa causa para a ação penal, apta a ensejar o seu trancamento em habeas corpus; (iv) saber se há ilegalidade patente que imponha a revogação da prisão preventiva do paciente.\nIII. Razões de decidir\n4. A aferição da integridade e autenticidade dos vestígios digitais, inclusive quanto à observância da cadeia de custódia, exige exame pericial e debate sob contraditório, sendo incompatível com o rito célere e a cognição sumária do habeas corpus a declaração de nulidade automática com base apenas em alegações defensivas.\n5. A entrega voluntária do aparelho celular por particular não afasta a necessidade de preservação técnica, mas, na fase processual em exame, inexistem indícios mínimos de contaminação ou adulteração do material, havendo, ao contrário, determinação de realização de perícia, o que afasta, por ora, a configuração de quebra da cadeia de custódia.\n6. A ausência de certificadores específicos, como geração de hash ou imagem espelhada, não implica, por si só, nulidade ou imprestabilidade das provas digitais, devendo eventual irregularidade ser avaliada à luz da confiabilidade concreta do material e do conjunto probatório, após a instrução e o exame técnico.\n7. Inexistindo, até o momento, vício configurado na cadeia de custódia ou demonstração objetiva de adulteração, não há como aplicar, de imediato, a teoria dos frutos da árvore envenenada para afastar as provas digitais e as supostas provas derivadas, cuja eventual inadmissibilidade dependerá de apuração técnica e processual na origem.\n8. Há lastro probatório mínimo para o recebimento da denúncia, consubstanciado em boletim de ocorrência, relatos sobre a visualização de vídeos no aparelho celular, auto de exibição e apreensão de celulares, decisão de audiência de custódia que menciona mídias anexadas ao auto de prisão em flagrante, depoimentos e confissão perante a autoridade policial, além de a peça acusatória atender aos requisitos do art. 41 do CPP, o que afasta a alegação de ausência de justa causa e impede o trancamento da ação penal na via eleita.\n9. Não se verifica ilegalidade flagrante na manutenção da ação penal ou da prisão preventiva, porquanto o exame aprofundado da higidez técnica dos elementos probatórios digitais e de eventual prejuízo à defesa deve ser realizado pelo juízo natural, mediante contraditório e perícia, não cabendo ao habeas corpus substituir a instrução criminal.\nIV. Dispositivo e tese\n10. Agravo regimental desprovido.","cit":"(AgRg no HC n. 1.060.419/SC, relator Ministro Carlos Pires Brandão, Sexta Turma, julgado em 15/4/2026, DJEN de 24/4/2026.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202504929468&dt_publicacao=24/04/2026","origem":"Pesquisa \"prova digital\" [posição 43]","grupo":"Limite do Habeas Corpus e Momento do Exame"},{"id":"j400311942","eixo":"e11","trib":"STJ","classe":"AgRg no RHC 193.166/BA","registro":"2024/0031194-2","rel":"Messod Azulay Neto","conv":"","relac":"","orgao":"5ª T.","data":"19/11/2025","dje":"27/11/2025","ementa":"DIREITO PROCESSUAL PENAL. AGRAVO REGIMENTAL. QUEBRA DE CADEIA DE CUSTÓDIA. PROVA DIGITAL. FISHING EXPEDITION. AGRAVO DESPROVIDO.\nI. CASO EM EXAME\n1. Agravo regimental interposto contra decisão que negou provimento a recurso ordinário em habeas corpus, no qual se alegava nulidade de prova digital por quebra da cadeia de custódia e prática de fishing expedition em investigação criminal.\n2. A defesa sustentou que o telefone celular do corréu não foi apreendido de maneira correta no momento da prisão, o que teria gerado nulidade absoluta da prova e daquelas dela derivadas, além de alegar que a busca e apreensão domiciliar e a quebra de dados telemáticos configurariam uma investigação genérica e aleatória.\nII. QUESTÃO EM DISCUSSÃO\n3. A questão em discussão consiste em saber se a alegada quebra da cadeia de custódia e a prática de fishing expedition invalidam as provas obtidas e as derivadas, comprometendo a regularidade da investigação e do processo penal.\nIII. RAZÕES DE DECIDIR\n4. O agravo regimental não apresentou novos argumentos capazes de alterar o entendimento firmado na decisão agravada, que analisou de forma fundamentada os pontos levantados pela defesa.\n5. A jurisprudência do STJ exige a demonstração de prejuízo concreto à defesa ou indício de adulteração, contaminação ou troca do material para o reconhecimento da nulidade por quebra da cadeia de custódia, o que não foi comprovado no caso.\n6. A alteração da conclusão das instâncias ordinárias quanto à regularidade das provas demandaria o revolvimento do acervo fático-probatório, o que é vedado na via estreita do habeas corpus.\n7. A decisão que deferiu a busca e apreensão domiciliar e a quebra de dados telemáticos foi fundamentada em investigações preliminares e indícios razoáveis de envolvimento do corréu em crime, afastando a alegação de fishing expedition.\n8. A investigação foi direcionada e baseada em elementos concretos, não configurando busca aleatória de provas, conforme entendimento consolidado do STJ.\nIV. DISPOSITIVO E TESE\n9. Resultado do Julgamento: Agravo regimental desprovido.\nTese de julgamento:\n1. A nulidade por quebra da cadeia de custódia exige a demonstração de prejuízo concreto à defesa ou indício de adulteração, contaminação ou troca do material probatório.\n2. A prática de fishing expedition não se configura quando a investigação é direcionada e baseada em elementos concretos e indícios razoáveis.\n3. O revolvimento do acervo fático-probatório é incompatível com a via estreita do habeas corpus.\nDispositivos relevantes citados: CPP, art. 157.\nJurisprudência relevante citada: STJ, AgRg no HC 829.138/RN, Rel. Min. João Otávio de Noronha, Quinta Turma, julgado em 06.02.2024; STJ, AgRg no HC 1007295/RJ, Rel. Min. Carlos Cini Marchionatti, Quinta Turma, julgado em 09.09.2025; STJ, AgRg no RHC 203248/SP, Rel. Min. Otávio de Almeida Toledo, Sexta Turma, julgado em 11.06.2025.","cit":"(AgRg no RHC n. 193.166/BA, relator Ministro Messod Azulay Neto, Quinta Turma, julgado em 19/11/2025, DJEN de 27/11/2025.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202400311942&dt_publicacao=27/11/2025","origem":"Pesquisa \"prova digital\" [posição 28]","grupo":"Limite do Habeas Corpus e Momento do Exame"},{"id":"j403633824","eixo":"e11","trib":"STJ","classe":"AgRg nos EDcl no HC 948.326/SP","registro":"2024/0363382-4","rel":"Ribeiro Dantas","conv":"","relac":"","orgao":"5ª T.","data":"29/10/2025","dje":"05/11/2025","ementa":"Direito processual penal. Agravo regimental NOS EMBARGOS DE DECLARAÇÃO NO HABEAS CORPUS. TRÁFICO DE DROGAS. Quebra de cadeia de custódia. Prova digital. Agravo IMprovido.\nI. Caso em exame\n1. Agravo regimental interposto contra decisão que não conheceu do habeas corpus, no qual se alega a tese de quebra de cadeia de custódia na colheita e no armazenamento de prova digital extraída do celular de corréu.\nII. Questão em discussão\n2. A questão em discussão consiste em saber se a ausência do código hash e de detalhamento no procedimento de armazenamento da prova digital, extraída do aparelho celular do corréu comprometem a confiabilidade dos dados utilizados para subsidiar a investigação criminal, justificando o trancamento da ação penal.\nIII. Razões de decidir\n3. A decisão impugnada foi mantida por seus próprios fundamentos, pois não se constatou ilegalidade ou teratologia na colheita de provas durante a investigação.\n4. As instâncias ordinárias afirmaram que não há prova da adulteração ou manipulação indevida do material obtido com a extração de dados do telefone celular, razão pela qual rever esse entendimento demandaria o reexame do conteúdo fático, providência inadmissível na via eleita.\n5. A ausência de procedimentos técnicos específicos, de forma isolada, não compromete a validade da prova, se não existe comprovação de adulteração ou manipulação que prejudique sua integridade.\nIV. Dispositivo e tese\n6. Agravo improvido.\nTese de julgamento: A alegação da quebra de cadeia de custódia deve ser demonstrada de forma concreta e não pode ser analisada na via do habeas corpus, que é inadequada para o exame fático-probatório.\nDispositivos relevantes citados: Não há dispositivos legais relevantes citados.\nJurisprudência relevante citada: STJ, AgRg no HC 1.000.965/PE, Min. Reynaldo Soares da Fonseca, Quinta Turma, julgado em 20.05.2025; STJ, AgRg no RHC 210.000/PR, Min. Otávio de Almeida Toledo, Sexta Turma, julgado em 14.05.2025; STJ, AgRg nos EDcl nos EDcl no AREsp 2.708.653/SP, Min. Joel Ilan Paciornik, Quinta Turma, julgado em 27.11.2024; STJ, Inq 1.658/DF, Min. Og Fernandes, Corte Especial, julgado em 19.02.2025.","cit":"(AgRg nos EDcl no HC n. 948.326/SP, relator Ministro Ribeiro Dantas, Quinta Turma, julgado em 29/10/2025, DJEN de 5/11/2025.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202403633824&dt_publicacao=05/11/2025","origem":"Pesquisa \"prova digital\" [posição 35]","grupo":"Limite do Habeas Corpus e Momento do Exame"},{"id":"j502069279","eixo":"e11","trib":"STJ","classe":"AgRg no RHC 217.430/PA","registro":"2025/0206927-9","rel":"Otávio de Almeida Toledo","conv":"Desembargador Convocado do TJSP","relac":"","orgao":"6ª T.","data":"03/09/2025","dje":"08/09/2025","ementa":"DIREITO PROCESSUAL PENAL. AGRAVO REGIMENTAL. CADEIA DE CUSTÓDIA. PROVAS DIGITAIS. AGRAVO REGIMENTAL NÃO PROVIDO.\n\nI. Caso em exame\n1. Agravo regimental interposto contra decisão que negou provimento a recurso ordinário em habeas corpus, no qual se alegava quebra da cadeia de custódia de provas digitais apresentadas pela vítima, requerendo a declaração de ilicitude das mesmas e o trancamento da ação penal.\n\nII. Questão em discussão\n2. A questão em discussão consiste em saber se a alegada quebra da cadeia de custódia das provas digitais, entregues pela vítima à autoridade policial, sem observância dos procedimentos legais, implica em sua ilicitude e consequente nulidade.\n\nIII. Razões de decidir\n3. A jurisprudência consolidada do Superior Tribunal de Justiça estabelece que eventual irregularidade na cadeia de custódia não implica, automaticamente, nulidade da prova, devendo ser analisada em conjunto com os demais elementos produzidos durante a instrução processual.\n4. O exame acerca da idoneidade e confiabilidade das provas digitais demanda dilação probatória e não pode ser objeto de apreciação definitiva em sede de habeas corpus ou agravo regimental, que possuem cognição limitada.\n5. A decisão de recebimento da denúncia foi devidamente fundamentada, reconhecendo que os elementos constantes dos autos são suficientes para viabilizar a acusação, não havendo que se falar em ausência de justa causa ou constrangimento ilegal.\n6. A ação penal se encontra em fase inicial, ainda pendente de resposta à acusação e de instrução, etapa na qual a Defesa poderá exercer amplamente seu direito de impugnar a validade e a autenticidade das provas digitais apresentadas.\n\nIV. Dispositivo e tese\n7. Agravo regimental não provido.\n\nTese de julgamento: \"1. A eventual irregularidade na cadeia de custódia das provas digitais não implica, automaticamente, em sua nulidade. 2. A idoneidade e confiabilidade das provas digitais devem ser analisadas em conjunto com os demais elementos produzidos durante a instrução processual. 3. A fase de instrução é o momento adequado para a Defesa impugnar a validade e autenticidade das provas digitais apresentadas\".\n\nDispositivos relevantes citados: CPP, arts. 158-A a 158-F, 155.\n\nJurisprudência relevante citada: STJ, AgRg no RHC 191492, Rel. Min. Antonio Saldanha Palheiro, julgado em 18/12/2023; STJ, AgRg no HC 752.444/SC, Rel. Min. Ribeiro Dantas, julgado em 4/10/2022.","cit":"(AgRg no RHC n. 217.430/PA, relator Ministro Otávio de Almeida Toledo (Desembargador Convocado do TJSP), Sexta Turma, julgado em 3/9/2025, DJEN de 8/9/2025.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202502069279&dt_publicacao=08/09/2025","origem":"Pesquisa \"prova digital\" e \"quebra da cadeia de custódia\" [posição 9]","grupo":"Limite do Habeas Corpus e Momento do Exame"},{"id":"j403753761","eixo":"e11","trib":"STJ","classe":"AgRg no RHC 205.429/GO","registro":"2024/0375376-1","rel":"Messod Azulay Neto","conv":"","relac":"","orgao":"5ª T.","data":"12/02/2025","dje":"17/02/2025","ementa":"DIREITO PROCESSUAL PENAL. AGRAVO REGIMENTAL. RECURSO ORDINÁRIO EM HABEAS CORPUS. CADEIA DE CUSTÓDIA. PROVA DIGITAL. AGRAVO NÃO PROVIDO.\nI. CASO EM EXAME\n1. Agravo regimental interposto contra decisão que negou provimento ao recurso ordinário em habeas corpus, no qual se alegava nulidade da decisão que indeferiu pedido de conversão do feito em diligência, sob alegação de quebra da cadeia de custódia de dados telefônicos e telemáticos.\n2. O agravante foi preso temporariamente, com conversão em preventiva, e denunciado por tráfico de drogas e associação para o tráfico. A defesa alega que a metodologia utilizada na extração de dados do celular do agravante não foi devidamente esclarecida, comprometendo a cadeia de custódia.\nII. QUESTÃO EM DISCUSSÃO\n3. A questão em discussão consiste em saber se houve quebra da cadeia de custódia dos dados telefônicos e telemáticos, comprometendo a integridade da prova digital utilizada na investigação criminal.\nIII. RAZÕES DE DECIDIR\n4. A decisão agravada considerou que não houve demonstração de ilegalidade flagrante na cadeia de custódia, uma vez que a extração dos dados foi realizada com autorização judicial e utilizando metodologia forense adequada.\n5. O Superior Tribunal de Justiça entende que a análise de eventual quebra da cadeia de custódia demanda incursão no acervo fático-probatório, o que é inviável em sede de habeas corpus.\n6. A defesa não apresentou elementos concretos que demonstrassem adulteração ou interferência indevida na prova, sendo necessário reexame de fatos e provas para desconstituir a decisão de origem.\nIV. DISPOSITIVO E TESE\n7. Agravo não provido.\nTese de julgamento: \"1. A análise de quebra da cadeia de custódia de prova digital demanda incursão no acervo fático-probatório, inviável em sede de habeas corpus. 2. A defesa deve apresentar elementos concretos para demonstrar adulteração ou interferência indevida na prova para desconstituir decisão de origem\".\nDispositivos relevantes citados: CPP, art. 158-A; CPP, art. 158-B; CPP, art. 563.\nJurisprudência relevante citada: STJ, AgRg no HC 832.832/GO, Quinta Turma, Rel. Min. Ribeiro Dantas, DJe de 14/9/2023; STJ, AgRg no HC 819.499/SC, Quinta Turma, Rel. Min. Reynaldo Soares da Fonseca, DJe de 29/9/2023; STJ, REsp 1.931.145/SP, Terceira Seção, Rel. Min. Sebastião Reis Júnior, DJe de 24/6/2022.","cit":"(AgRg no RHC n. 205.429/GO, relator Ministro Messod Azulay Neto, Quinta Turma, julgado em 12/2/2025, DJEN de 17/2/2025.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202403753761&dt_publicacao=17/02/2025","origem":"Pesquisa \"prova digital\" [posição 27]","grupo":"Limite do Habeas Corpus e Momento do Exame"},{"id":"j504986823","eixo":"e11","trib":"STJ","classe":"AgRg nos EDcl no AREsp 3.144.019/SP","registro":"2025/0498682-3","rel":"Carlos Pires Brandão","conv":"","relac":"","orgao":"6ª T.","data":"04/08/2026","dje":"18/08/2026","ementa":"DIREITO PENAL E PROCESSUAL PENAL. AGRAVO REGIMENTAL NO RECURSO ESPECIAL. CADEIA DE CUSTÓDIA. PROVA DIGITAL. INCIDÊNCIA DA SÚMULA 7/STJ. AGRAVO REGIMENTAL IMPROVIDO.\n\nI. CASO EM EXAME\n1. Agravo regimental interposto contra decisão monocrática que conheceu do agravo em recurso especial e não conheceu do recurso especial, por incidência da Súmula 7/STJ, em condenação pelo crime do art. 344, caput, do CP, com pena de 1 (um) ano de reclusão, em regime inicial aberto, e 10 (dez) dias-multa, com suspensão condicional da pena por 2 (dois) anos.\n2. Pretensão de afastar o óbice da Súmula 7/STJ para processamento do recurso especial e, ao final, declarar a inadmissibilidade da prova digital por violação à cadeia de custódia, com absolvição nos termos do art. 386, II, do CPP, ou, subsidiariamente, prequestionar os dispositivos legais invocados.\n\nII. QUESTÃO EM DISCUSSÃO\n3. Há duas questões em discussão: (i) saber se a alegada quebra da cadeia de custódia de prova digital pode ser apreciada como matéria exclusivamente de direito, sem revolvimento do conjunto fático-probatório, afastando a incidência da Súmula 7/STJ; e (ii) saber se há omissão na decisão monocrática quanto ao enfrentamento de tese sobre inadmissibilidade de prova digital sem observância de procedimentos técnicos.\n\nIII. RAZÕES DE DECIDIR\n4. A análise de quebra da cadeia de custódia de prova digital demanda exame das circunstâncias concretas de coleta, preservação e utilização dos dados, o que impõe revolvimento fático-probatório e atrai a incidência da Súmula 7/STJ.\n5. As instâncias ordinárias afirmaram a inexistência de indícios de manipulação das mensagens e a presença de elementos corroborativos, de modo que a desconstituição dessas premissas exige reavaliação do acervo probatório, inviável na via especial.\n6. A ausência de perícia técnica no aparelho não acarreta nulidade automática da prova digital, sendo necessária demonstração de comprometimento concreto da integridade da cadeia de custódia, o que não se verificou nas decisões de origem.\n7. Não há omissão na decisão monocrática, que enfrentou a questão nuclear ao assentar a necessidade de reexame de fatos e provas para infirmar a regularidade da cadeia de custódia e a suficiência do acervo probatório.\n8. O pedido de absolvição com base no art. 386, II, do CPP pressupõe revisão de premissas fáticas fixadas pelo Tribunal de origem, providência incompatível com o recurso especial e com o agravo regimental que o viabiliza.\n\nIV. DISPOSITIVO\n9. Agravo regimental improvido.","cit":"(AgRg nos EDcl no AREsp n. 3.144.019/SP, relator Ministro Carlos Pires Brandão, Sexta Turma, julgado em 4/8/2026, DJEN de 18/8/2026.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202504986823&dt_publicacao=18/08/2026","origem":"Pesquisa \"prova digital\" e \"quebra da cadeia de custódia\" [posição 18]","grupo":"Reexame Vedado em Recurso Especial"},{"id":"j503297247","eixo":"e11","trib":"STJ","classe":"AgRg no AREsp 3.038.419/AM","registro":"2025/0329724-7","rel":"Joel Ilan Paciornik","conv":"","relac":"","orgao":"5ª T.","data":"10/03/2026","dje":"17/03/2026","ementa":"DIREITO PENAL E PROCESSUAL PENAL. AGRAVO REGIMENTAL NO AGRAVO EM RECURSO ESPECIAL. ESTUPRO DE VULNERÁVEL. NULIDADE. QUEBRA DA CADEIA DE CUSTÓDIA DA PROVA DIGITAL. SÚMULA N. 7/STJ. ACESSO AO MATERIAL PERICIADO. SÚMULA N. 7/STJ. DOSIMETRIA. CAUSA DE AUMENTO DO ART. 226, II, DO CÓDIGO PENAL. PLEITO DE AFASTAMENTO. INVIABILIDADE. PARENTESCO POR AFINIDADE. AGRAVO DESPROVIDO.\nI. CASO EM EXAME\n1. O recurso. Agravo regimental interposto pela defesa contra decisão monocrática que conheceu do agravo em recurso especial para não conhecer do recurso especial manejado em ação penal relativa a crime de estupro de vulnerável.\n2. Fatos e fundamentos relevantes. A agravante sustenta: (i) manifesta quebra da cadeia de custódia de provas digitais extraídas do aparelho celular da vítima, com consequente comprometimento do contraditório e da ampla defesa; e (ii) inexistência de relação de autoridade apta a justificar a incidência da causa de aumento de pena prevista no art. 226, II, do Código Penal, reconhecida pelo Tribunal de origem.\n3. Pretensão recursal. Pleito de reconsideração da decisão agravada ou, subsidiariamente, submissão do feito ao órgão colegiado para reforma do decisum e reconhecimento da nulidade da prova digital e do afastamento da majorante do art. 226, II, do Código Penal.\nII. QUESTÃO EM DISCUSSÃO\n4. A questão em discussão consiste em saber se alegadas irregularidades na perícia digital realizada em aparelho celular da vítima, em especial a ausência de cópia forense integral e a documentação apenas dos dados reputados relevantes, caracterizam quebra da cadeia de custódia apta a ensejar a nulidade da prova.\n5. Outra questão em discussão consiste em saber se o parentesco por afinidade (tio por afinidade) configura relação de autoridade suficiente para a incidência da causa de aumento de pena do art. 226, II, do Código Penal e se o afastamento dessa majorante demandaria reexame de matéria fático-probatória, vedado em recurso especial (Súmula 7/STJ).\nIII. RAZÕES DE DECIDIR\n6. A disciplina da cadeia de custódia introduzida pelos arts. 158-A a 158-F do Código de Processo Penal não institui nulidade automática da prova diante de eventuais imperfeições formais na documentação das etapas de tratamento do vestígio, devendo-se verificar se foram preservadas a rastreabilidade, a autenticidade e a confiabilidade do elemento probatório.\n7. Nas provas digitais, o requisito essencial é a adoção de procedimentos técnicos idôneos de extração, preservação e análise de dados por órgão oficial de criminalística, aptos a evidenciar a integridade do conteúdo examinado, não sendo exigida, para a validade da prova, a reprodução indiscriminada de todo o conteúdo armazenado no dispositivo.\n8. No caso concreto, o aparelho celular da vítima foi periciado por órgão oficial, mediante técnica própria de informática forense, com elaboração de laudo que descreveu as etapas do exame e registrou as comunicações relevantes entre acusado e vítima, o qual foi juntado aos autos e permaneceu acessível à defesa, inclusive em versão de alta resolução, viabilizando o pleno contraditório e a ampla defesa.\n9. A circunstância de o laudo não conter cópia integral de todos os dados existentes no aparelho, mas apenas dos trechos considerados pertinentes à investigação, não se confunde com perda ou extravio de prova nem, por si só, caracteriza quebra da cadeia de custódia, especialmente diante da necessidade de se evitar exposição indevida de informações pessoais da vítima estranhas ao fato investigado.\n10. Os precedentes que reconheceram quebra de cadeia de custódia em provas digitais, como o RHC 218.358/PI e o AgRg no RHC 143.169/RJ, referem-se a hipóteses de extravio do material original ou ausência completa de documentação das etapas de arrecadação, armazenamento e análise dos equipamentos apreendidos, situações diversas da verificada nos autos, em que não houve extravio nem indício de manipulação indevida do dispositivo ou de alteração do conteúdo examinado.\n11. A defesa dispunha de mecanismos específicos de controle da atividade pericial previstos no art. 159, § 6º, do Código de Processo Penal, formulação de quesitos, indicação de assistente técnico e exame do material periciado no órgão oficial, que não foram exercidos no momento oportuno, não sendo possível, na via estreita do recurso especial, reabrir a discussão probatória.\n12. Quanto à causa de aumento do art. 226, II, do Código Penal, o Tribunal de origem assentou que o agravante é casado com a tia da vítima, configurando tio por afinidade, e que exercia autoridade sobre a menor, que pernoitava em sua residência sob seus cuidados e vigilância, quadro fático que evidencia a relação de autoridade e afasta a tese de inexistência da majorante.\n13. O entendimento consolidado desta Corte Superior é no sentido de que o preceito do art. 226, II, do Código Penal abrange todo agente que, por qualquer título, detenha autoridade sobre a vítima, alcançando o parentesco por afinidade, de modo que a condição de tio por afinidade, aliada ao contexto de guarda e vigilância da menor, autoriza a incidência da causa de aumento.\n14. A revisão das conclusões das instâncias ordinárias quanto à integridade da prova digital produzida e à efetiva existência de relação de autoridade do agravante sobre a vítima demandaria reexame do conjunto fático-probatório, providência vedada na via do recurso especial, à luz da Súmula 7 do Superior Tribunal de Justiça.\n15. O recurso especial possui natureza excepcional, de fundamentação vinculada, destinado à uniformização da interpretação da lei federal, não se prestando ao rejulgamento da causa ou à rediscussão da valoração das provas como se instância ordinária fosse.\nIV. DISPOSITIVO E TESE\n16. Resultado do Julgamento: Agravo regimental desprovido, mantendo-se a decisão monocrática que não conheceu do recurso especial e preservando-se a validade da prova digital e a incidência da causa de aumento do art. 226, II, do Código Penal.\nTese de julgamento:\n1. Irregularidades formais na documentação da prova digital não acarretam, por si sós, nulidade por quebra da cadeia de custódia, desde que preservadas a autenticidade, a integridade e a rastreabilidade do vestígio e assegurado o contraditório à defesa.\n2. A ausência de cópia forense integral ou de reprodução de todo o conteúdo do dispositivo digital não configura quebra da cadeia de custódia quando o laudo pericial, elaborado por órgão oficial, documenta de forma idônea os dados relevantes ao objeto da investigação e permanece acessível às partes.\n3. A causa de aumento de pena prevista no art. 226, II, do Código Penal incide sobre todo agente que, por qualquer título, detenha autoridade sobre a vítima, inclusive em razão de parentesco por afinidade, como na hipótese de tio por afinidade que exerce cuidados e vigilância sobre menor.\n4. É inviável, em recurso especial, o reexame da conclusão das instâncias ordinárias acerca da existência de relação de autoridade e da regularidade da cadeia de custódia da prova digital, em razão do óbice da Súmula 7 do Superior Tribunal de Justiça.\nDispositivos relevantes citados: CPP, arts. 158-A a 158-F; CPP, art. 159, § 6º; CPP, art. 619; CP, art. 226, II; Súmula 7/STJ.\nJurisprudência relevante citada: STJ, RHC 218.358/PI, Sexta Turma; STJ, AgRg no RHC 143.169/RJ.","cit":"(AgRg no AREsp n. 3.038.419/AM, relator Ministro Joel Ilan Paciornik, Quinta Turma, julgado em 10/3/2026, DJEN de 17/3/2026.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202503297247&dt_publicacao=17/03/2026","origem":"Pesquisa \"prova digital\" [posição 47]","grupo":"Reexame Vedado em Recurso Especial"},{"id":"j600493737","eixo":"e11","trib":"STJ","classe":"AgRg no RHC 232.174/RS","registro":"2026/0049373-7","rel":"Nilsoni de Freitas","conv":"Desembargadora Convocada do TJDFT","relac":"","orgao":"6ª T.","data":"08/10/2026","dje":"13/10/2026","ementa":"DIREITO PROCESSUAL PENAL. AGRAVO REGIMENTAL EM RECURSO EM HABEAS CORPUS. CADEIA DE CUSTÓDIA DE PROVA DIGITAL. ACESSO A ELEMENTOS DE PROVA. SÚMULA VINCULANTE N. 14. VIA ESTREITA DO HABEAS CORPUS. RECURSO NÃO PROVIDO.\nI. Caso em exame\n1. Agravo regimental interposto contra decisão monocrática que negou provimento a recurso em habeas corpus.\n2. Recorrente denunciado pela suposta prática de tráfico de drogas e associação para tal fim. A defesa sustenta quebra da cadeia de custódia dos dados extraídos de aparelhos celulares, seleção de trechos e negativa de acesso integral ao conteúdo (UFED Reader do Cellebrite), com ofensa à Súmula Vinculante n. 14, postulando a nulidade das provas digitais e, subsidiariamente, o franqueamento de acesso integral.\n3. Tribunal de origem não conheceu do habeas corpus por inadequação da via. A decisão agravada consignou inexistência de indícios de adulteração da prova, franqueamento de acesso aos elementos documentados e necessidade de dilação probatória para eventual exame da cadeia de custódia.\nII. Questão em discussão\n4. Há quatro questões em discussão: (i) saber se a alegada quebra da cadeia de custódia dos dados digitais extraídos dos celulares apreendidos autoriza a nulidade das provas; (ii) saber se a seleção de trechos implica cerceamento de defesa ou invalidação da prova; (iii) saber se houve violação à ampla defesa e ao contraditório, com descumprimento da Súmula Vinculante n. 14, a justificar o acesso integral ao UFED Reader do Cellebrite; e (iv) saber se o recurso em habeas corpus comporta o reexame aprofundado do conjunto fático-probatório para aferir a higidez da cadeia de custódia e da prova digital.\nIII. Razões de decidir\n5. A quebra da cadeia de custódia não configura nulidade automática e se relaciona à eficácia da prova, impondo a demonstração concreta de risco de adulteração. No caso, a defesa não comprovou qualquer interferência ou alteração no iter probatório; a extração de dados ocorreu após autorização judicial e, aparentemente, com observância de procedimentos técnicos, sem indícios de mácula.\n6. É legítima a seleção, pela perícia, de elementos relevantes ao objeto da investigação, não se exigindo a juntada ou transcrição integral de todo o conteúdo armazenado, desde que assegurado às partes o acesso aos elementos que fundamentam a acusação, inexistindo cerceamento de defesa.\n7. Não houve violação aos princípios da ampla defesa e do contraditório. O juízo de origem franqueou acesso aos expedientes relacionados ao caso e diligenciou quanto aos pedidos defensivos. A Súmula Vinculante n. 14 assegura acesso aos elementos já documentados, não abrangendo diligências em curso ou informações sigilosas de terceiros.\n8. O reexame aprofundado do conjunto fático-probatório para infirmar as conclusões da origem sobre a higidez da prova é inviável na via estreita do habeas corpus e de seu agravo regimental.\nIV. Dispositivo\n9. Agravo regimental não provido.","cit":"(AgRg no RHC n. 232.174/RS, relatora Ministra Nilsoni de Freitas (Desembargadora Convocada do TJDFT), Sexta Turma, julgado em 8/10/2026, DJEN de 13/10/2026.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202600493737&dt_publicacao=13/10/2026","origem":"Pesquisa \"prova digital\" [posição 48]","grupo":"Acesso da Defesa e Preclusão"},{"id":"j502029600","eixo":"e11","trib":"STJ","classe":"EDcl no AgRg no AREsp 2.960.580/PR","registro":"2025/0202960-0","rel":"Sebastião Reis Júnior","conv":"","relac":"","orgao":"6ª T.","data":"17/12/2025","dje":"22/12/2025","ementa":"DIREITO PROCESSUAL PENAL. EMBARGOS DE DECLARAÇÃO EM AGRAVO REGIMENTAL EM AGRAVO EM RECURSO ESPECIAL. QUEBRA DA CADEIA DE CUSTÓDIA. PROVA DIGITAL. PRECLUSÃO. EMBARGOS DE DECLARAÇÃO REJEITADOS.\n\nI. CASO EM EXAME\n1. Embargos de declaração opostos à decisão que rejeitou alegação de nulidade na cadeia de custódia de prova digital, com fundamento na ausência de comprovação de quebra da cadeia de custódia e na preclusão da defesa em requerer perícia técnica durante a instrução processual.\n2. O embargante alegou omissão na decisão, sustentando que a mera inobservância das regras de coleta, manipulação e preservação previstas nos arts. 158-A a 158-F do Código de Processo Penal seria suficiente para a inadmissibilidade da prova, independentemente da demonstração de manipulação ou fraude.\n3. O embargante também argumentou pela inaplicabilidade da preclusão, considerando que a produção de prova pericial de manipulação não seria obrigatória, especialmente diante da ausência de registro do manuseio e das hashes, o que inviabilizaria a reconstituição do caminho probatório.\n\nII. QUESTÃO EM DISCUSSÃO\n4. A questão em discussão consiste em saber se houve omissão na decisão embargada ao não enfrentar precedentes que reconhecem a quebra da cadeia de custódia pela mera inobservância das regras de coleta, manipulação e preservação de provas digitais, e se a ausência de perícia técnica comprometeu a validade da prova, considerando a preclusão da defesa em requerer tal análise durante a instrução processual.\n\nIII. RAZÕES DE DECIDIR\n5. Os embargos de declaração, conforme o art. 619 do Código de Processo Penal, destinam-se a sanar vícios de ambiguidade, obscuridade, contradição ou omissão no julgado.\n6. A decisão embargada enfrentou todas as questões essenciais à controvérsia, incluindo a alegação de quebra da cadeia de custódia, com fundamentação idônea e suficiente, afastando a alegação de omissão.\n7. A jurisprudência do STJ estabelece que a quebra da cadeia de custódia deve ser comprovada durante a instrução processual, sendo indispensável a realização de perícia técnica nos aparelhos apreendidos para verificar eventual adulteração.\n8. A defesa não demonstrou concretamente a adulteração da prova nem requereu perícia técnica sobre os aparelhos durante a instrução processual, configurando preclusão quanto à alegação de nulidade.\n9. A manipulação dos aparelhos por agentes policiais, sem uso de técnica de espelhamento, não caracteriza, por si só, quebra da cadeia de custódia, especialmente na ausência de prova de má-fé ou adulteração dos dados.\n10. Foi assegurado à defesa o acesso às mídias contendo a integralidade dos diálogos interceptados, mas a parte permaneceu inerte e não solicitou consulta à íntegra das interceptações em momento oportuno.\n11. A jurisprudência consolidada do STJ não reconhece a nulidade da prova digital pela mera inobservância das regras de coleta, manipulação e preservação, sendo indispensável a comprovação de quebra da cadeia de custódia.\n\nIV. DISPOSITIVO E TESE\n12. Embargos de declaração rejeitados.\n\nTese de julgamento: 1. A quebra da cadeia de custódia de prova digital deve ser comprovada durante a instrução processual, sendo indispensável a realização de perícia técnica nos aparelhos apreendidos. 2. A ausência de requerimento de perícia técnica durante a instrução processual configura preclusão quanto à alegação de nulidade da prova. 3. A manipulação de aparelhos celulares por agentes policiais, sem uso de técnica de espelhamento, não caracteriza quebra da cadeia de custódia na ausência de prova de má-fé ou adulteração dos dados. 4. É assegurado à defesa o acesso à integralidade das mídias contendo diálogos interceptados, sendo dispensável a transcrição integral dos diálogos.\n\nDispositivos relevantes citados: CPP, arts. 158-A a 158-F, 565 e 619.\n\nJurisprudência relevante citada: STJ, AgRg no RHC 110.812/PR, Min. Leopoldo de Arruda Raposo (Desembargador convocado do TJ/PE), Quinta Turma, DJe 10/12/2019; STJ, Inq 1.658/DF, Min. Og Fernandes, Corte Especial, DJEN 11/3/2025; STJ, AgRg no HC 829.138/RN, Min. Messod Azulay Neto, Quinta Turma, DJe 14/2/2024; STJ, REsp 1.800.516/SP, Min. Laurita Vaz, Sexta Turma, DJe 25/6/2021; STJ, AgRg no RHC 191.053/SP, Min. Ribeiro Dantas, Quinta Turma, DJe 6/9/2024.","cit":"(EDcl no AgRg no AREsp n. 2.960.580/PR, relator Ministro Sebastião Reis Júnior, Sexta Turma, julgado em 17/12/2025, DJEN de 22/12/2025.)","link":"https://processo.stj.jus.br/SCON/GetInteiroTeorDoAcordao?num_registro=202502029600&dt_publicacao=22/12/2025","origem":"Pesquisa \"prova digital\" e \"quebra da cadeia de custódia\" [posição 8]","grupo":"Acesso da Defesa e Preclusão"}],"glossario":[{"t":"ABNT NBR ISO/IEC 27037","d":"Norma técnica com diretrizes para identificação, coleta, aquisição e preservação de evidência digital."},{"t":"ABNT NBR ISO/IEC 27042","d":"Norma técnica com diretrizes para análise e interpretação de evidência digital."},{"t":"ADB","d":"Android Debug Bridge, interface de comunicação com o aparelho por computador."},{"t":"Administrador de sistema autônomo","d":"Pessoa física ou jurídica que administra blocos de endereço IP específicos e o respectivo sistema autônomo de roteamento, cadastrada no ente nacional responsável pelo registro e pela distribuição de endereços IP referentes ao País [Lei 12.965/2014, art. 5º, IV]."},{"t":"Aplicações de internet","d":"Conjunto de funcionalidades acessadas por meio de um terminal conectado à internet [Lei 12.965/2014, art. 5º, VII]."},{"t":"Assinatura digital","d":"Mecanismo criptográfico que vincula um documento ou arquivo a seu autor e permite verificar se o conteúdo foi alterado após a assinatura; distingue-se da assinatura eletrônica simples por empregar certificação com chave criptográfica."},{"t":"Auditabilidade","d":"Propriedade de um conjunto de dados ou de um procedimento que permite a terceiro, mediante exame técnico independente, verificar a correção e a integridade das etapas realizadas."},{"t":"Autenticidade","d":"Garantia de que o documento digital mantém inalteradas sua origem e identidade institucional."},{"t":"Autopsy","d":"Plataforma de código aberto de análise forense digital com interface gráfica, desenvolvida pela Basis Technology."},{"t":"Azimute","d":"Ângulo, em graus, da direção para a qual o setor da antena aponta."},{"t":"BitLocker","d":"Recurso de cifragem de volume inteiro do Microsoft Windows."},{"t":"Bloqueador de escrita [write blocker]","d":"Mecanismo de hardware ou de software que bloqueia os comandos de gravação enviados ao dispositivo de armazenamento e preserva a mídia original durante a cópia forense."},{"t":"Busca reversa","d":"Consulta sobre os aparelhos que passaram por uma ou mais ERBs em certo período, que atinge terceiros indeterminados e exige minimização."},{"t":"Busca simultânea","d":"Recurso do X-Ways Forensics que procura cadeias de texto em ANSI, UTF-8 e UTF-16 diretamente na evidência, dispensado o pré-processamento."},{"t":"Cadeia de custódia [cadeia de custódia informacional]","d":"Conjunto de procedimentos que documenta a história cronológica do vestígio [posse, manuseio, coleta, guarda e análise], do reconhecimento ao descarte, e preserva a rastreabilidade do vestígio, para garantir a integridade, a idoneidade e a autenticidade da prova [CPP, arts. 158-A a 158-F, incluídos pela Lei 13.964/2019]. Por analogia, aplica-se à prova financeira como cadeia de custódia informacional: registro contínuo do trânsito da informação, desde a produção pelo setor obrigado até a juntada aos autos, com identificação dos agentes intervenientes."},{"t":"Caducidade do requerimento","d":"Perda de eficácia do requerimento de guarda cautelar pelo indeferimento do pedido de autorização judicial ou pela falta de protocolo do pedido em 60 dias."},{"t":"Caixa-preta","d":"Sistema que entrega um resultado e mantém oculto o caminho até o resultado."},{"t":"Carving","d":"Técnica de recuperação de arquivos a partir de assinaturas de conteúdo, no espaço bruto da mídia, independente da estrutura do sistema de arquivos."},{"t":"Certificado digital","d":"Documento eletrônico que associa uma chave criptográfica a uma pessoa física, jurídica ou dispositivo, emitido por autoridade certificadora, utilizado para assinatura digital e autenticação."},{"t":"Certificate pinning","d":"Fixação do certificado esperado do servidor, que bloqueia a interceptação do tráfego."},{"t":"CFTV","d":"Circuito fechado de televisão; sistema de videomonitoramento cujas imagens exigem extração forense do gravador."},{"t":"Closed-box","d":"Termo do NIST para o sistema opaco [caixa-preta]."},{"t":"Cobertura","d":"Porção de território alcançada pelo sinal de um setor, de forma irregular, condicionada por potência, relevo e obstáculos."},{"t":"Conexão à internet","d":"Habilitação de um terminal para envio e recebimento de pacotes de dados pela internet, mediante atribuição ou autenticação de um endereço IP [Lei 12.965/2014, art. 5º, V]."},{"t":"Congelamento","d":"Expressão forense para o requerimento de guarda cautelar de registros de conexão ou de acesso a aplicações, formulado por autoridade policial, autoridade administrativa ou Ministério Público ao provedor."},{"t":"CSRF","d":"Falha que permite forçar ação do usuário autenticado à revelia do usuário."},{"t":"Célula","d":"Área de cobertura de um setor de antena, com alcance de centenas de metros na cidade a dezenas de quilômetros no campo."},{"t":"Célula servidora","d":"ERB que atende o aparelho em determinado instante, escolhida pela rede segundo sinal e carga."},{"t":"Dado pessoal sensível","d":"Categoria de dado pessoal listada no art. 5º, II, da Lei 13.709/2018 [LGPD], sujeita a regime de tratamento mais restritivo, como o dado referente a origem racial ou étnica, convicção religiosa, opinião política e saúde."},{"t":"Dados cadastrais","d":"Informações de qualificação pessoal, filiação e endereço do usuário de um serviço."},{"t":"Dados de conexão e de conteúdo","d":"Dado de conexão é o registro de que houve comunicação [antena, horário]. Dado de conteúdo é o que foi dito ou trocado, cujo acesso exige autorização específica e mais estrita."},{"t":"Degradação temporal","d":"Fenômeno pelo qual a confiabilidade de um vestígio digital diminui com o decurso do tempo entre a
